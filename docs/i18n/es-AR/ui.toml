"Required" = "Obligatorio"
"Variant" = "Variante"
"Details" = "Detalles"
"Parameters" = "Parámetros"
"Constants" = "Constantes"
"Functions" = "Funciones"
"Definitions" = "Definiciones"
"Shorthand" = "Atajo"
"Positional" = "Posicional"
"Variadic" = "Variádico"
"Settable" = "Configurable con set"
"Default:" = "Por defecto:"
"Since:" = "Desde:"

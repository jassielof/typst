"Indicates that an element will be updated, and describes the types of updates the user agents, assistive technologies, and user can expect from the live region." = "Indica que un elemento se va a actualizar y describe los tipos de actualizaciones que pueden esperar los agentes de usuario, las tecnologías de asistencia y el usuario desde la región activa."
"Indicates that the element is not editable, but is otherwise operable. See related aria-disabled." = "Indica que el elemento no es editable, pero por lo demás se puede operar. Ver el atributo relacionado aria-disabled."

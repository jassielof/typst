"Indicates that the line number counter should be reset at the start of\nevery new page." = "Indica que el contador de números de línea se reinicia al comienzo de\ncada página nueva."
"Indicates that the line number counter spans the whole document, i.e.,\nit's never automatically reset." = "Indica que el contador de números de línea abarca todo el documento, es decir,\nnunca se reinicia automáticamente."

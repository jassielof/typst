# Variant/detail texts that come from Rust attributes and enum docs.
"A binary operator like `times`." = "Un operador binario como `times`."
"A browser or application window." = "Una ventana de navegador o de aplicación."
"A cell containing header information for a column." = "Una celda que contiene información de encabezado para una columna."
"A cell containing header information for a row in a grid." = "Una celda que contiene información de encabezado para una fila de una grilla."
"A cell in a grid or treegrid." = "Una celda de una grilla o de una grilla en árbol (treegrid)."
"A cell in a tabular container. See related gridcell." = "Una celda de un contenedor tabular. Ver el rol relacionado gridcell."
"A checkable input in a group of elements with the same role, only one of which can be checked at a time." = "Una entrada marcable dentro de un grupo de elementos con el mismo rol, de los cuales solo uno puede estar marcado a la vez."
"A checkable input that has three possible values: true, false, or mixed." = "Una entrada marcable con tres valores posibles: verdadero, falso o mixto."
"A checkable menuitem in a set of elements with the same role, only one of which can be checked at a time." = "Un elemento de menú marcable dentro de un conjunto de elementos con el mismo rol, de los cuales solo uno puede estar marcado a la vez."
"A closing delimiter, e.g. `)`." = "Un delimitador de cierre, p. ej., `)`."
"A collection of commonly used function buttons or controls represented in compact visual form." = "Un conjunto de botones o controles de uso frecuente, representados de forma visual compacta."
"A collection of navigational elements (usually links) for navigating the document or related documents." = "Un conjunto de elementos de navegación (generalmente enlaces) para navegar el documento o documentos relacionados."
"A composite widget containing a collection of one or more rows with one or more cells where some or all cells in the grid are focusable by using methods of two-dimensional navigation, such as directional arrow keys." = "Un widget compuesto que contiene una colección de una o más filas con una o más celdas, donde algunas o todas las celdas de la grilla pueden recibir el foco mediante métodos de navegación bidimensional, como las teclas de flecha."
"A composite widget containing a single-line textbox and another element, such as a listbox or grid, that can dynamically pop up to help the user set the value of the textbox." = "Un widget compuesto que contiene un cuadro de texto de una sola línea y otro elemento, como una lista o una grilla, que puede aparecer dinámicamente para ayudar al usuario a establecer el valor del cuadro de texto."
"A container for a collection of elements that form an image." = "Un contenedor para una colección de elementos que forman una imagen."
"A container for the resources associated with a tab, where each tab is contained in a tablist." = "Un contenedor para los recursos asociados a una pestaña, donde cada pestaña está contenida en una lista de pestañas (tablist)."
"A contextual popup that displays a description for an element." = "Una ventana emergente contextual que muestra una descripción de un elemento."
"A cursive style with custom letterform." = "Un estilo cursivo con letras de trazo personalizado."
"A definition of a term or concept. See related term." = "Una definición de un término o concepto. Ver el rol relacionado term."
"A delimiter that is the same on both sides, e.g. `|`." = "Un delimitador que es igual de ambos lados, p. ej., `|`."
"A dialog is a descendant window of the primary window of a web application. For HTML pages, the primary application window is the entire web document, i.e., the body element." = "Un diálogo es una ventana descendiente de la ventana principal de una aplicación web. En las páginas HTML, la ventana principal de la aplicación es todo el documento web, es decir, el elemento body."
"A divider that separates and distinguishes sections of content or groups of menuitems." = "Un divisor que separa y distingue secciones de contenido o grupos de elementos de menú."
"A document structural element." = "Un elemento estructural del documento."
"A document to render in the iframe." = "Un documento para renderizar en el iframe."
"A form of range that expects the user to select from among discrete choices." = "Un tipo de rango que espera que el usuario elija entre opciones discretas."
"A form of widget that performs an action but does not receive input data." = "Un tipo de widget que realiza una acción pero no recibe datos de entrada."
"A form widget that allows the user to make selections from a set of choices." = "Un widget de formulario que le permite al usuario elegir entre un conjunto de opciones."
"A generic type of widget that allows user input." = "Un tipo genérico de widget que admite entrada del usuario."
"A grammatical error was detected." = "Se detectó un error gramatical."
"A graphical object that controls the scrolling of content within a viewing area, regardless of whether the content is fully displayed within the viewing area." = "Un objeto gráfico que controla el desplazamiento del contenido dentro de un área de visualización, esté o no el contenido completamente visible en esa área."
"A grid whose rows can be expanded and collapsed in the same manner as for a tree." = "Una grilla cuyas filas se pueden expandir y contraer de la misma manera que en un árbol."
"A group of radio buttons." = "Un grupo de botones de opción."
"A grouping label providing a mechanism for selecting the tab content that is to be rendered to the user." = "Una etiqueta de agrupación que ofrece un mecanismo para elegir el contenido de pestaña que se muestra al usuario."
"A heading for a section of the page." = "Un título para una sección de la página."
"A landmark region that contains a collection of items and objects that, as a whole, combine to create a form. See related search." = "Una región de referencia (landmark) que contiene una colección de elementos y objetos que, en conjunto, forman un formulario. Ver el rol relacionado search."
"A landmark region that contains a collection of items and objects that, as a whole, combine to create a search facility. See related form and searchbox." = "Una región de referencia (landmark) que contiene una colección de elementos y objetos que, en conjunto, forman una herramienta de búsqueda. Ver los roles relacionados form y searchbox."
"A large operator like `sum`.\n\nIf the body is a single glyph, this class vertically centers it on the\nmath axis (where the fraction line sits) and stretches it vertically\nwhen in @math.display[`display`] style." = "Un operador grande como `sum`.\n\nSi el cuerpo es un único glifo, esta clase lo centra verticalmente sobre el\neje matemático (donde se ubica la línea de la fracción) y lo estira\nverticalmente en el estilo @math.display[`display`]."
"A large perceivable region that contains information about the parent document." = "Una región grande y perceptible que contiene información sobre el documento padre."
"A list of references to members of a group, such as a static table of contents." = "Una lista de referencias a los miembros de un grupo, como un índice de contenidos estático."
"A list of tab elements, which are references to tabpanel elements." = "Una lista de elementos de pestaña, que son referencias a elementos tabpanel."
"A menuitem with a checkable state whose possible values are true, false, or mixed." = "Un elemento de menú con un estado marcable cuyos valores posibles son verdadero, falso o mixto."
"A perceivable section containing content that is relevant to a specific, author-specified  purpose and sufficiently important that users will likely want to be able to navigate to the section easily and to have it listed in a summary of the page. Such a page summary could be generated dynamically by a user agent or assistive technology." = "Una sección perceptible que contiene contenido relevante para un propósito específico definido por el autor y lo bastante importante como para que los usuarios probablemente quieran navegar a ella fácilmente y verla listada en un resumen de la página. Un agente de usuario o una tecnología de asistencia podría generar ese resumen de forma dinámica."
"A perceivable section of content that typically contains a graphical document, images, code snippets, or example text. The parts of a figure MAY be user-navigable." = "Una sección perceptible de contenido que suele contener un documento gráfico, imágenes, fragmentos de código o texto de ejemplo. Las partes de una figura PUEDEN ser navegables por el usuario."
"A presentation of menu that usually remains visible and is usually presented horizontally." = "Una presentación de un menú que suele permanecer visible y mostrarse en horizontal."
"A region that contains mostly site-oriented content, rather than page-specific content." = "Una región que contiene sobre todo contenido propio del sitio, y no de la página en particular."
"A relation like `=` or `prec`." = "Una relación como `=` o `prec`."
"A removal from the document." = "Una eliminación del documento."
"A renderable structural containment unit in a document or application." = "Una unidad estructural renderizable de un documento o aplicación."
"A row of cells in a tabular container." = "Una fila de celdas en un contenedor tabular."
"A scrollable list of articles where scrolling may cause articles to be added to or removed from either end of the list." = "Una lista desplazable de artículos, donde el desplazamiento puede agregar o quitar artículos en cualquiera de los extremos de la lista."
"A section containing data arranged in rows and columns. See related grid." = "Una sección que contiene datos organizados en filas y columnas. Ver el rol relacionado grid."
"A section containing listitem elements. See related listbox." = "Una sección que contiene elementos listitem. Ver el rol relacionado listbox."
"A section of a page that consists of a composition that forms an independent part of a document, page, or site." = "Una sección de una página formada por una composición que constituye una parte independiente de un documento, una página o un sitio."
"A section quoted from another source." = "Una sección citada de otra fuente."
"A section whose content is parenthetic or ancillary to the main content of the resource." = "Una sección cuyo contenido es accesorio o complementario del contenido principal del recurso."
"A selectable item in a select list." = "Un elemento seleccionable de una lista de selección."
"A set of user interface objects which are not intended to be included in a page summary or table of contents by assistive technologies." = "Un conjunto de objetos de la interfaz de usuario que las tecnologías de asistencia no deben incluir en un resumen de la página ni en un índice de contenidos."
"A short alias of `american-psychological-association`" = "Un alias corto de `american-psychological-association`"
"A short alias of `british-medical-journal`" = "Un alias corto de `british-medical-journal`"
"A short alias of `chicago-notes`" = "Un alias corto de `chicago-notes`"
"A short alias of `cse-citation-sequence-brackets-8th-edition`" = "Un alias corto de `cse-citation-sequence-brackets-8th-edition`"
"A short alias of `cse-name-year`" = "Un alias corto de `cse-name-year`"
"A short alias of `institute-of-electrical-and-electronics-engineers`" = "Un alias corto de `institute-of-electrical-and-electronics-engineers`"
"A short alias of `modern-humanities-research-association-notes`" = "Un alias corto de `modern-humanities-research-association-notes`"
"A short alias of `modern-language-association`" = "Un alias corto de `modern-language-association`"
"A short alias of `nlm-citation-sequence-superscript`" = "Un alias corto de `nlm-citation-sequence-superscript`"
"A short alias of `nlm-citation-sequence`" = "Un alias corto de `nlm-citation-sequence`"
"A short alias of `public-library-of-science`" = "Un alias corto de `public-library-of-science`"
"A single item in a list or directory." = "Un único elemento de una lista o directorio."
"A sort algorithm other than ascending or descending has been applied." = "Se aplicó un algoritmo de ordenamiento distinto del ascendente o descendente."
"A spelling error was detected." = "Se detectó un error ortográfico."
"A structure containing one or more focusable elements requiring user input, such as keyboard or gesture events, that do not follow a standard interaction pattern supported by a widget role." = "Una estructura que contiene uno o más elementos que pueden recibir el foco y requieren entrada del usuario, como eventos de teclado o de gestos, que no siguen un patrón de interacción estándar admitido por un rol de widget."
"A structure containing one or more row elements in a tabular container." = "Una estructura que contiene uno o más elementos de fila en un contenedor tabular."
"A structure that labels or summarizes the topic of its related section." = "Una estructura que rotula o resume el tema de la sección con la que se relaciona."
"A supporting section of the document, designed to be complementary to the main content at a similar level in the DOM hierarchy, but remains meaningful when separated from the main content." = "Una sección de apoyo del documento, pensada como complemento del contenido principal en un nivel similar de la jerarquía del DOM, pero que sigue teniendo sentido separada del contenido principal."
"A type of checkbox that represents on/off values, as opposed to checked/unchecked values. See related checkbox." = "Un tipo de casilla de verificación que representa valores de encendido/apagado, en lugar de marcado/desmarcado. Ver el rol relacionado checkbox."
"A type of dialog that contains an alert message, where initial focus goes to an element within the dialog. See related alert and dialog." = "Un tipo de diálogo que contiene un mensaje de alerta, en el que el foco inicial va a un elemento dentro del diálogo. Ver los roles relacionados alert y dialog."
"A type of input that allows free-form text as its value." = "Un tipo de entrada que admite texto libre como valor."
"A type of list that may contain sub-level nested groups that can be collapsed and expanded." = "Un tipo de lista que puede contener grupos anidados de nivel inferior que se pueden contraer y expandir."
"A type of live region containing a numerical counter which indicates an amount of elapsed time from a start point, or the time remaining until an end point." = "Un tipo de región activa que contiene un contador numérico que indica el tiempo transcurrido desde un punto de inicio o el tiempo restante hasta un punto final."
"A type of live region where new information is added in meaningful order and old information may disappear. See related marquee." = "Un tipo de región activa en la que se agrega información nueva en un orden significativo y la información vieja puede desaparecer. Ver el rol relacionado marquee."
"A type of live region where non-essential information changes frequently. See related log." = "Un tipo de región activa en la que la información no esencial cambia con frecuencia. Ver el rol relacionado log."
"A type of live region whose content is advisory information for the user but is not important enough to justify an alert, often but not necessarily presented as a status bar." = "Un tipo de región activa cuyo contenido es información orientativa para el usuario, pero no lo bastante importante como para justificar una alerta; suele, aunque no necesariamente, presentarse como una barra de estado."
"A type of live region with important, and usually time-sensitive, information. See related alertdialog and status." = "Un tipo de región activa con información importante y, por lo general, sensible al tiempo. Ver los roles relacionados alertdialog y status."
"A type of textbox intended for specifying search criteria. See related textbox and search." = "Un tipo de cuadro de texto pensado para especificar criterios de búsqueda. Ver los roles relacionados textbox y search."
"A type of widget that offers a list of choices to the user." = "Un tipo de widget que ofrece al usuario una lista de opciones."
"A unary operator like `not`." = "Un operador unario como `not`."
"A user input where the user selects a value from within a given range." = "Una entrada del usuario en la que se selecciona un valor dentro de un rango dado."
"A widget that allows the user to select one or more items from a list of choices. See related combobox and list." = "Un widget que le permite al usuario seleccionar uno o más elementos de una lista de opciones. Ver los roles relacionados combobox y list."
"A widget that may contain navigable descendants or owned children." = "Un widget que puede contener descendientes navegables o hijos propios."
"A word or phrase with a corresponding definition. See related definition." = "Una palabra o frase con su definición correspondiente. Ver el rol relacionado definition."
"Abbreviation." = "Abreviatura."
"Additional resources for the document." = "Recursos adicionales para el documento."
"Address of the hyperlink." = "Dirección del hipervínculo."
"Address of the resource." = "Dirección del recurso."
"Advisory information for the element." = "Información orientativa sobre el elemento."
"Allow the color's alpha component to be set." = "Permite establecer el componente alfa del color."
"Alphanumeric" = "Alfanumérico"
"Alternate voice." = "Voz alternativa."
"Alternative label to use for the header cell when referencing the cell in other contexts." = "Etiqueta alternativa que se usa para la celda de encabezado cuando se la referencia en otros contextos."
"An ARIA role." = "Un rol ARIA."
"An accent character." = "Un carácter de acento."
"An addition to the document." = "Una adición al documento."
"An alternative representation of the document." = "Una representación alternativa del documento."
"An element containing content that assistive technology users may want to browse in a reading mode." = "Un elemento que contiene contenido que los usuarios de tecnologías de asistencia pueden querer explorar en un modo de lectura."
"An element that displays the progress status for tasks that take a long time." = "Un elemento que muestra el progreso de tareas que tardan mucho."
"An element whose implicit native role semantics will not be mapped to the accessibility API. See synonym none." = "Un elemento cuya semántica nativa implícita de rol no se mapeará a la API de accesibilidad. Ver el sinónimo none."
"An input representing a range of values that can be set by the user." = "Una entrada que representa un rango de valores que el usuario puede establecer."
"An input that allows for user-triggered actions when clicked or pressed. See related link." = "Una entrada que permite acciones disparadas por el usuario al hacer clic o presionarla. Ver el rol relacionado link."
"An interactive component of a graphical user interface (GUI)." = "Un componente interactivo de una interfaz gráfica de usuario (GUI)."
"An interactive reference to an internal or external resource that, when activated, causes the user agent to navigate to that resource. See related button." = "Una referencia interactiva a un recurso interno o externo que, al activarse, hace que el agente de usuario navegue a ese recurso. Ver el rol relacionado button."
"An intermediate value between true and false." = "Un valor intermedio entre verdadero y falso."
"An opening delimiter, e.g. `(`." = "Un delimitador de apertura, p. ej., `(`."
"An operator that can be both unary or binary like `+`." = "Un operador que puede ser unario o binario, como `+`."
"An option in a set of choices contained by a menu or menubar." = "Una opción dentro de un conjunto de opciones contenido en un menú o una barra de menús."
"An option item of a tree. This is an element within a tree that may be expanded or collapsed if it contains a sub-level group of tree item elements." = "Un elemento de opción de un árbol. Es un elemento dentro de un árbol que se puede expandir o contraer si contiene un grupo de nivel inferior de elementos de árbol."
"Applicable media." = "Medios aplicables."
"Artifacts arising from paginating the document not covered by other\nartifact types. This category generally applies if this artifact would\nnot appear in your document if it was a website instead. If your\nartifact is covered by other categories, prefer them over this." = "Artefactos que surgen de paginar el documento y que no están cubiertos por otros\ntipos de artefacto. Esta categoría se aplica, en general, si el artefacto\nno aparecería en tu documento si fuera un sitio web. Si tu\nartefacto está cubierto por otras categorías, preferí esas categorías."
"Associate the label with form control." = "Asocia la etiqueta con un control de formulario."
"Associates the element with a form element." = "Asocia el elemento con un elemento de formulario."
"Association list consisting of zero or more name-value groups." = "Lista de asociación formada por cero o más grupos de nombre y valor."
"Audio player." = "Reproductor de audio."
"Automatically focus the element when the page is loaded." = "Enfoca automáticamente el elemento cuando se carga la página."
"Background of a page or a graphical element. This artifact kind was\nadded in PDF 1.7. However, due to requirements in the PDF 1.7\nspecification that later specifications lifted, Typst only uses this\nartifact type in PDF 2.0. If you use it in a PDF 1.7 or earlier, Typst\nwill use the `{\"other\"}` type instead." = "Fondo de una página o de un elemento gráfico. Este tipo de artefacto se\nagregó en PDF 1.7. Sin embargo, por requisitos de la especificación de\nPDF 1.7 que las especificaciones posteriores eliminaron, Typst solo usa\neste tipo de artefacto en PDF 2.0. Si lo usás en PDF 1.7 o anterior, Typst\nusará en su lugar el tipo `{\"other\"}`."
"Base URL and default target navigable for hyperlinks and forms." = "URL base y navegable de destino predeterminado para hipervínculos y formularios."
"Bates numbering." = "Numeración Bates."
"Big-endian byte order: The highest-value byte is at the beginning of the\nbytes." = "Orden de bytes big-endian: el byte de mayor valor está al comienzo de los\nbytes."
"Black weight (900)." = "Grosor negro (900)."
"Block of preformatted text." = "Bloque de texto preformateado."
"Bold weight (700)." = "Grosor negrita (700)."
"Button control." = "Control de botón."
"Bypass form control validation for form submission." = "Omite la validación de los controles del formulario al enviarlo."
"Calculated output value." = "Valor de salida calculado."
"Canonical composition where e.g. accented letters are turned into a\nsingle Unicode codepoint." = "Composición canónica, en la que, por ejemplo, las letras acentuadas se convierten en\nun único punto de código Unicode."
"Canonical decomposition where e.g. accented letters are split into a\nseparate base and diacritic." = "Descomposición canónica, en la que, por ejemplo, las letras acentuadas se dividen en\nuna base y un signo diacrítico separados."
"Caption for a form control." = "Epígrafe de un control de formulario."
"Caption for details." = "Epígrafe de los detalles."
"Caption for fieldset." = "Epígrafe de un fieldset."
"Caption for figure." = "Epígrafe de una figura."
"Cell" = "Celda"
"Character encoding declaration." = "Declaración de la codificación de caracteres."
"Character encodings to use for form submission." = "Codificaciones de caracteres que se usan al enviar el formulario."
"Child navigable." = "Navegable hijo."
"Circular stroke cap centered at the stroke's end point." = "Terminación de trazo circular centrada en el punto final del trazo."
"Classes to which the element belongs." = "Clases a las que pertenece el elemento."
"Closes the curve with a smooth segment that takes into account the\ncontrol point opposite the start point." = "Cierra la curva con un segmento suave que tiene en cuenta el\npunto de control opuesto al punto de inicio."
"Closes the curve with a straight line." = "Cierra la curva con una línea recta."
"Color to use when customizing a site's icon (for rel=\"mask-icon\")." = "Color que se usa al personalizar el ícono de un sitio (para rel=\"mask-icon\")."
"Computer code." = "Código de computadora."
"Computer output." = "Salida de computadora."
"Contact information for a page or article element." = "Información de contacto de una página o de un elemento article."
"Container for document metadata." = "Contenedor de los metadatos del documento."
"Container for options for combo box control." = "Contenedor de las opciones de un control de lista combinada (combo box)."
"Container for search controls." = "Contenedor de controles de búsqueda."
"Container for the dominant contents of the document." = "Contenedor del contenido dominante del documento."
"Content for corresponding dt element(s)." = "Contenido de los elementos dt correspondientes."
"Content that represents a mathematical expression." = "Contenido que representa una expresión matemática."
"Coordinates for the shape to be created in an image map. Expects an array of floating point numbers." = "Coordenadas de la forma que se creará en un mapa de imagen. Espera un array de números de punto flotante."
"Creates a customized built-in element." = "Crea un elemento integrado personalizado."
"Cryptographic nonce used in Content Security Policy checks." = "Nonce criptográfico que se usa en las comprobaciones de la Content Security Policy."
"Current value of the element." = "Valor actual del elemento."
"Date and (optionally) time of the change." = "Fecha y (opcionalmente) hora del cambio."
"Decoding hint to use when processing this image for presentation." = "Sugerencia de decodificación que se usa al procesar esta imagen para su presentación."
"Default navigable for hyperlink navigation and form submission." = "Navegable predeterminado para la navegación por hipervínculos y el envío de formularios."
"Default setting for autofill feature for controls in the form." = "Configuración predeterminada de la función de autocompletado para los controles del formulario."
"Defer script execution." = "Difiere la ejecución del script."
"Defines a human-readable, author-localized description for the role of an element." = "Define una descripción legible por personas, localizada por el autor, del rol de un elemento."
"Defines a short hint (a word or short phrase) intended to aid the user with data entry when the control has no value. A hint could be a sample value or a brief description of the expected format." = "Define una pista breve (una palabra o frase corta) pensada para ayudar al usuario a ingresar datos cuando el control no tiene valor. La pista puede ser un valor de ejemplo o una descripción breve del formato esperado."
"Defines a string value that labels the current element. See related aria-labelledby." = "Define un valor de cadena de texto que rotula el elemento actual. Ver el atributo relacionado aria-labelledby."
"Defines an element's column index or position with respect to the total number of columns within a table, grid, or treegrid. See related aria-colcount and aria-colspan." = "Define el índice o la posición de columna de un elemento respecto del total de columnas de una tabla, grilla o grilla en árbol. Ver los atributos relacionados aria-colcount y aria-colspan."
"Defines an element's number or position in the current set of listitems or treeitems. Not required if all elements in the set are present in the DOM. See related aria-setsize." = "Define el número o la posición de un elemento en el conjunto actual de listitems o treeitems. No es necesario si todos los elementos del conjunto están presentes en el DOM. Ver el atributo relacionado aria-setsize."
"Defines an element's row index or position with respect to the total number of rows within a table, grid, or treegrid. See related aria-rowcount and aria-rowspan." = "Define el índice o la posición de fila de un elemento respecto del total de filas de una tabla, grilla o grilla en árbol. Ver los atributos relacionados aria-rowcount y aria-rowspan."
"Defines the current value for a range widget. See related aria-valuetext." = "Define el valor actual de un widget de rango. Ver el atributo relacionado aria-valuetext."
"Defines the hierarchical level of an element within a structure." = "Define el nivel jerárquico de un elemento dentro de una estructura."

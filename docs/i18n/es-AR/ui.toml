"Images to use in different situations, e.g., high-resolution displays, small monitors, etc. Expects an array of dictionaries with the keys `src` (string) and `width` (integer) or `density` (float)." = "Imágenes para usar en distintas situaciones, p. ej., pantallas de alta resolución, monitores chicos, etc. Espera un array de diccionarios con las claves `src` (cadena de texto) y `width` (entero) o `density` (flotante)."
"Importance." = "Importancia."
"Inaccurate text." = "Texto inexacto."

"Image sizes for different page layouts. Expects an array of dictionaries with the keys `condition` (string) and `size` (length)." = "Tamaños de imagen para distintos diseños de página. Espera un array de diccionarios con las claves `condition` (cadena de texto) y `size` (longitud)."

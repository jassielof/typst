"\n            A mathematical space of width five eighteenths of an em.\n\n            ```example\n            $ x thick y $\n            ```\n            " = "\n            Un espacio matemático de ancho cinco dieciochoavos de em.\n\n            ```example\n            $ x thick y $\n            ```\n            "
"\n            A mathematical space of width one sixth of an em.\n\n            ```example\n            $\n              x y \\\n              x thin y\n            $\n            ```\n            " = "\n            Un espacio matemático de ancho un sexto de em.\n\n            ```example\n            $\n              x y \\\n              x thin y\n            $\n            ```\n            "
"\n            A mathematical space of width two ninths of an em.\n\n            ```example\n            $ (lambda x. x) med y $\n            ```\n            " = "\n            Un espacio matemático de ancho dos novenos de em.\n\n            ```example\n            $ (lambda x. x) med y $\n            ```\n            "
"\n            A one-em wide mathematical space.\n\n            ```example\n            $\n              f(x) = cases(\n                1/x quad &\"if\" x != 0,\n                0 quad &\"otherwise\",\n              )\n            $\n            ```\n            " = "\n            Un espacio matemático de un em de ancho.\n\n            ```example\n            $\n              f(x) = cases(\n                1/x quad &\"if\" x != 0,\n                0 quad &\"otherwise\",\n              )\n            $\n            ```\n            "
"\n            A two-em wide mathematical space.\n\n            ```example\n            $\n              f(x) = cases(\n                1/x wide &\"if\" x != 0,\n                0 wide &\"otherwise\",\n              )\n            $\n            ```\n            " = "\n            Un espacio matemático de dos em de ancho.\n\n            ```example\n            $\n              f(x) = cases(\n                1/x wide &\"if\" x != 0,\n                0 wide &\"otherwise\",\n              )\n            $\n            ```\n            "
"\n            Archimedes' constant ($pi$).\n\n            This is the ratio of a circle's circumference to its diameter.\n\n            ```example\n            #calc.pi\n            ```\n            " = "\n            Constante de Arquímedes ($pi$).\n\n            Es la razón entre la circunferencia de un círculo y su diámetro.\n\n            ```example\n            #calc.pi\n            ```\n            "
"\n            Euler's number ($e$).\n\n            This is the base of the natural logarithm and the exponential function.\n\n            ```example\n            #calc.e\n            ```\n            " = "\n            Número de Euler ($e$).\n\n            Es la base del logaritmo natural y de la función exponencial.\n\n            ```example\n            #calc.e\n            ```\n            "
"\n            Infinity ($+oo$) as a value.\n\n            This is the same value as @float.inf. See the corresponding\n            documentation for more details.\n            " = "\n            Infinito ($+oo$) como valor.\n\n            Es el mismo valor que @float.inf. Consultá la documentación\n            correspondiente para más detalles.\n            "
"\n            Makes external inputs available to the project.\n\n            An input specified in the command line as `--input key=value` becomes\n            available under `{sys.inputs.key}` as `{\"value\"}`. To include spaces in\n            the value, it may be enclosed with single or double quotes.\n\n            The value is always of type @str[string]. More complex data may be\n            parsed manually using functions like @json.\n            " = "\n            Hace que entradas externas estén disponibles para el proyecto.\n\n            Una entrada especificada en la línea de comandos como `--input key=value` queda\n            disponible en `{sys.inputs.key}` como `{\"value\"}`. Para incluir espacios en\n            el valor, se lo puede encerrar entre comillas simples o dobles.\n\n            El valor siempre es de tipo @str[cadena de texto]. Los datos más complejos se pueden\n            analizar manualmente con funciones como @json.\n            "
"\n            The circumference of a unit circle ($tau$).\n\n            The constant $tau$ is defined by the relation $tau = 2 pi$.\n\n            ```example\n            #calc.tau \\\n            #(2 * calc.pi)\n            ```\n            " = "\n            La circunferencia de un círculo unitario ($tau$).\n\n            La constante $tau$ se define por la relación $tau = 2 pi$.\n\n            ```example\n            #calc.tau \\\n            #(2 * calc.pi)\n            ```\n            "
"\n            The currently active Typst compiler version.\n\n            ```example\n            #sys.version\n            ```\n            " = "\n            La versión del compilador de Typst actualmente activa.\n\n            ```example\n            #sys.version\n            ```\n            "

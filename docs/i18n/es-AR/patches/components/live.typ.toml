# Line patches for docs/components/live.typ (see docs/src/i18n.rs).
# The source links point to this fork (same files as upstream) at the commit that was built.
"\"https://github.com/typst/typst/blob/\" + stdx.commit + file + \"#L\" + str(line)" = "stdx.revision.source-base + file + \"#L\" + str(line)"

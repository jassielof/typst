# Line patches for docs/content/changelog/0.12.0.typ (see docs/src/i18n.rs).
"= Highlights <highlights>" = "= Novedades destacadas <highlights>"
"- Added support for multi-column floating @place.scope[placement] and @figure.scope[figures]" = "- Se agregó compatibilidad con @place.scope[ubicación] flotante y @figure.scope[figuras] de varias columnas"
"- Added support for automatic @par.line[line numbering] (often used in academic papers)" = "- Se agregó compatibilidad con la @par.line[numeración automática de líneas] (muy usada en trabajos académicos)"
"- Typst's layout engine is now multithreaded. Typical speedups are 2-3x for larger documents. The multithreading operates on page break boundaries, so explicit page breaks are necessary for it to kick in." = "- El motor de diseño de Typst ahora es multihilo. Las aceleraciones típicas son de 2 a 3 veces en documentos grandes. El multihilo opera en los límites de los saltos de página, así que hacen falta saltos de página explícitos para que entre en juego."
"- Paragraph justification was optimized with a new two-pass algorithm. Speedups are larger for shorter paragraphs and go up to 6x." = "- Se optimizó la justificación de párrafos con un nuevo algoritmo de dos pasadas. Las aceleraciones son mayores en párrafos más cortos y llegan hasta 6 veces."
"- Highly reduced PDF file sizes due to better font subsetting (thanks to #gh(\"LaurenzV\"))" = "- Se redujeron mucho los tamaños de los archivos PDF gracias a un mejor subconjunto de fuentes (gracias a #gh(\"LaurenzV\"))"
"- Emoji are now exported properly in PDF" = "- Los emojis ahora se exportan correctamente en PDF"
"- Added initial support for PDF/A. For now, only the PDF/A-2b profile is supported, but more is planned for the future." = "- Se agregó compatibilidad inicial con PDF/A. Por ahora solo se admite el perfil PDF/A-2b, pero hay más planeado para el futuro."
"- Added various options for configuring the CLI's environment (fonts, package paths, etc.)" = "- Se agregaron varias opciones para configurar el entorno de la CLI (fuentes, rutas de paquetes, etc.)"
"- Text show rules now match across multiple text elements" = "- Las reglas show de texto ahora coinciden a través de varios elementos de texto"
"- Block-level equations can now optionally break over multiple pages" = "- Las ecuaciones de bloque ahora pueden, opcionalmente, dividirse entre varias páginas"
"- Fixed a bug where some fonts would not print correctly on professional printers" = "- Se corrigió un error por el cual algunas fuentes no se imprimían correctamente en imprentas profesionales"
"- Fixed a long-standing bug which could cause headings to be orphaned at the bottom of the page" = "- Se corrigió un error histórico que podía dejar títulos huérfanos al pie de la página"
"= Layout <layout>" = "= Diseño <layout>"
"- Added support for multi-column floating placement and figures via @place.scope and @figure.scope.  Two-column documents should now prefer `{set page(columns: 2)}` over `{show: column.with(2)}` (see the @guides:page-setup:columns[Page Setup Guide])." = "- Se agregó compatibilidad con ubicación flotante y figuras de varias columnas mediante @place.scope y @figure.scope.  Para los documentos de dos columnas ahora conviene preferir `{set page(columns: 2)}` en lugar de `{show: column.with(2)}` (ver la @guides:page-setup:columns[Guía de configuración de página])."
"- Added @par.spacing property for configuring paragraph spacing. This should now be used instead of `{show par: set block(spacing: ..)}` *(Breaking change)*" = "- Se agregó la propiedad @par.spacing para configurar el espaciado entre párrafos. Ahora hay que usarla en lugar de `{show par: set block(spacing: ..)}` *(Cambio incompatible)*"
"- Block-level elements like lists, grids, and stacks now show themselves as blocks and are thus affected by all block properties (e.g. `stroke`) rather than just `spacing` *(Breaking change)*" = "- Los elementos de bloque como listas, grillas y pilas ahora se muestran a sí mismos como bloques y por lo tanto les afectan todas las propiedades de bloque (p. ej., `stroke`) y no solo `spacing` *(Cambio incompatible)*"
"- Added @block.sticky property which prevents a page break after a block" = "- Se agregó la propiedad @block.sticky, que impide un salto de página después de un bloque"
"- Added @place.flush function which forces all floating figures to be placed before any further content" = "- Se agregó la función @place.flush, que fuerza a que todas las figuras flotantes se ubiquen antes de cualquier contenido posterior"
"- Added @skew function" = "- Se agregó la función @skew"
"- Added `{auto}` option for @page.header and @page.footer which results in an automatic header/footer based on the numbering (which was previously inaccessible after a change)" = "- Se agregó la opción `{auto}` para @page.header y @page.footer, que produce un encabezado o pie automático basado en la numeración (que antes era inaccesible tras un cambio)"
"- Added `gap` and `justify` parameters to @repeat function" = "- Se agregaron los parámetros `gap` y `justify` a la función @repeat"
"- Added `width` and `height` parameters to the @measure function to define the space in which the content should be measured. Especially useful in combination with @layout." = "- Se agregaron los parámetros `width` y `height` a la función @measure para definir el espacio en el que se debe medir el contenido. Resulta especialmente útil combinado con @layout."
"- The height of a `block`, `image`, `rect`, `square`, `ellipse`, or `circle` can now be specified in @fraction[fractional units]" = "- La altura de un `block`, `image`, `rect`, `square`, `ellipse` o `circle` ahora se puede especificar en @fraction[unidades fraccionarias]"
"- The @scale function now supports absolute lengths for `x`, `y`, `factor`. This way an element of unknown size can be scaled to a fixed size." = "- La función @scale ahora admite longitudes absolutas para `x`, `y` y `factor`. Así, un elemento de tamaño desconocido se puede escalar a un tamaño fijo."
"- The values of `block.above` and `block.below` can now be retrieved in context expressions." = "- Los valores de `block.above` y `block.below` ahora se pueden obtener en expresiones de contexto."
"- Increased accuracy of conversions between absolute units (pt, mm, cm, in)" = "- Se aumentó la precisión de las conversiones entre unidades absolutas (pt, mm, cm, in)"
"- Fixed a bug which could cause headings to be orphaned at the bottom of the page" = "- Se corrigió un error que podía dejar títulos huérfanos al pie de la página"
"- Fixed footnotes within breakable blocks appearing on the page where the breakable block ends instead of at the page where the footnote marker is" = "- Se corrigió que las notas al pie dentro de bloques divisibles aparecieran en la página donde termina el bloque y no en la página donde está la marca de la nota"
"- Fixed numbering of nested footnotes and footnotes in floats" = "- Se corrigió la numeración de las notas al pie anidadas y de las notas al pie en elementos flotantes"
"- Fixed empty pages appearing when a @reference:context[context] expression wraps whole pages" = "- Se corrigió que aparecieran páginas vacías cuando una expresión de @reference:context[contexto] envuelve páginas enteras"
"- Fixed `{set block(spacing: x)}` behaving differently from `{set block(above: x, below: x)}`" = "- Se corrigió que `{set block(spacing: x)}` se comportara distinto de `{set block(above: x, below: x)}`"
"- Fixed behavior of @rotate and @scale with `{reflow: true}`" = "- Se corrigió el comportamiento de @rotate y @scale con `{reflow: true}`"
"- Fixed interaction of `{align(horizon)}` and `{v(1fr)}`" = "- Se corrigió la interacción entre `{align(horizon)}` y `{v(1fr)}`"
"- Fixed various bugs where floating placement would yield overlapping results" = "- Se corrigieron varios errores por los cuales la ubicación flotante producía resultados superpuestos"
"- Fixed a bug where widow/orphan prevention would unnecessarily move text into the next column" = "- Se corrigió un error por el cual la prevención de viudas y huérfanas movía texto innecesariamente a la columna siguiente"
"- Fixed @h.weak[weak spacing] not being trimmed at the start and end of lines in a paragraph (only at the start and end of paragraphs)" = "- Se corrigió que el @h.weak[espaciado débil] no se recortara al principio y al final de las líneas de un párrafo (solo al principio y al final de los párrafos)"
"- Fixed interaction of weak page break and @pagebreak.to" = "- Se corrigió la interacción entre el salto de página débil y @pagebreak.to"
"- Fixed compilation output of a single weak page break" = "- Se corrigió la salida de compilación de un único salto de página débil"
"- Fixed crash when @pad[padding] by `{100%}`" = "- Se corrigió un fallo con @pad[relleno] de `{100%}`"
"= Text <text>" = "= Texto <text>"
"- Tuned hyphenation: It is less eager by default and hyphenations close to the edges of words are now discouraged more strongly *(May lead to larger layout reflows)*" = "- Se ajustó la separación silábica: ahora es menos ansiosa por defecto y las separaciones cercanas a los bordes de las palabras se desaconsejan con más fuerza *(Puede producir reflujos de diseño mayores)*"
"- New default font: Libertinus Serif. This is the maintained successor to the old default font Linux Libertine. *(May lead to smaller reflows)*" = "- Nueva fuente predeterminada: Libertinus Serif. Es la sucesora mantenida de la antigua fuente predeterminada Linux Libertine. *(Puede producir reflujos menores)*"
"- Setting the font to an unavailable family will now result in a warning" = "- Establecer la fuente en una familia no disponible ahora produce una advertencia"
"- Implemented a new smart quote algorithm, fixing various bugs where smart quotes weren't all that smart" = "- Se implementó un nuevo algoritmo de comillas tipográficas, que corrige varios errores en los que las comillas no eran tan inteligentes"
"- Added @text.costs parameter for tweaking various parameters that affect the choices of the layout engine during text layout" = "- Se agregó el parámetro @text.costs para ajustar varios parámetros que afectan las decisiones del motor de diseño durante el diseño del texto"
"- Added `typm` highlighting mode for math in @raw.lang[raw blocks]" = "- Se agregó el modo de resaltado `typm` para matemática en @raw.lang[bloques raw]"
"- Added basic i18n for Galician, Catalan, Latin, Icelandic, Hebrew" = "- Se agregó internacionalización básica para gallego, catalán, latín, islandés y hebreo"
"- Implemented hyphenation duplication for Czech, Croatian, Lower Sorbian, Polish, Portuguese, Slovak, and Spanish." = "- Se implementó la duplicación del guion en la separación silábica para checo, croata, bajo sorabo, polaco, portugués, eslovaco y español."
"- The @smallcaps function is now an element function and can thereby be used in show(-set) rules." = "- La función @smallcaps ahora es una función de elemento y por lo tanto se puede usar en reglas show(-set)."
"- The @raw.theme parameter can now be set to `{none}` to disable highlighting even in the presence of a language tag, and to `{auto}` to reset to the default" = "- El parámetro @raw.theme ahora se puede establecer en `{none}` para desactivar el resaltado incluso en presencia de una etiqueta de lenguaje, y en `{auto}` para restablecer el valor predeterminado"
"- Multiple @text.stylistic-set[stylistic sets] can now be enabled at once" = "- Ahora se pueden habilitar varios @text.stylistic-set[conjuntos estilísticos] a la vez"
"- Fixed the Chinese translation for \"Equation\"" = "- Se corrigió la traducción al chino de \"Equation\""
"- Fixed that hyphenation could occur outside of words" = "- Se corrigió que la separación silábica pudiera ocurrir fuera de las palabras"
"- Fixed incorrect layout of bidirectional text in edge cases" = "- Se corrigió el diseño incorrecto de texto bidireccional en casos límite"
"- Fixed layout of paragraphs with explicit trailing whitespace" = "- Se corrigió el diseño de párrafos con espacio en blanco final explícito"
"- Fixed bugs related to empty paragraphs created via `#\"\"`" = "- Se corrigieron errores relacionados con párrafos vacíos creados con `#\"\"`"
"- Fixed accidental trailing spaces for line breaks immediately preceding an inline equation" = "- Se corrigieron espacios finales accidentales en saltos de línea inmediatamente anteriores a una ecuación en línea"
"- Fixed @text.historical-ligatures not working correctly" = "- Se corrigió que @text.historical-ligatures no funcionara correctamente"
"- Fixed accidental repetition of Thai characters around line breaks in some circumstances" = "- Se corrigió la repetición accidental de caracteres tailandeses alrededor de los saltos de línea en algunas circunstancias"
"- Fixed @smartquote[smart quotes] for Swiss French" = "- Se corrigieron las @smartquote[comillas tipográficas] para el francés suizo"
"- New font metadata exceptions for Archivo, Kaiti SC, and Kaiti TC" = "- Nuevas excepciones de metadatos de fuentes para Archivo, Kaiti SC y Kaiti TC"
"- Updated bundled New Computer Modern fonts to version 6.0" = "- Se actualizaron las fuentes New Computer Modern incluidas a la versión 6.0"
"= Math <math>" = "= Matemática <math>"
"- Block-level equations can now break over multiple pages if enabled via `{show math.equation: set block(breakable: true)}`." = "- Las ecuaciones de bloque ahora pueden dividirse entre varias páginas si se habilita con `{show math.equation: set block(breakable: true)}`."
"- Matrix and vector sizing is now more consistent across different cell contents" = "- El dimensionamiento de matrices y vectores ahora es más consistente con distintos contenidos de celdas"
"- Added @math.stretch[`stretch`] function for manually or automatically stretching characters like arrows or parentheses horizontally or vertically" = "- Se agregó la función @math.stretch[`stretch`] para estirar manual o automáticamente caracteres como flechas o paréntesis, en horizontal o en vertical"
"- Improved layout of attachments on parenthesized as well as under- or overlined expressions" = "- Se mejoró el diseño de los adjuntos en expresiones entre paréntesis y en expresiones con subrayado o sobrerrayado"
"- Improved layout of nested attachments resulting from code like `[#let a0 = $a_0$; $a0^1$]`" = "- Se mejoró el diseño de los adjuntos anidados que resultan de código como `[#let a0 = $a_0$; $a0^1$]`"
"- Improved layout of primes close to superscripts" = "- Se mejoró el diseño de las primas cercanas a superíndices"
"- Improved layout of fractions" = "- Se mejoró el diseño de las fracciones"
"- Typst now makes use of math-specific height-dependent kerning information in some fonts for better attachment layout" = "- Typst ahora aprovecha la información de kerning matemática dependiente de la altura que traen algunas fuentes, para un mejor diseño de los adjuntos"
"- The `floor` and `ceil` functions in math are now callable symbols, such that `[$ floor(x) = lr(floor.l x floor.r) $]`" = "- Las funciones `floor` y `ceil` en matemática ahora son símbolos invocables, de modo que `[$ floor(x) = lr(floor.l x floor.r) $]`"
"- The @math.mat.delim[`mat.delim`], @math.vec.delim[`vec.delim`], and @math.cases.delim[`cases.delim`] parameters now allow any character that is considered a delimiter or \"fence\" (e.g. |) by Unicode. The `{delim: \"||\"}` notation is _not_ supported anymore and should be replaced by `{delim: bar.double}` *(Minor breaking change)*" = "- Los parámetros @math.mat.delim[`mat.delim`], @math.vec.delim[`vec.delim`] y @math.cases.delim[`cases.delim`] ahora permiten cualquier carácter que Unicode considere un delimitador o \"cerco\" (p. ej., |). La notación `{delim: \"||\"}` ya _no_ se admite y hay que reemplazarla por `{delim: bar.double}` *(Cambio incompatible menor)*"
"- Added @math.vec.align[`vec.align`] and @math.mat.align[`mat.align`] parameters" = "- Se agregaron los parámetros @math.vec.align[`vec.align`] y @math.mat.align[`mat.align`]"
"- Added @math.underparen[`underparen`], @math.overparen[`overparen`], @math.undershell[`undershell`], and @math.overshell[`overshell`]" = "- Se agregaron @math.underparen[`underparen`], @math.overparen[`overparen`], @math.undershell[`undershell`] y @math.overshell[`overshell`]"
"- Added `~` shorthand for `tilde.op` in math mode *(Minor breaking change)*" = "- Se agregó el atajo `~` para `tilde.op` en modo matemático *(Cambio incompatible menor)*"
"- Fixed baseline alignment of equation numbers" = "- Se corrigió la alineación de línea base de los números de ecuación"
"- Fixed positioning of corner brackets (⌜, ⌝, ⌞, ⌟)" = "- Se corrigió el posicionamiento de los corchetes de esquina (⌜, ⌝, ⌞, ⌟)"
"- Fixed baseline of large roots" = "- Se corrigió la línea base de las raíces grandes"
"- Fixed multiple minor layout bugs with attachments" = "- Se corrigieron varios errores menores de diseño con adjuntos"
"- Fixed that alignment points could affect line height in math" = "- Se corrigió que los puntos de alineación pudieran afectar la altura de línea en matemática"
"- Fixed that spaces could show up between text and invisible elements like @metadata in math" = "- Se corrigió que pudieran aparecer espacios entre el texto y elementos invisibles como @metadata en matemática"
"- Fixed a crash with recursive show rules in math" = "- Se corrigió un fallo con reglas show recursivas en matemática"
"- Fixed @math.lr.size[`lr.size`] not affecting characters enclosed in @math.mid[`mid`] in some cases" = "- Se corrigió que @math.lr.size[`lr.size`] no afectara en algunos casos a los caracteres encerrados en @math.mid[`mid`]"
"- Fixed resolving of em units in sub- and superscripts" = "- Se corrigió la resolución de unidades em en subíndices y superíndices"
"- Fixed bounding box of inline equations when a @text.top-edge[text edge] is set to `{\"bounds\"}`" = "- Se corrigió el cuadro delimitador de las ecuaciones en línea cuando un @text.top-edge[borde de texto] está establecido en `{\"bounds\"}`"
"= Introspection <introspection>" = "= Introspección <introspection>"
"- Implemented a new system by which Typst tracks where elements end up on the pages. This may lead to subtly different behavior in introspections. *(Breaking change)*" = "- Se implementó un nuevo sistema con el que Typst registra dónde termina cada elemento en las páginas. Esto puede producir comportamientos sutilmente distintos en las introspecciones. *(Cambio incompatible)*"
"- Fixed various bugs with wrong counter behavior in complex layout situations, through a new, more principled implementation" = "- Se corrigieron varios errores de comportamiento incorrecto de los contadores en situaciones de diseño complejas, mediante una implementación nueva y más fundamentada"
"- Counter updates can now be before the first, in between, and after the last page when isolated by weak page breaks. This allows, for instance, updating a counter before the first page header and background." = "- Ahora las actualizaciones de contadores pueden estar antes de la primera página, entre páginas y después de la última cuando están aisladas por saltos de página débiles. Esto permite, por ejemplo, actualizar un contador antes del encabezado y del fondo de la primera página."
"- Fixed logical ordering of introspections within footnotes and figures" = "- Se corrigió el orden lógico de las introspecciones dentro de notas al pie y figuras"
"- Fixed incorrect @here[`here().position()`] when @place was used in a context expression" = "- Se corrigió @here[`here().position()`] incorrecto cuando se usaba @place en una expresión de contexto"
"- Fixed resolved positions of elements (in particular, headings) whose show rule emits an invisible element (like a state update) before a page break" = "- Se corrigieron las posiciones resueltas de elementos (en particular, títulos) cuya regla show emite un elemento invisible (como una actualización de estado) antes de un salto de página"
"- Fixed behavior of stepping a counter at a deeper level than its current state has" = "- Se corrigió el comportamiento de avanzar un contador en un nivel más profundo que el de su estado actual"
"- Fixed citation formatting not working in table headers and a few other places" = "- Se corrigió que el formato de citas no funcionara en encabezados de tabla y en algunos otros lugares"
"- Displaying the footnote counter will now respect the footnote numbering style" = "- Mostrar el contador de notas al pie ahora respetará el estilo de numeración de las notas al pie"
"= Model <model>" = "= Modelo <model>"
"- Document set rules do not need to be at the very start of the document anymore. The only restriction is that they must not occur inside of layout containers." = "- Las reglas set de documento ya no tienen que estar al principio mismo del documento. La única restricción es que no deben aparecer dentro de contenedores de diseño."
"- The `spacing` property of @list.spacing[lists], @enum.spacing[enumerations], and @terms.spacing[term lists] is now also respected for tight lists" = "- La propiedad `spacing` de las @list.spacing[listas], las @enum.spacing[enumeraciones] y las @terms.spacing[listas de términos] ahora también se respeta en las listas compactas"
"- Tight lists now only attach (with tighter spacing) to preceding paragraphs, not arbitrary blocks" = "- Las listas compactas ahora solo se adhieren (con espaciado más ajustado) a los párrafos anteriores, no a bloques arbitrarios"
"- The @quote element is now locatable (can be used in queries)" = "- El elemento @quote ahora es localizable (se puede usar en consultas)"
"- The bibliography heading now uses `depth` instead of `level` so that its level can still be configured via a show-set rule" = "- El título de la bibliografía ahora usa `depth` en lugar de `level`, de modo que su nivel se pueda seguir configurando mediante una regla show-set"
"- Added support for more @numbering[numbering] formats: Devanagari, Eastern Arabic, Bengali, and circled numbers" = "- Se agregó compatibilidad con más formatos de @numbering[numeración]: devanagari, árabe oriental, bengalí y números en círculo"
"- Added @heading.hanging-indent[`hanging-indent`] parameter to heading function to tweak the appearance of multi-line headings and improved default appearance of multi-line headings" = "- Se agregó el parámetro @heading.hanging-indent[`hanging-indent`] a la función heading para ajustar el aspecto de los títulos de varias líneas, y se mejoró su aspecto predeterminado"
"- Improved handling of bidirectional text in outline entry" = "- Se mejoró el manejo de texto bidireccional en las entradas del índice"
"- Fixed document set rules being ignored in an otherwise empty document" = "- Se corrigió que las reglas set de documento se ignoraran en un documento por lo demás vacío"
"- Fixed document set rules not being usable in context expressions" = "- Se corrigió que las reglas set de documento no se pudieran usar en expresiones de contexto"
"- Fixed bad interaction between `{set document}` and `{set page}`" = "- Se corrigió una mala interacción entre `{set document}` y `{set page}`"
"- Fixed `{show figure: set align(..)}`. Since the default figure alignment is now a show-set rule, it is not revoked by `{show figure: it => it.body}` anymore. *(Minor breaking change)*" = "- Se corrigió `{show figure: set align(..)}`. Como la alineación predeterminada de las figuras ahora es una regla show-set, ya no se revoca con `{show figure: it => it.body}`. *(Cambio incompatible menor)*"
"- Fixed numbering of footnote references" = "- Se corrigió la numeración de las referencias a notas al pie"
"- Fixed spacing after bibliography heading" = "- Se corrigió el espaciado después del título de la bibliografía"
"= Bibliography <bibliography>" = "= Bibliografía <bibliography>"
"- The Hayagriva YAML `publisher` field can now accept a dictionary with a `location` key. The top-level `location` key is now primarily intended for event and item locations." = "- El campo `publisher` del YAML de Hayagriva ahora puede aceptar un diccionario con una clave `location`. La clave `location` de nivel superior ahora está pensada principalmente para ubicaciones de eventos y de elementos."
"- Multiple page ranges with prefixes and suffixes are now allowed" = "- Ahora se permiten varios rangos de páginas con prefijos y sufijos"
"- Added `director` and catch-all editor types to BibLaTeX parsing" = "- Se agregaron `director` y tipos de editor genéricos al análisis de BibLaTeX"
"- Added support for disambiguation to alphanumeric citation style" = "- Se agregó compatibilidad con la desambiguación al estilo de cita alfanumérico"
"- The year 0 will now render as 1BC" = "- El año 0 ahora se renderizará como 1 a. C."
"- Fixes for sorting of bibliography entries" = "- Correcciones en el ordenamiento de las entradas de bibliografía"
"- Fixed pluralization of page range labels" = "- Se corrigió la pluralización de las etiquetas de rangos de páginas"
"- Fixed sorting of citations by their number" = "- Se corrigió el ordenamiento de las citas por su número"
"- Fixed how citation number ranges collapse" = "- Se corrigió cómo se colapsan los rangos de números de citas"
"- Fixed when the short form of a title is used" = "- Se corrigió cuándo se usa la forma corta de un título"
"- Fixed parsing of unbalanced dollars in BibLaTeX `url` field" = "- Se corrigió el análisis de signos de dólar desbalanceados en el campo `url` de BibLaTeX"
"- Updated built-in citation styles" = "- Se actualizaron los estilos de cita integrados"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- Added `fill-rule` parameter to `path` and @polygon.fill-rule[`polygon`] functions" = "- Se agregó el parámetro `fill-rule` a las funciones `path` y @polygon.fill-rule[`polygon`]"
"- Fixed color mixing and gradients for @color.luma[Luma colors]" = "- Se corrigieron la mezcla de colores y los degradés para @color.luma[colores Luma]"
"- Fixed conversion from Luma to CMYK colors" = "- Se corrigió la conversión de colores Luma a CMYK"
"- Fixed offset gradient strokes in PNG export" = "- Se corrigieron los trazos de degradé desplazados en la exportación a PNG"
"- Fixed unintended cropping of some SVGs" = "- Se corrigió el recorte no deseado de algunos SVG"
"- SVGs with foreign objects now produce a warning as they will likely not render correctly in Typst" = "- Los SVG con objetos foráneos ahora producen una advertencia, ya que probablemente no se renderizarán bien en Typst"
"= Syntax <syntax>" = "= Sintaxis <syntax>"
"- Added support for nested imports like `{import \"file.typ\": module.item}`" = "- Se agregó compatibilidad con importaciones anidadas como `{import \"file.typ\": module.item}`"
"- Added support for parenthesized imports like `{import \"file.typ\": (a, b, c)}`. With those, the import list can break over multiple lines." = "- Se agregó compatibilidad con importaciones entre paréntesis como `{import \"file.typ\": (a, b, c)}`. Con ellas, la lista de importación puede dividirse en varias líneas."
"- Fixed edge case in parsing of reference syntax" = "- Se corrigió un caso límite en el análisis de la sintaxis de referencias"
"- Fixed edge case in parsing of heading, list, enum, and term markers immediately followed by comments" = "- Se corrigió un caso límite en el análisis de marcadores de título, lista, enumeración y términos seguidos inmediatamente por comentarios"
"- Fixed rare crash in parsing of parenthesized expressions" = "- Se corrigió un fallo poco frecuente en el análisis de expresiones entre paréntesis"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Added new fixed-point @decimal number type for highly precise arithmetic on numbers in base 10, as needed for finance" = "- Se agregó el nuevo tipo numérico de punto fijo @decimal, para aritmética de alta precisión con números en base 10, como se necesita en finanzas"
"- Added `std` module for accessing standard library definitions even when a variable with the same name shadows/overwrites it" = "- Se agregó el módulo `std` para acceder a las definiciones de la biblioteca estándar incluso cuando una variable con el mismo nombre las tapa o sobrescribe"
"- Added @array.to-dict, @array.reduce, @array.windows methods" = "- Se agregaron los métodos @array.to-dict, @array.reduce y @array.windows"
"- Added `exact` argument to @array.zip" = "- Se agregó el argumento `exact` a @array.zip"
"- Added @arguments.at method" = "- Se agregó el método @arguments.at"
"- Added @int.from-bytes, @int.to-bytes, @float.from-bytes, and @float.to-bytes" = "- Se agregaron @int.from-bytes, @int.to-bytes, @float.from-bytes y @float.to-bytes"
"- Added proper support for negative values of the `digits` parameter of @calc.round (the behaviour existed before but was subtly broken)" = "- Se agregó compatibilidad adecuada con valores negativos del parámetro `digits` de @calc.round (el comportamiento existía antes, pero estaba sutilmente roto)"
"- Conversions from @int to @float will now error instead of saturating if the float is too large *(Minor breaking change)*" = "- Las conversiones de @int a @float ahora producirán un error en lugar de saturar si el flotante es demasiado grande *(Cambio incompatible menor)*"
"- Added @float.nan and @float.inf, removed `{calc.nan}` *(Minor breaking change)*" = "- Se agregaron @float.nan y @float.inf, y se eliminó `{calc.nan}` *(Cambio incompatible menor)*"
"- Certain symbols are now generally callable like functions and not only specifically in math. Examples are accents or @math.floor[`floor`] and @math.ceil[`ceil`]." = "- Ciertos símbolos ahora se pueden llamar como funciones en general y no solo en matemática. Algunos ejemplos son los acentos o @math.floor[`floor`] y @math.ceil[`ceil`]."
"- Improved @repr of relative values, sequences, infinities, NaN, `{type(none)}` and `{type(auto)}`" = "- Se mejoró @repr de valores relativos, secuencias, infinitos, NaN, `{type(none)}` y `{type(auto)}`"
"- Fixed crash on whole packages (rather than just files) cyclically importing each other" = "- Se corrigió un fallo cuando paquetes enteros (y no solo archivos) se importaban cíclicamente entre sí"
"- Fixed return type of @calc.round on integers when a non-zero value is provided for `digits`" = "- Se corrigió el tipo de retorno de @calc.round sobre enteros cuando se pasa un valor distinto de cero para `digits`"
"= Styling <styling>" = "= Estilos <styling>"
"- The string `{\"}` in a text show rule now matches smart quotes" = "- La cadena `{\"}` en una regla show de texto ahora coincide con las comillas tipográficas"
"- Fixed a long-standing styling bug where the header and footer would incorrectly inherit styles from a lone element on the page (e.g. a heading)" = "- Se corrigió un error histórico de estilos por el cual el encabezado y el pie de página heredaban incorrectamente estilos de un elemento aislado en la página (p. ej., un título)"
"- Fixed `{set page}` not working directly after a counter/state update" = "- Se corrigió que `{set page}` no funcionara directamente después de una actualización de contador o estado"
"- Page fields configured via an explicit `{page(..)[..]}` call can now be properly retrieved in context expressions" = "- Los campos de página configurados mediante una llamada explícita `{page(..)[..]}` ahora se pueden obtener correctamente en expresiones de contexto"
"= Export <export>" = "= Exportación <export>"
"- Highly reduced PDF file sizes due to better font subsetting" = "- Se redujeron mucho los tamaños de los archivos PDF gracias a un mejor subconjunto de fuentes"
"- Added initial support for PDF/A. For now, only the standard PDF/A-2b is supported, but more is planned for the future. Enabled via `--pdf-standard a-2b` in the CLI and via the UI in File > Export as > PDF in the web app." = "- Se agregó compatibilidad inicial con PDF/A. Por ahora solo se admite el estándar PDF/A-2b, pero hay más planeado para el futuro. Se habilita con `--pdf-standard a-2b` en la CLI y desde la interfaz en File > Export as > PDF en la app web."
"- Setting @page.fill to `{none}` will now lead to transparent pages instead of white ones in PNG and SVG. The new default of `{auto}` means transparent for PDF and white for PNG and SVG." = "- Establecer @page.fill en `{none}` ahora produce páginas transparentes en lugar de blancas en PNG y SVG. El nuevo valor predeterminado `{auto}` significa transparente para PDF y blanco para PNG y SVG."
"- Improved text copy-paste from PDF in complex scenarios" = "- Se mejoró el copiado y pegado de texto desde PDF en escenarios complejos"
"- Exported SVGs now contain the `data-typst-label` attribute on groups resulting from labelled @box[boxes] and @block[blocks]" = "- Los SVG exportados ahora contienen el atributo `data-typst-label` en los grupos que resultan de @box[cajas] y @block[bloques] con etiqueta"
"- Fixed a bug where transparency could leak from one PDF object to another" = "- Se corrigió un error por el cual la transparencia podía filtrarse de un objeto PDF a otro"
"- Fixed a bug with CMYK gradients in PDF" = "- Se corrigió un error con degradés CMYK en PDF"
"- Fixed various bugs with export of Oklab gradients in PDF" = "- Se corrigieron varios errores en la exportación de degradés Oklab a PDF"
"- Fixed crashes related to rendering of non-outline glyphs" = "- Se corrigieron fallos relacionados con el renderizado de glifos que no son de contorno"
"- Two small fixes for PDF standard conformance" = "- Dos correcciones menores de conformidad con el estándar PDF"
"= Performance <performance>" = "= Rendimiento <performance>"
"- Paragraph justification was optimized with a new two-pass algorithm. Speedups are larger for shorter paragraphs and range from 1-6x." = "- Se optimizó la justificación de párrafos con un nuevo algoritmo de dos pasadas. Las aceleraciones son mayores en párrafos más cortos y van de 1 a 6 veces."
"= Command Line Interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added `--pages` option to select specific page ranges to export" = "- Se agregó la opción `--pages` para seleccionar rangos de páginas específicos para exportar"
"- Added `--package-path` and `--package-cache-path` as well as `TYPST_PACKAGE_PATH` and `TYPST_PACKAGE_CACHE_PATH` environment variables for configuring where packages are loaded from and cached in, respectively" = "- Se agregaron `--package-path` y `--package-cache-path`, así como las variables de entorno `TYPST_PACKAGE_PATH` y `TYPST_PACKAGE_CACHE_PATH`, para configurar desde dónde se cargan los paquetes y dónde se guardan en caché, respectivamente"
"- Added `--ignore-system-fonts` flag to disable system fonts fully for better reproducibility" = "- Se agregó el indicador `--ignore-system-fonts` para desactivar por completo las fuentes del sistema y lograr mayor reproducibilidad"
"- Added `--make-deps` argument for outputting the dependencies of the current compilation as a Makefile" = "- Se agregó el argumento `--make-deps` para generar las dependencias de la compilación actual como un Makefile"
"- Added `--pretty` option to `typst query`, with the default now being to minify (only applies to JSON format)" = "- Se agregó la opción `--pretty` a `typst query`, y ahora por defecto se minifica (solo se aplica al formato JSON)"
"- Added `--backup-path` to `typst update` to configure where the previous version is backed up" = "- Se agregó `--backup-path` a `typst update` para configurar dónde se hace la copia de respaldo de la versión anterior"
"- Added useful links to help output" = "- Se agregaron enlaces útiles a la salida de ayuda"
"- The CLI will now greet users who invoke just `typst` for the first time" = "- La CLI ahora saluda a quienes invocan solo `typst` por primera vez"
"- The document can now be written to stdout by passing `-` as the output filename (for PDF or single-page image export)" = "- Ahora se puede escribir el documento en la salida estándar pasando `-` como nombre del archivo de salida (para PDF o exportación de imagen de una sola página)"
"- Typst will now emit a proper error message instead of failing silently when the certificate specified by `--cert` or `TYPST_CERT` could not be loaded" = "- Typst ahora emite un mensaje de error adecuado, en lugar de fallar en silencio, cuando no se pudo cargar el certificado especificado con `--cert` o `TYPST_CERT`"
"- The CLI now respects the `SOURCE_DATE_EPOCH` environment variable for better reproducibility" = "- La CLI ahora respeta la variable de entorno `SOURCE_DATE_EPOCH` para una mejor reproducibilidad"
"- When exporting multiple images, you can now use `{t}` (total pages), `{p}` (current page), and `{0p}` (zero-padded current page, same as current `{n}`) in the output path" = "- Al exportar varias imágenes, ahora podés usar `{t}` (total de páginas), `{p}` (página actual) y `{0p}` (página actual con ceros a la izquierda, igual que el actual `{n}`) en la ruta de salida"
"- The input and output paths now allow non-UTF-8 values" = "- Las rutas de entrada y de salida ahora admiten valores que no son UTF-8"
"- Times are now formatted more consistently across the CLI" = "- Las horas ahora se formatean de forma más coherente en toda la CLI"
"- Fixed a bug related to the `--open` flag" = "- Se corrigió un error relacionado con el indicador `--open`"
"- Fixed path completions for `typst` not working in zsh" = "- Se corrigió que los autocompletados de rutas de `typst` no funcionaran en zsh"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- The \"compiler\" field for specifying the minimum Typst version required by a package now supports imprecise bounds like 0.11 instead of 0.11.0" = "- El campo \"compiler\" para especificar la versión mínima de Typst que requiere un paquete ahora admite límites imprecisos como 0.11 en lugar de 0.11.0"
"- Added warning when a label is ignored by Typst because no preceding labellable element exists" = "- Se agregó una advertencia cuando Typst ignora una etiqueta porque no hay ningún elemento etiquetable anterior"
"- Added hint when trying to apply labels in code mode" = "- Se agregó una sugerencia al intentar aplicar etiquetas en modo código"
"- Added hint when trying to call a standard library function that has been shadowed/overwritten by a local definition" = "- Se agregó una sugerencia al intentar llamar a una función de la biblioteca estándar que fue tapada o sobrescrita por una definición local"
"- Added hint when trying to set both the language and the region in the `lang` parameter" = "- Se agregó una sugerencia al intentar establecer tanto el idioma como la región en el parámetro `lang`"
"- Added hints when trying to compile non-Typst files (e.g. after having typed `typst c file.pdf` by accident)" = "- Se agregaron sugerencias al intentar compilar archivos que no son de Typst (p. ej., después de haber escrito `typst c file.pdf` por accidente)"
"- Added hint when a string is used where a label is expected" = "- Se agregó una sugerencia cuando se usa una cadena de texto donde se espera una etiqueta"
"- Added hint when a stray end of a block comment (`*/`) is encountered" = "- Se agregó una sugerencia cuando se encuentra un cierre de comentario de bloque (`*/`) suelto"
"- Added hints when destructuring arrays with the wrong number of elements" = "- Se agregaron sugerencias al desestructurar arrays con una cantidad incorrecta de elementos"
"- Improved error message when trying to use a keyword as an identifier in a let binding" = "- Se mejoró el mensaje de error al intentar usar una palabra clave como identificador en un enlace let"
"- Improved error messages when accessing nonexistent fields" = "- Se mejoraron los mensajes de error al acceder a campos inexistentes"
"- Improved error message when a package exists, but not the specified version" = "- Se mejoró el mensaje de error cuando existe un paquete, pero no la versión especificada"
"- Improved hints for unknown variables" = "- Se mejoraron las sugerencias para variables desconocidas"
"- Improved hint when trying to convert a length with non-zero em component to an absolute unit" = "- Se mejoró la sugerencia al intentar convertir una longitud con un componente em distinto de cero a una unidad absoluta"
"- Fixed a crash that could be triggered by certain hover tooltips" = "- Se corrigió un fallo que podían provocar ciertos tooltips al pasar el mouse"
"- Fixed an off-by-one error in to-source jumps when first-line-indent is enabled" = "- Se corrigió un error de uno en los saltos al código fuente cuando la sangría de primera línea está habilitada"
"- Fixed suggestions for `.` after the end of an inline code expressions" = "- Se corrigieron las sugerencias para `.` después del final de una expresión de código en línea"
"- Fixed autocompletions being duplicated in a specific case" = "- Se corrigió que los autocompletados se duplicaran en un caso específico"
"= Symbols <symbols>" = "= Símbolos <symbols>"
"- New: `parallelogram`, `original`, `image`, `crossmark`, `rest`, `natural`, `flat`, `sharp`, `tiny`, `miny`, `copyleft`, `trademark`, `emoji.beet`, `emoji.fingerprint`, `emoji.harp`, `emoji.shovel`, `emoji.splatter`, `emoji.tree.leafless`," = "- Nuevos: `parallelogram`, `original`, `image`, `crossmark`, `rest`, `natural`, `flat`, `sharp`, `tiny`, `miny`, `copyleft`, `trademark`, `emoji.beet`, `emoji.fingerprint`, `emoji.harp`, `emoji.shovel`, `emoji.splatter`, `emoji.tree.leafless`,"
"- New variants: `club.stroked`, `diamond.stroked`, `heart.stroked`, `spade.stroked`, `gt.neq`, `lt.neq`, `checkmark.heavy`, `paren.double`, `brace.double`, `shell.double`, `arrow.turn`, `plus.double`, `plus.triple`, `infinity.bar`, `infinity.incomplete`, `infinity.tie`, `multimap.double`, `ballot.check`, `ballot.check.heavy`, `emptyset.bar`, `emptyset.circle`, `emptyset.arrow.l`, `emptyset.arrow.r`, `parallel.struck`, `parallel.eq`, `parallel.equiv`, `parallel.slanted`, `parallel.tilde`, `angle.l.curly`, `angle.l.dot`, `angle.r.curly`, `angle.r.dot`, `angle.oblique`, `angle.s`, `em.two`, `em.three`" = "- Variantes nuevas: `club.stroked`, `diamond.stroked`, `heart.stroked`, `spade.stroked`, `gt.neq`, `lt.neq`, `checkmark.heavy`, `paren.double`, `brace.double`, `shell.double`, `arrow.turn`, `plus.double`, `plus.triple`, `infinity.bar`, `infinity.incomplete`, `infinity.tie`, `multimap.double`, `ballot.check`, `ballot.check.heavy`, `emptyset.bar`, `emptyset.circle`, `emptyset.arrow.l`, `emptyset.arrow.r`, `parallel.struck`, `parallel.eq`, `parallel.equiv`, `parallel.slanted`, `parallel.tilde`, `angle.l.curly`, `angle.l.dot`, `angle.r.curly`, `angle.r.dot`, `angle.oblique`, `angle.s`, `em.two`, `em.three`"
"- Renamed: `turtle` to `shell`, `notes` to `note`, `ballot.x` to `ballot.cross`, `succ.eq` to `succ.curly.eq`, `prec.eq` to `prec.curly.eq`, `servicemark` to `trademark.service`, `emoji.face.tired` to `emoji.face.distress` *(Breaking change)*" = "- Renombrados: `turtle` a `shell`, `notes` a `note`, `ballot.x` a `ballot.cross`, `succ.eq` a `succ.curly.eq`, `prec.eq` a `prec.curly.eq`, `servicemark` a `trademark.service`, `emoji.face.tired` a `emoji.face.distress` *(Cambio incompatible)*"
"- Changed codepoint: `prec.eq`, `prec.neq`, `succ.eq`, `succ.neq`, `triangle` from ▷ to △, `emoji.face.tired` *(Breaking change)*" = "- Punto de código modificado: `prec.eq`, `prec.neq`, `succ.eq`, `succ.neq`, `triangle` de ▷ a △, `emoji.face.tired` *(Cambio incompatible)*"
"- Removed: `lt.curly` in favor of `prec`, `gt.curly` in favor of `succ` *(Breaking change)*" = "- Eliminados: `lt.curly` en favor de `prec`, `gt.curly` en favor de `succ` *(Cambio incompatible)*"
"= Deprecations <deprecations>" = "= Obsolescencias <deprecations>"
"- @counter.display without an established context" = "- @counter.display sin un contexto establecido"
"- @counter.final with a location" = "- @counter.final con una ubicación"
"- @state.final with a location" = "- @state.final con una ubicación"
"- @query with a location as the second argument" = "- @query con una ubicación como segundo argumento"
"- @locate with a callback function" = "- @locate con una función de retorno de llamada (callback)"
"- @measure with styles" = "- @measure con estilos"
"= Development <development>" = "= Desarrollo <development>"
"- Added `typst-kit` crate which provides useful APIs for `World` implementors" = "- Se agregó el crate `typst-kit`, que ofrece APIs útiles para quienes implementan `World`"
"- Added go-to-definition API in `typst-ide`" = "- Se agregó una API de ir a la definición en `typst-ide`"
"- Added package manifest parsing APIs to `typst-syntax`" = "- Se agregaron APIs de análisis de manifiestos de paquetes a `typst-syntax`"
"- As the compiler is now capable of multithreading, `World` implementations must satisfy `Send` and `Sync`" = "- Como ahora el compilador es capaz de usar varios hilos, las implementaciones de `World` deben cumplir `Send` y `Sync`"
"- Changed signature of `World::main` to allow for the scenario where the main file could not be loaded" = "- Se cambió la firma de `World::main` para permitir el caso en que no se pudo cargar el archivo principal"
"- Removed `Tracer` in favor of `Warned<T>` and `typst::trace` function" = "- Se eliminó `Tracer` en favor de `Warned<T>` y de la función `typst::trace`"
"- The `xz2` dependency used by the self-updater is now statically linked" = "- La dependencia `xz2` que usa el autoactualizador ahora se enlaza estáticamente"
"- The Dockerfile now has an `ENTRYPOINT` directive" = "- El Dockerfile ahora tiene una directiva `ENTRYPOINT`"

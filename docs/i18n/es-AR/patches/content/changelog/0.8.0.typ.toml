# Line patches for docs/content/changelog/0.8.0.typ (see docs/src/i18n.rs).
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Plugins (thanks to #gh(\"astrale-sharp\") and #gh(\"arnaudgolfouse\"))" = "- Plugins (gracias a #gh(\"astrale-sharp\") y #gh(\"arnaudgolfouse\"))"
"- Typst can now load @plugin[plugins] that are compiled to WebAssembly" = "- Typst ahora puede cargar @plugin[plugins] compilados a WebAssembly"
"- Anything that can be compiled to WebAssembly can thus be loaded as a plugin" = "- Por lo tanto, cualquier cosa que se pueda compilar a WebAssembly se puede cargar como plugin"
"- These plugins are fully encapsulated (no access to file system or network)" = "- Estos plugins están totalmente encapsulados (sin acceso al sistema de archivos ni a la red)"
"- Plugins can be shipped as part of @reference:scripting:packages[packages]" = "- Los plugins se pueden distribuir como parte de @reference:scripting:packages[paquetes]"
"- Plugins work just the same in the web app" = "- Los plugins funcionan igual en la app web"
"- Types are now first-class values *(Breaking change)*" = "- Los tipos ahora son valores de primera clase *(Cambio incompatible)*"
"- A @type[type] is now itself a value" = "- Un @type[tipo] ahora es en sí mismo un valor"
"- Some types can be called like functions (those that have a constructor), e.g. @int and @str" = "- Algunos tipos se pueden llamar como funciones (los que tienen un constructor), p. ej., @int y @str"
"- Type checks are now of the form `{type(10) == int}` instead of the old `{type(10) == \"integer\"}`. Compatibility with the old way will remain for a while to give package authors time to upgrade, but it will be removed at some point." = "- Las comprobaciones de tipo ahora tienen la forma `{type(10) == int}` en lugar de la antigua `{type(10) == \"integer\"}`. La compatibilidad con la forma anterior se mantendrá por un tiempo para darles a los autores de paquetes tiempo de actualizar, pero en algún momento se eliminará."
"- Methods are now syntax sugar for calling a function scoped to a type, meaning that `{\"hello\".len()}` is equivalent to `{str.len(\"hello\")}`" = "- Los métodos ahora son azúcar sintáctico para llamar a una función con alcance en un tipo, lo que significa que `{\"hello\".len()}` equivale a `{str.len(\"hello\")}`"
"- Added support for @reference:scripting:modules[`import`] renaming with `as`" = "- Se agregó compatibilidad para renombrar con `as` en @reference:scripting:modules[`import`]"
"- Added a @duration type" = "- Se agregó el tipo @duration"
"- Added support for @cbor[CBOR] encoding and decoding" = "- Se agregó compatibilidad con la codificación y decodificación de @cbor[CBOR]"
"- Added encoding and decoding functions from and to bytes for data formats: `json.decode`, @json.encode, and similar functions for other formats" = "- Se agregaron funciones de codificación y decodificación desde y hacia bytes para los formatos de datos: `json.decode`, @json.encode y funciones similares para otros formatos"
"- Added @array.intersperse function" = "- Se agregó la función @array.intersperse"
"- Added @str.rev function" = "- Se agregó la función @str.rev"
"- Added @calc.tau constant" = "- Se agregó la constante @calc.tau"
"- Made @bytes[bytes] joinable and addable" = "- Los @bytes[bytes] ahora se pueden unir y sumar"
"- Made @array.zip function variadic" = "- La función @array.zip ahora es variádica"
"- Fixed bug with @eval when the `mode` was set to `{\"math\"}`" = "- Se corrigió un error con @eval cuando `mode` estaba establecido en `{\"math\"}`"
"- Fixed bug with @str.ends-with[`ends-with`] function on strings" = "- Se corrigió un error con la función @str.ends-with[`ends-with`] en cadenas de texto"
"- Fixed bug with destructuring in combination with break, continue, and return" = "- Se corrigió un error con la desestructuración combinada con break, continue y return"
"- Fixed argument types of @calc.cosh[hyperbolic functions], they don't allow angles anymore *(Breaking change)*" = "- Se corrigieron los tipos de argumento de las @calc.cosh[funciones hiperbólicas]: ya no admiten ángulos *(Cambio incompatible)*"
"- Renamed some color methods: `rgba` becomes `to-rgba`, `cmyk` becomes `to-cmyk`, and `luma` becomes `to-luma` *(Breaking change)*" = "- Se renombraron algunos métodos de color: `rgba` pasa a ser `to-rgba`, `cmyk` pasa a ser `to-cmyk` y `luma` pasa a ser `to-luma` *(Cambio incompatible)*"
"= Export <export>" = "= Exportación <export>"
"- Added SVG export (thanks to #gh(\"Enter-tainer\"))" = "- Se agregó la exportación a SVG (gracias a #gh(\"Enter-tainer\"))"
"- Fixed bugs with PDF font embedding" = "- Se corrigieron errores en la incrustación de fuentes en PDF"
"- Added support for page labels that reflect the @page.numbering[page numbering] style in the PDF" = "- Se agregó compatibilidad con etiquetas de página que reflejan el estilo de @page.numbering[numeración de páginas] en el PDF"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Added @highlight function for highlighting text with a background color" = "- Se agregó la función @highlight para resaltar texto con un color de fondo"
"- Added @polygon.regular function for drawing a regular polygon" = "- Se agregó la función @polygon.regular para dibujar un polígono regular"
"- Added support for tabs in @raw elements alongside @raw.tab-size[`tab-width`] parameter" = "- Se agregó compatibilidad con tabulaciones en elementos @raw junto con el parámetro @raw.tab-size[`tab-width`]"
"- The layout engine now tries to prevent \"runts\" (final lines consisting of just a single word)" = "- El motor de diseño ahora intenta evitar las \"runts\" (últimas líneas formadas por una sola palabra)"
"- Added Finnish translations" = "- Se agregaron traducciones al finés"
"- Added hyphenation support for Polish" = "- Se agregó compatibilidad con la separación silábica del polaco"
"- Improved handling of consecutive smart quotes of different kinds" = "- Se mejoró el manejo de comillas tipográficas consecutivas de distintos tipos"
"- Fixed vertical alignments for @page.number-align[`number-align`] argument on page function *(Breaking change)*" = "- Se corrigieron las alineaciones verticales para el argumento @page.number-align[`number-align`] de la función page *(Cambio incompatible)*"
"- Fixed weak pagebreaks after counter updates" = "- Se corrigieron los saltos de página débiles después de actualizaciones de contadores"
"- Fixed missing text in SVG when the text font is set to \"New Computer Modern\"" = "- Se corrigió texto faltante en SVG cuando la fuente del texto está establecida en \"New Computer Modern\""
"- Fixed translations for Chinese" = "- Se corrigieron las traducciones al chino"
"- Fixed crash for empty text in show rule" = "- Se corrigió un fallo con texto vacío en una regla show"
"- Fixed leading spaces when there's a linebreak after a number and a comma" = "- Se corrigieron espacios iniciales cuando hay un salto de línea después de un número y una coma"
"- Fixed placement of floating elements in columns and other containers" = "- Se corrigió la ubicación de elementos flotantes en columnas y otros contenedores"
"- Fixed sizing of block containing just a single box" = "- Se corrigió el dimensionamiento de un bloque que contiene una sola caja"
"= Math <math>" = "= Matemática <math>"
"- Added support for @math.mat.augment[augmented matrices]" = "- Se agregó compatibilidad con @math.mat.augment[matrices aumentadas]"
"- Removed support for automatic matching of fences like `|` and `||` as there were too many false positives. You can use functions like @math.abs[`abs`] or @math.norm[`norm`] or an explicit @math.lr[`lr`] call instead. *(Breaking change)*" = "- Se eliminó la coincidencia automática de cercos como `|` y `||`, porque producía demasiados falsos positivos. En su lugar podés usar funciones como @math.abs[`abs`] o @math.norm[`norm`], o una llamada explícita a @math.lr[`lr`]. *(Cambio incompatible)*"
"- Fixed spacing after number with decimal point in math" = "- Se corrigió el espaciado después de un número con punto decimal en matemática"
"- Fixed bug with primes in subscript" = "- Se corrigió un error con primas en subíndices"
"- Fixed weak spacing" = "- Se corrigió el espaciado débil"
"- Fixed crash when text within math contains a newline" = "- Se corrigió un fallo cuando el texto dentro de matemática contiene un salto de línea"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- Added hints when trying to call a function stored in a dictionary without extra parentheses" = "- Se agregaron sugerencias al intentar llamar a una función guardada en un diccionario sin paréntesis adicionales"
"- Fixed hint when referencing an equation without numbering" = "- Se corrigió la sugerencia al referenciar una ecuación sin numeración"
"- Added more details to some diagnostics (e.g. when SVG decoding fails)" = "- Se agregaron más detalles a algunos diagnósticos (p. ej., cuando falla la decodificación de un SVG)"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added `typst update` command for self-updating the CLI (thanks to #gh(\"jimvdl\"))" = "- Se agregó el comando `typst update` para autoactualizar la CLI (gracias a #gh(\"jimvdl\"))"
"- Added download progress indicator for packages and updates" = "- Se agregó un indicador de progreso de descarga para paquetes y actualizaciones"
"- Added `--format` argument to explicitly specify the output format" = "- Se agregó el argumento `--format` para especificar explícitamente el formato de salida"
"- The CLI now respects proxy configuration through environment variables and has a new `--cert` option for setting a custom CA certificate" = "- La CLI ahora respeta la configuración de proxy mediante variables de entorno y tiene una nueva opción `--cert` para establecer un certificado de CA personalizado"
"- Fixed crash when field wasn't present and `--one` is passed to `typst query`" = "- Se corrigió un fallo cuando no estaba presente el campo y se pasaba `--one` a `typst query`"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Added @guides:page-setup[Page Setup Guide]" = "- Se agregó la @guides:page-setup[Guía de configuración de página]"
"- Added @figure.caption function that can be used for simpler figure customization (*Breaking change* because `it.caption` now renders the full caption with supplement in figure show rules and manual outlines)" = "- Se agregó la función @figure.caption, que sirve para personalizar figuras de forma más simple (*Cambio incompatible*, porque `it.caption` ahora renderiza el epígrafe completo con suplemento en las reglas show de figuras y en los índices manuales)"
"- Moved `caption-pos` argument to `figure.caption` function and renamed it to `position` *(Breaking change)*" = "- Se movió el argumento `caption-pos` a la función `figure.caption` y se renombró a `position` *(Cambio incompatible)*"
"- Added @figure.caption.separator[`separator`] argument to `figure.caption` function" = "- Se agregó el argumento @figure.caption.separator[`separator`] a la función `figure.caption`"
"- Added support for combination of and/or and before/after @selector[selectors]" = "- Se agregó compatibilidad con la combinación de selectores @selector[and/or y before/after]"
"- Packages can now specify a #link(\"https://github.com/typst/packages#package-format\")[minimum compiler version] they require to work" = "- Los paquetes ahora pueden especificar una #link(\"https://github.com/typst/packages#package-format\")[versión mínima del compilador] que necesitan para funcionar"
"- Fixed parser bug where method calls could be moved onto their own line for `[#let]` expressions in markup *(Breaking change)*" = "- Se corrigió un error del analizador por el cual las llamadas a métodos se podían mover a su propia línea en expresiones `[#let]` en marcado *(Cambio incompatible)*"
"- Fixed bugs in sentence and title case conversion for bibliographies" = "- Se corrigieron errores en la conversión a mayúsculas de oración y de título para bibliografías"
"- Fixed supplements for alphanumeric and author-title bibliography styles" = "- Se corrigieron los suplementos de los estilos de bibliografía alfanumérico y autor-título"
"- Fixed off-by-one error in APA bibliography style" = "- Se corrigió un error de uno en el estilo de bibliografía APA"
"= Development <development>" = "= Desarrollo <development>"
"- Made `Span` and `FileId` more type-safe so that all error conditions must be handled by `World` implementors" = "- Se hicieron `Span` y `FileId` más seguros en cuanto a tipos, de modo que quienes implementan `World` deben manejar todas las condiciones de error"

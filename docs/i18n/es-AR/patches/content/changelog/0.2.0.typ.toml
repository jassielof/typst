# Line patches for docs/content/changelog/0.2.0.typ (see docs/src/i18n.rs).
"= Breaking changes <breaking-changes>" = "= Cambios incompatibles <breaking-changes>"
"- Removed support for iterating over index and value in @reference:scripting:loops[for loops]. This is now handled via unpacking and enumerating. Same goes for the @array.map[`map`] method." = "- Se eliminó la compatibilidad con iterar sobre índice y valor en @reference:scripting:loops[bucles for]. Ahora esto se maneja mediante desempaquetado y enumeración. Lo mismo vale para el método @array.map[`map`]."
"- @dictionary[Dictionaries] now iterate in insertion order instead of alphabetical order." = "- Los @dictionary[diccionarios] ahora iteran en orden de inserción y no en orden alfabético."
"= New features <new-features>" = "= Funciones nuevas <new-features>"
"- Added @reference:scripting:bindings[unpacking syntax] for let bindings, which allows things like `{let (1, 2) = array}`" = "- Se agregó la @reference:scripting:bindings[sintaxis de desempaquetado] para enlaces let, que permite cosas como `{let (1, 2) = array}`"
"- Added @array.enumerate[`enumerate`] method" = "- Se agregó el método @array.enumerate[`enumerate`]"
"- Added `path` function for drawing Bézier paths" = "- Se agregó la función `path` para dibujar trazados de Bézier"
"- Added @layout function to access the size of the surrounding page or container" = "- Se agregó la función @layout para acceder al tamaño de la página o del contenedor que la rodea"
"- Added `key` parameter to @array.sorted[`sorted`] method" = "- Se agregó el parámetro `key` al método @array.sorted[`sorted`]"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Fixed `--open` flag blocking the program" = "- Se corrigió que el indicador `--open` bloqueara el programa"
"- New Computer Modern font is now embedded into the binary" = "- La fuente New Computer Modern ahora está incrustada en el binario"
"- Shell completions and man pages can now be generated by setting the `GEN_ARTIFACTS` environment variable to a target directory and then building Typst" = "- Ahora se pueden generar autocompletados de shell y páginas de manual estableciendo la variable de entorno `GEN_ARTIFACTS` en un directorio de destino y compilando Typst"
"= Miscellaneous improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Fixed page numbering in outline" = "- Se corrigió la numeración de páginas en el índice"
"- Added basic i18n for a few more languages (AR, NB, CS, NN, PL, SL, ES, UA, VI)" = "- Se agregó internacionalización básica para algunos idiomas más (AR, NB, CS, NN, PL, SL, ES, UA, VI)"
"- Added a few numbering patterns (Ihora, Chinese)" = "- Se agregaron algunos patrones de numeración (Ihora, chino)"
"- Added `sinc` @math.op[operator]" = "- Se agregó el @math.op[operador] `sinc`"
"- Fixed bug where math could not be hidden with @hide" = "- Se corrigió un error por el cual la matemática no se podía ocultar con @hide"
"- Fixed sizing issues with box, block, and shapes" = "- Se corrigieron problemas de dimensionamiento con cajas, bloques y formas"
"- Fixed some translations" = "- Se corrigieron algunas traducciones"
"- Fixed inversion of \"R\" in @math.cal[`cal`] and @math.frak[`frak`] styles" = "- Se corrigió la inversión de la \"R\" en los estilos @math.cal[`cal`] y @math.frak[`frak`]"
"- Fixed some styling issues in math" = "- Se corrigieron algunos problemas de estilo en matemática"
"- Fixed supplements of references to headings" = "- Se corrigieron los suplementos de las referencias a títulos"
"- Fixed syntax highlighting of identifiers in certain scenarios" = "- Se corrigió el resaltado de sintaxis de identificadores en ciertos escenarios"
"- @ratio[Ratios] can now be multiplied with more types and be converted to @float[floats] with the @float function" = "- Las @ratio[proporciones] ahora se pueden multiplicar con más tipos y convertir en @float[flotantes] con la función @float"

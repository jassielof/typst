# Line patches for docs/content/changelog/0.11.1.typ (see docs/src/i18n.rs).
"= Security <security>" = "= Seguridad <security>"
"- Fixed a vulnerability where image files at known paths could be embedded into the PDF even if they were outside of the project directory" = "- Se corrigió una vulnerabilidad por la cual se podían incrustar en el PDF archivos de imagen en rutas conocidas aunque estuvieran fuera del directorio del proyecto"
"= Bibliography <bibliography>" = "= Bibliografía <bibliography>"
"- Fixed et-al handling in subsequent citations" = "- Se corrigió el manejo de et al. en las citas subsiguientes"
"- Fixed suppression of title for citations and bibliography references with no author" = "- Se corrigió la supresión del título para citas y referencias de bibliografía sin autor"
"- Fixed handling of initials in citation styles without a delimiter" = "- Se corrigió el manejo de las iniciales en estilos de cita sin delimitador"
"- Fixed bug with citations in footnotes" = "- Se corrigió un error con citas en notas al pie"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Fixed interaction of @par.first-line-indent[`first-line-indent`] and @outline" = "- Se corrigió la interacción entre @par.first-line-indent[`first-line-indent`] y @outline"
"- Fixed compression of CJK punctuation marks at line start and end" = "- Se corrigió la compresión de los signos de puntuación CJK al comienzo y al final de la línea"
"- Fixed handling of @rect[rectangles] with negative dimensions" = "- Se corrigió el manejo de @rect[rectángulos] con dimensiones negativas"
"- Fixed layout of `path` in explicitly sized container" = "- Se corrigió el diseño de `path` en un contenedor de tamaño explícito"
"- Fixed broken @raw text in right-to-left paragraphs" = "- Se corrigió el texto @raw roto en párrafos de derecha a izquierda"
"- Fixed tab rendering in `raw` text with language `typ` or `typc`" = "- Se corrigió el renderizado de tabulaciones en texto `raw` con el lenguaje `typ` o `typc`"
"- Fixed highlighting of multi-line `raw` text enclosed by single backticks" = "- Se corrigió el resaltado de texto `raw` de varias líneas encerrado entre acentos graves simples"
"- Fixed indentation of overflowing lines in `raw` blocks" = "- Se corrigió la sangría de las líneas desbordadas en bloques `raw`"
"- Fixed extra space when `raw` text ends with a backtick" = "- Se corrigió un espacio extra cuando el texto `raw` termina con un acento grave"
"= Math <math>" = "= Matemática <math>"
"- Fixed broken @math.equation[equations] in right-to-left paragraphs" = "- Se corrigieron @math.equation[ecuaciones] rotas en párrafos de derecha a izquierda"
"- Fixed missing @math.bb[blackboard bold] letters" = "- Se corrigieron letras faltantes de @math.bb[doble trazo (blackboard bold)]"
"- Fixed error on empty arguments in 2D math argument list" = "- Se corrigió un error con argumentos vacíos en una lista de argumentos matemáticos 2D"
"- Fixed stretching via @math.mid[`mid`] for various characters" = "- Se corrigió el estiramiento mediante @math.mid[`mid`] para varios caracteres"
"- Fixed that alignment points in equations were affected by `{set align(..)}`" = "- Se corrigió que los puntos de alineación en ecuaciones se vieran afectados por `{set align(..)}`"
"= Export <export>" = "= Exportación <export>"
"- Fixed @smartquote[smart quotes] in PDF outline" = "- Se corrigieron las @smartquote[comillas tipográficas] en el índice (outline) del PDF"
"- Fixed @tiling[patterns] with spacing in PDF" = "- Se corrigieron los @tiling[patrones] con espaciado en PDF"
"- Fixed wrong PDF page labels when @page.numbering[page numbering] was disabled after being previously enabled" = "- Se corrigieron las etiquetas de página erróneas del PDF cuando la @page.numbering[numeración de páginas] se desactivaba después de haber estado activada"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Fixed overflow for large numbers in external data files (by converting to floats instead)" = "- Se corrigió el desbordamiento con números grandes en archivos de datos externos (convirtiéndolos a flotantes)"
"- Fixed @str.trim[`{str.trim(regex, at: end)}`] when the whole string is matched" = "- Se corrigió @str.trim[`{str.trim(regex, at: end)}`] cuando coincide toda la cadena"
"= Miscellaneous <miscellaneous>" = "= Varios <miscellaneous>"
"- Fixed deformed strokes for specific shapes and thicknesses" = "- Se corrigieron trazos deformados en formas y grosores específicos"
"- Fixed newline handling in code mode: There can now be comments within chained method calls and between an `if` branch and the `else` keyword" = "- Se corrigió el manejo de saltos de línea en modo código: ahora puede haber comentarios dentro de llamadas a métodos encadenadas y entre una rama `if` y la palabra clave `else`"
"- Fixed inefficiency with incremental reparsing" = "- Se corrigió una ineficiencia en el reanálisis incremental"
"- Fixed autocompletions for relative file imports" = "- Se corrigieron los autocompletados de importaciones de archivos relativos"
"- Fixed crash in autocompletion handler" = "- Se corrigió un fallo en el manejador de autocompletado"
"- Fixed a bug where the path and entrypoint printed by `typst init` were not properly escaped" = "- Se corrigió un error por el cual la ruta y el punto de entrada que imprime `typst init` no estaban escapados correctamente"
"- Fixed various documentation errors" = "- Se corrigieron varios errores de la documentación"

# Line patches for docs/content/changelog/0.10.0.typ (see docs/src/i18n.rs).
"= Bibliography management <bibliography-management>" = "= Gestión de bibliografías <bibliography-management>"
"- Added support for citation collapsing (e.g. `[[1]-[3]]` instead of `[[1], [2], [3]]`) if requested by a CSL style" = "- Se agregó compatibilidad con el colapso de citas (p. ej., `[[1]-[3]]` en lugar de `[[1], [2], [3]]`) si lo pide un estilo CSL"
"- Fixed bug where an additional space would appear after a group of citations" = "- Se corrigió un error por el cual aparecía un espacio adicional después de un grupo de citas"
"- Fixed link show rules for links in the bibliography" = "- Se corrigieron las reglas show de enlaces para los enlaces en la bibliografía"
"- Fixed show-set rules on citations" = "- Se corrigieron las reglas show-set sobre citas"
"- Fixed bibliography-related crashes that happened on some systems" = "- Se corrigieron fallos relacionados con la bibliografía que ocurrían en algunos sistemas"
"- Corrected name of the GB/T 7714 family of styles from 7114 to 7714" = "- Se corrigió el nombre de la familia de estilos GB/T 7714, que era 7114"
"- Fixed missing title in some bibliography styles" = "- Se corrigió el título faltante en algunos estilos de bibliografía"
"- Fixed printing of volumes in some styles" = "- Se corrigió la impresión de los volúmenes en algunos estilos"
"- Fixed delimiter order for contributors in some styles (e.g. APA)" = "- Se corrigió el orden de los delimitadores de los colaboradores en algunos estilos (p. ej., APA)"
"- Fixed behavior of alphanumeric style" = "- Se corrigió el comportamiento del estilo alfanumérico"
"- Fixed multiple bugs with GB/T 7714 style" = "- Se corrigieron varios errores del estilo GB/T 7714"
"- Fixed escaping in Hayagriva values" = "- Se corrigió el escape en los valores de Hayagriva"
"- Fixed crashes with empty dates in Hayagriva files" = "- Se corrigieron fallos con fechas vacías en archivos de Hayagriva"
"- Fixed bug with spacing around math blocks" = "- Se corrigió un error con el espaciado alrededor de bloques matemáticos"
"- Fixed title case formatting after verbatim text and apostrophes" = "- Se corrigió el formato de mayúsculas de título después de texto literal y apóstrofos"
"- Page ranges in `.bib` files can now be arbitrary strings" = "- Los rangos de páginas en archivos `.bib` ahora pueden ser cadenas arbitrarias"
"- Multi-line values in `.bib` files are now parsed correctly" = "- Los valores de varias líneas en archivos `.bib` ahora se analizan correctamente"
"- Entry keys in `.bib` files now allow more characters" = "- Las claves de entrada en archivos `.bib` ahora admiten más caracteres"
"- Fixed error message for empty dates in `.bib` files" = "- Se corrigió el mensaje de error para fechas vacías en archivos `.bib`"
"- Added support for years of lengths other than 4 without leading zeros in `.bib` files" = "- Se agregó compatibilidad con años de longitud distinta de 4 sin ceros a la izquierda en archivos `.bib`"
"- More LaTeX commands (e.g. for quotes) are now respected in `.bib` files" = "- Ahora se respetan más comandos de LaTeX (p. ej., para comillas) en archivos `.bib`"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- Added support for @tiling[patterns] as fills and strokes" = "- Se agregó compatibilidad con @tiling[patrones] como rellenos y trazos"
"- The `alpha` parameter of the @color.components[`components`] function on colors is now a named parameter *(Breaking change)*" = "- El parámetro `alpha` de la función @color.components[`components`] de los colores ahora es un parámetro con nombre *(Cambio incompatible)*"
"- Added support for the @color.oklch[Oklch] color space" = "- Se agregó compatibilidad con el espacio de color @color.oklch[Oklch]"
"- Improved conversions between colors in different color spaces" = "- Se mejoraron las conversiones entre colores de distintos espacios de color"
"- Removed restrictions on @color.oklab[Oklab] chroma component" = "- Se quitaron las restricciones del componente de croma de @color.oklab[Oklab]"
"- Fixed @block.clip[clipping] on blocks and boxes without a stroke" = "- Se corrigió el @block.clip[recorte] en bloques y cajas sin trazo"
"- Fixed bug with @gradient[gradients] on math" = "- Se corrigió un error con @gradient[degradés] en matemática"
"- Fixed bug with gradient rotation on text" = "- Se corrigió un error con la rotación de degradés en texto"
"- Fixed bug with gradient colors in PDF" = "- Se corrigió un error con los colores de degradés en PDF"
"- Fixed relative base of Oklab chroma ratios" = "- Se corrigió la base relativa de las proporciones de croma de Oklab"
"- Fixed Oklab color negation" = "- Se corrigió la negación de colores Oklab"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- CJK text can now be emphasized with the `*` and `_` syntax even when there are no spaces" = "- El texto CJK ahora se puede poner en énfasis con la sintaxis `*` y `_` incluso cuando no hay espacios"
"- Added basic i18n for Greek and Estonian" = "- Se agregó internacionalización básica para griego y estonio"
"- Improved default @figure.caption.separator[figure caption separator] for Chinese, French, and Russian" = "- Se mejoró el @figure.caption.separator[separador de epígrafe de figura] predeterminado para chino, francés y ruso"
"- Changed default @figure.supplement[figure supplement] for Russian to short form" = "- Se cambió a la forma corta el @figure.supplement[suplemento de figura] predeterminado para el ruso"
"- Fixed @text.cjk-latin-spacing[CJK-Latin-spacing] before line breaks and in @locate calls" = "- Se corrigió el @text.cjk-latin-spacing[espaciado entre CJK y latín] antes de los saltos de línea y en llamadas a @locate"
"- Fixed line breaking at the end of links" = "- Se corrigió el salto de línea al final de los enlaces"
"= Math <math>" = "= Matemática <math>"
"- Added @math.mid[`mid`] function for scaling a delimiter up to the height of the surrounding @math.lr[`lr`] group" = "- Se agregó la función @math.mid[`mid`] para escalar un delimitador hasta la altura del grupo @math.lr[`lr`] que lo rodea"
"- The @math.op[`op`] function can now take any content, not just strings" = "- La función @math.op[`op`] ahora puede recibir cualquier contenido, no solo cadenas de texto"
"- Improved documentation for @math:alignment[math alignment]" = "- Se mejoró la documentación de la @math:alignment[alineación matemática]"
"- Fixed swallowing of trailing comma when a symbol is used in a function-like way (e.g. `pi(a,b,)`)" = "- Se corrigió que se tragara la coma final cuando un símbolo se usa como una función (p. ej., `pi(a,b,)`)"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Any non-identifier dictionary key is now interpreted as an expression: For instance, `{((key): value)}` will create a dictionary with a dynamic key" = "- Cualquier clave de diccionario que no sea un identificador ahora se interpreta como una expresión: por ejemplo, `{((key): value)}` crea un diccionario con una clave dinámica"
"- The @stroke type now has a constructor that converts a value to a stroke or creates one from its parts" = "- El tipo @stroke ahora tiene un constructor que convierte un valor en un trazo o lo crea a partir de sus partes"
"- Added constructor for @arguments type" = "- Se agregó un constructor para el tipo @arguments"
"- Added @calc.div-euclid and @calc.rem-euclid functions" = "- Se agregaron las funciones @calc.div-euclid y @calc.rem-euclid"
"- Fixed equality of @arguments" = "- Se corrigió la igualdad de @arguments"
"- Fixed @repr of @color.cmyk[`cmyk`] colors" = "- Se corrigió @repr de los colores @color.cmyk[`cmyk`]"
"- Fixed crashes with provided elements like figure captions, outline entries, and footnote entries" = "- Se corrigieron fallos con elementos provistos como epígrafes de figuras, entradas de índice y entradas de notas al pie"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- Show rules that match on their own output now produce an appropriate error message instead of a crash (this is a first step, in the future they will just work)" = "- Las reglas show que coinciden con su propia salida ahora producen un mensaje de error adecuado en lugar de un fallo (es un primer paso; en el futuro simplemente funcionarán)"
"- Too highly or infinitely nested layouts now produce error messages instead of crashes" = "- Los diseños anidados en exceso o infinitamente ahora producen mensajes de error en lugar de fallos"
"- Added hints for invalid identifiers" = "- Se agregaron sugerencias para identificadores inválidos"
"- Added hint when trying to use a manually constructed footnote or outline entry" = "- Se agregó una sugerencia al intentar usar una nota al pie o una entrada de índice construida manualmente"
"- Added missing details to autocompletions for types" = "- Se agregaron detalles faltantes a los autocompletados de tipos"
"- Improved error message when passing a named argument where a positional one is expected" = "- Se mejoró el mensaje de error al pasar un argumento con nombre donde se espera uno posicional"
"- Jump from click now works on raw blocks" = "- El salto desde un clic ahora funciona en bloques raw"
"= Export <export>" = "= Exportación <export>"
"- PDF compilation output is now again fully byte-by-byte reproducible if the document's @document.date[`date`] is set manually" = "- La salida de compilación a PDF vuelve a ser totalmente reproducible byte a byte si la @document.date[`date`] del documento se establece manualmente"
"- Fixed color export in SVG" = "- Se corrigió la exportación de colores en SVG"
"- Fixed PDF metadata encoding of multiple @document.author[authors]" = "- Se corrigió la codificación de los metadatos del PDF con varios @document.author[autores]"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Fixed a major bug where `typst watch` would confuse files and fail to pick up updates" = "- Se corrigió un error importante por el cual `typst watch` confundía archivos y no detectaba actualizaciones"
"- Fetching of the release metadata in `typst update` now respects proxies" = "- La obtención de los metadatos de la versión en `typst update` ahora respeta los proxies"
"- Fixed bug with `--open` flag on Windows when the path contains a space" = "- Se corrigió un error con el indicador `--open` en Windows cuando la ruta contiene un espacio"
"- The `TYPST_FONT_PATHS` environment variable can now contain multiple paths (separated by `;` on Windows and `:` elsewhere)" = "- La variable de entorno `TYPST_FONT_PATHS` ahora puede contener varias rutas (separadas por `;` en Windows y `:` en el resto)"
"- Updated embedded New Computer Modern fonts to version 4.7" = "- Se actualizaron las fuentes New Computer Modern incrustadas a la versión 4.7"
"- The watching process doesn't stop anymore when the main file contains invalid UTF-8" = "- El proceso de observación ya no se detiene cuando el archivo principal contiene UTF-8 inválido"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Parallelized image encoding in PDF export" = "- Se paralelizó la codificación de imágenes en la exportación a PDF"
"- Improved the internal representation of content for improved performance" = "- Se mejoró la representación interna del contenido para aumentar el rendimiento"
"- Optimized introspection (query, counter, etc.) performance" = "- Se optimizó el rendimiento de la introspección (query, counter, etc.)"
"- The @document.title[document title] can now be arbitrary content instead of just a string" = "- El @document.title[título del documento] ahora puede ser contenido arbitrario y no solo una cadena de texto"
"- The @enum.number-align[`number-align`] parameter on numbered lists now also accepts vertical alignments" = "- El parámetro @enum.number-align[`number-align`] de las listas numeradas ahora también acepta alineaciones verticales"
"- Fixed selectors on @quote[quote] elements" = "- Se corrigieron los selectores sobre elementos @quote[quote]"
"- Fixed parsing of `[#return]` expression in markup" = "- Se corrigió el análisis de la expresión `[#return]` en marcado"
"- Fixed bug where inline equations were displayed in equation outlines" = "- Se corrigió un error por el cual las ecuaciones en línea se mostraban en los índices de ecuaciones"
"- Fixed potential CRLF issue in @raw blocks" = "- Se corrigió un posible problema de CRLF en bloques @raw"
"- Fixed a bug where Chinese numbering couldn't exceed the number 255" = "- Se corrigió un error por el cual la numeración china no podía superar el número 255"
"= Development <development>" = "= Desarrollo <development>"
"- Merged `typst` and `typst-library` and extracted `typst-pdf`, `typst-svg`, and `typst-render` into separate crates" = "- Se fusionaron `typst` y `typst-library` y se extrajeron `typst-pdf`, `typst-svg` y `typst-render` a crates separados"
"- The Nix flake now includes the git revision when running `typst --version`" = "- El flake de Nix ahora incluye la revisión de git al ejecutar `typst --version`"

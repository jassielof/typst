# Line patches for docs/content/changelog/0.7.0.typ (see docs/src/i18n.rs).
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Added support for floating figures through the @figure.placement[`placement`] argument on the figure function" = "- Se agregó compatibilidad con figuras flotantes mediante el argumento @figure.placement[`placement`] de la función figure"
"- Added support for arbitrary floating content through the @place.float[`float`] argument on the place function" = "- Se agregó compatibilidad con contenido flotante arbitrario mediante el argumento @place.float[`float`] de la función place"
"- Added support for loading `.sublime-syntax` files as highlighting @raw.syntaxes[syntaxes] for raw blocks" = "- Se agregó compatibilidad para cargar archivos `.sublime-syntax` como @raw.syntaxes[sintaxis] de resaltado para bloques raw"
"- Added support for loading `.tmTheme` files as highlighting @raw.theme[themes] for raw blocks" = "- Se agregó compatibilidad para cargar archivos `.tmTheme` como @raw.theme[temas] de resaltado para bloques raw"
"- Added _bounds_ option to @text.top-edge[`top-edge`] and @text.bottom-edge[`bottom-edge`] arguments of text function for tight bounding boxes" = "- Se agregó la opción _bounds_ a los argumentos @text.top-edge[`top-edge`] y @text.bottom-edge[`bottom-edge`] de la función text para cuadros delimitadores ajustados"
"- Removed nonsensical top- and bottom-edge options, e.g. _ascender_ for the bottom edge *(Breaking change)*" = "- Se eliminaron opciones sin sentido de borde superior e inferior, p. ej., _ascender_ para el borde inferior *(Cambio incompatible)*"
"- Added @text.script[`script`] argument to text function" = "- Se agregó el argumento @text.script[`script`] a la función text"
"- Added @smartquote.alternative[`alternative`] argument to smart quote function" = "- Se agregó el argumento @smartquote.alternative[`alternative`] a la función de comillas tipográficas"
"- Added basic i18n for Japanese" = "- Se agregó internacionalización básica para japonés"
"- Added hyphenation support for `nb` and `nn` language codes in addition to `no`" = "- Se agregó compatibilidad con la separación silábica para los códigos de idioma `nb` y `nn`, además de `no`"
"- Fixed positioning of @place[placed elements] in containers" = "- Se corrigió la ubicación de los @place[elementos ubicados] en contenedores"
"- Fixed overflowing containers due to optimized line breaks" = "- Se corrigieron contenedores desbordados por los saltos de línea optimizados"
"= Export <export>" = "= Exportación <export>"
"- Greatly improved export of SVG images to PDF. Many thanks to #gh(\"LaurenzV\") for their work on this." = "- Se mejoró mucho la exportación de imágenes SVG a PDF. Muchas gracias a #gh(\"LaurenzV\") por su trabajo en esto."
"- Added support for the alpha channel of RGBA colors in PDF export" = "- Se agregó compatibilidad con el canal alfa de los colores RGBA en la exportación a PDF"
"- Fixed a bug with PPI (pixels per inch) for PNG export" = "- Se corrigió un error con los PPI (píxeles por pulgada) en la exportación a PNG"
"= Math <math>" = "= Matemática <math>"
"- Improved layout of primes (e.g. in `[$a'_1$]`)" = "- Se mejoró el diseño de las primas (p. ej., en `[$a'_1$]`)"
"- Improved display of multi-primes (e.g. in `[$a''$]`)" = "- Se mejoró la visualización de las primas múltiples (p. ej., en `[$a''$]`)"
"- Improved layout of @math.root[roots]" = "- Se mejoró el diseño de las @math.root[raíces]"
"- Changed relations to show attachments as @math.limits[limits] by default (e.g. in `[$a ->^x b$]`)" = "- Se cambió para que las relaciones muestren por defecto los adjuntos como @math.limits[límites] (p. ej., en `[$a ->^x b$]`)"
"- Large operators and delimiters are now always vertically centered" = "- Los operadores y delimitadores grandes ahora siempre se centran verticalmente"
"- @box[Boxes] in equations now sit on the baseline instead of being vertically centered by default. Notably, this does not affect @block[blocks] because they are not inline elements." = "- Las @box[cajas] en ecuaciones ahora se apoyan sobre la línea base en lugar de centrarse verticalmente por defecto. Cabe destacar que esto no afecta a los @block[bloques], porque no son elementos en línea."
"- Added support for @h.weak[weak spacing]" = "- Se agregó compatibilidad con @h.weak[espaciado débil]"
"- Added support for OpenType character variants" = "- Se agregó compatibilidad con las variantes de carácter de OpenType"
"- Added support for customizing the @math.class[math class] of content" = "- Se agregó compatibilidad para personalizar la @math.class[clase matemática] del contenido"
"- Fixed spacing around `.`, `\\/`, and `...`" = "- Se corrigió el espaciado alrededor de `.`, `\\/` y `...`"
"- Fixed spacing between closing delimiters and large operators" = "- Se corrigió el espaciado entre delimitadores de cierre y operadores grandes"
"- Fixed a bug with math font weight selection" = "- Se corrigió un error en la selección del peso de la fuente matemática"
"- Symbols and Operators *(Breaking changes)*" = "- Símbolos y operadores *(Cambios incompatibles)*"
"- Added `id`, `im`, and `tr` text @math.op[operators]" = "- Se agregaron los @math.op[operadores] de texto `id`, `im` y `tr`"
"- Renamed `ident` to `equiv` with alias `eq.triple` and removed `ident.strict` in favor of `eq.quad`" = "- Se renombró `ident` a `equiv` con el alias `eq.triple` y se eliminó `ident.strict` en favor de `eq.quad`"
"- Renamed `ast.sq` to `ast.square` and `integral.sq` to `integral.square`" = "- Se renombraron `ast.sq` a `ast.square` e `integral.sq` a `integral.square`"
"- Renamed `.eqq` modifier to `.equiv` (and `.neqq` to `.nequiv`) for `tilde`, `gt`, `lt`, `prec`, and `succ`" = "- Se renombró el modificador `.eqq` a `.equiv` (y `.neqq` a `.nequiv`) para `tilde`, `gt`, `lt`, `prec` y `succ`"
"- Added `emptyset` as alias for `nothing`" = "- Se agregó `emptyset` como alias de `nothing`"
"- Added `lt.curly` and `gt.curly` as aliases for `prec` and `succ`" = "- Se agregaron `lt.curly` y `gt.curly` como alias de `prec` y `succ`"
"- Added `aleph`, `beth`, and `gimmel` as alias for `alef`, `bet`, and `gimel`" = "- Se agregaron `aleph`, `beth` y `gimmel` como alias de `alef`, `bet` y `gimel`"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Fields" = "- Campos"
"- Added `abs` and `em` field to @length[lengths]" = "- Se agregaron los campos `abs` y `em` a las @length[longitudes]"
"- Added `ratio` and `length` field to @relative[relative lengths]" = "- Se agregaron los campos `ratio` y `length` a las @relative[longitudes relativas]"
"- Added `x` and `y` field to @align.alignment[2d alignments]" = "- Se agregaron los campos `x` e `y` a las @align.alignment[alineaciones 2D]"
"- Added `paint`, `thickness`, `cap`, `join`, `dash`, and `miter-limit` field to @stroke[strokes]" = "- Se agregaron los campos `paint`, `thickness`, `cap`, `join`, `dash` y `miter-limit` a los @stroke[trazos]"
"- Accessor and utility methods" = "- Métodos de acceso y utilidad"
"- Added @array.dedup[`dedup`] method to arrays" = "- Se agregó el método @array.dedup[`dedup`] a los arrays"
"- Added `pt`, `mm`, `cm`, and `inches` method to @length[lengths]" = "- Se agregaron los métodos `pt`, `mm`, `cm` e `inches` a las @length[longitudes]"
"- Added `deg` and `rad` method to @angle[angles]" = "- Se agregaron los métodos `deg` y `rad` a los @angle[ángulos]"
"- Added `kind`, `hex`, `rgba`, `cmyk`, and `luma` method to @color[colors]" = "- Se agregaron los métodos `kind`, `hex`, `rgba`, `cmyk` y `luma` a los @color[colores]"
"- Added `axis`, `start`, `end`, and `inv` method to @stack.dir[directions]" = "- Se agregaron los métodos `axis`, `start`, `end` e `inv` a las @stack.dir[direcciones]"
"- Added `axis` and `inv` method to @align.alignment[alignments]" = "- Se agregaron los métodos `axis` e `inv` a las @align.alignment[alineaciones]"
"- Added `inv` method to @align.alignment[2d alignments]" = "- Se agregó el método `inv` a las @align.alignment[alineaciones 2D]"
"- Added `start` argument to @array.enumerate[`enumerate`] method on arrays" = "- Se agregó el argumento `start` al método @array.enumerate[`enumerate`] de los arrays"
"- Added @color.mix function" = "- Se agregó la función @color.mix"
"- Added `mode` and `scope` arguments to @eval function" = "- Se agregaron los argumentos `mode` y `scope` a la función @eval"
"- Added @bytes type for holding large byte buffers" = "- Se agregó el tipo @bytes para guardar búferes grandes de bytes"
"- Added @read.encoding[`encoding`] argument to read function to read a file as bytes instead of a string" = "- Se agregó el argumento @read.encoding[`encoding`] a la función read para leer un archivo como bytes en lugar de como cadena de texto"
"- Added `image.decode` function for decoding an image directly from a string or bytes" = "- Se agregó la función `image.decode` para decodificar una imagen directamente desde una cadena de texto o bytes"
"- Added @bytes function for converting a string or an array of integers to bytes" = "- Se agregó la función @bytes para convertir una cadena de texto o un array de enteros en bytes"
"- Added @array function for converting bytes to an array of integers" = "- Se agregó la función @array para convertir bytes en un array de enteros"
"- Added support for converting bytes to a string with the @str function" = "- Se agregó compatibilidad para convertir bytes en una cadena de texto con la función @str"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- Added support for compiler warnings" = "- Se agregó compatibilidad con advertencias del compilador"
"- Added warning when compilation does not converge within five attempts due to intense use of introspection features" = "- Se agregó una advertencia cuando la compilación no converge en cinco intentos por el uso intensivo de funciones de introspección"
"- Added warnings for empty emphasis (`__` and `**`)" = "- Se agregaron advertencias para énfasis vacío (`__` y `**`)"
"- Improved error message for invalid field assignments" = "- Se mejoró el mensaje de error para asignaciones de campos inválidas"
"- Improved error message after single `#`" = "- Se mejoró el mensaje de error después de un `#` suelto"
"- Improved error message when a keyword is used where an identifier is expected" = "- Se mejoró el mensaje de error cuando se usa una palabra clave donde se espera un identificador"
"- Fixed parameter autocompletion for functions that are in modules" = "- Se corrigió el autocompletado de parámetros para funciones que están en módulos"
"- Import autocompletion now only shows the latest package version until a colon is typed" = "- El autocompletado de importaciones ahora solo muestra la última versión del paquete hasta que se escribe un signo de dos puntos"
"- Fixed autocompletion for dictionary key containing a space" = "- Se corrigió el autocompletado para claves de diccionario que contienen un espacio"
"- Fixed autocompletion for `for` loops" = "- Se corrigió el autocompletado para bucles `for`"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added `typst query` subcommand to execute a @query:command-line-queries[query] on the command line" = "- Se agregó el subcomando `typst query` para ejecutar una @query:command-line-queries[consulta] en la línea de comandos"
"- The `--root` and `--font-path` arguments cannot appear in front of the command anymore *(Breaking change)*" = "- Los argumentos `--root` y `--font-path` ya no pueden aparecer delante del comando *(Cambio incompatible)*"
"- Local and cached packages are now stored in directories of the form `[{namespace}/{name}/{version}]` instead of `[{namespace}/{name}-{version}]` *(Breaking change)*" = "- Los paquetes locales y en caché ahora se guardan en directorios con la forma `[{namespace}/{name}/{version}]` en lugar de `[{namespace}/{name}-{version}]` *(Cambio incompatible)*"
"- Now prioritizes explicitly given fonts (via `--font-path`) over system and embedded fonts when both exist" = "- Ahora prioriza las fuentes dadas explícitamente (mediante `--font-path`) sobre las del sistema y las incrustadas cuando existen ambas"
"- Fixed `typst watch` not working with some text editors" = "- Se corrigió que `typst watch` no funcionara con algunos editores de texto"
"- Fixed displayed compilation time (now includes export)" = "- Se corrigió el tiempo de compilación que se muestra (ahora incluye la exportación)"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Added @heading.bookmarked[`bookmarked`] argument to heading to control whether a heading becomes part of the PDF outline" = "- Se agregó el argumento @heading.bookmarked[`bookmarked`] a heading para controlar si un título pasa a formar parte del índice del PDF"
"- Added @figure.caption.position[`caption-pos`] argument to control the position of a figure's caption" = "- Se agregó el argumento @figure.caption.position[`caption-pos`] para controlar la posición del epígrafe de una figura"
"- Added @metadata function for exposing an arbitrary value to the introspection system" = "- Se agregó la función @metadata para exponer un valor arbitrario al sistema de introspección"
"- Fixed that a @state was identified by the pair `(key, init)` instead of just its `key`" = "- Se corrigió que un @state se identificara por el par `(key, init)` y no solo por su `key`"
"- Improved indent logic of @enum[enumerations]. Instead of requiring at least as much indent as the end of the marker, they now require only one more space indent than the start of the marker. As a result, even long markers like `12.` work with just 2 spaces of indent." = "- Se mejoró la lógica de sangría de las @enum[enumeraciones]. En lugar de requerir al menos tanta sangría como el final del marcador, ahora solo requieren un espacio más de sangría que el comienzo del marcador. Como resultado, incluso marcadores largos como `12.` funcionan con solo 2 espacios de sangría."
"- Fixed bug with indent logic of @raw blocks" = "- Se corrigió un error con la lógica de sangría de los bloques @raw"
"- Fixed a parsing bug with dictionaries" = "- Se corrigió un error de análisis con diccionarios"
"= Development <development>" = "= Desarrollo <development>"
"- Extracted parser and syntax tree into `typst-syntax` crate" = "- Se extrajeron el analizador y el árbol sintáctico al crate `typst-syntax`"
"- The `World::today` implementation of Typst dependents may need fixing if they have the same #link(\"https://github.com/typst/typst/issues/1842\")[bug] that the CLI world had" = "- Puede que haya que corregir la implementación de `World::today` de los dependientes de Typst si tienen el mismo #link(\"https://github.com/typst/typst/issues/1842\")[error] que tenía el mundo de la CLI"

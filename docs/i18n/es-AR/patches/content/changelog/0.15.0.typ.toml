"= Migration guide <migration-guide>" = "= Guía de migración <migration-guide>"
"This section walks you through changes you may need to make to your existing documents to ensure compatibility with Typst 0.15." = "Esta sección te explica los cambios que quizás tengas que hacer en tus documentos existentes para asegurar la compatibilidad con Typst 0.15."
"Typst 0.15 @changelog:0.15.0:removals[removes] definitions from the Typst standard library that were already deprecated in previous Typst versions. If you are still relying on those, also refer to the #link(\"https://typst.app/blog/2025/typst-0.14#migrating\")[Typst 0.14] and #link(\"https://typst.app/blog/2025/typst-0.13#migrating\")[Typst 0.13] migration guides." = "Typst 0.15 @changelog:0.15.0:removals[elimina] definiciones de la biblioteca estándar de Typst que ya estaban obsoletas en versiones anteriores. Si todavía dependés de ellas, consultá también las guías de migración de #link(\"https://typst.app/blog/2025/typst-0.14#migrating\")[Typst 0.14] y de #link(\"https://typst.app/blog/2025/typst-0.13#migrating\")[Typst 0.13]."
"== Baselines <baselines>" = "== Líneas base <baselines>"
"Typst now retains baseline information in more parts of the layout engine (most importantly for @box[boxes], @block[blocks], @list.item[list items], and @math.equation[equations]). This may lead to silent layout shifts. These are generally improvements, but if you've previously counter-acted bad-looking output through explicit adjustments, you may need to revisit those." = "Typst ahora conserva la información de línea base en más partes del motor de diseño (sobre todo para @box[cajas], @block[bloques], @list.item[elementos de lista] y @math.equation[ecuaciones]). Esto puede producir cambios de diseño silenciosos. En general son mejoras, pero si antes corregiste resultados poco prolijos con ajustes explícitos, quizás tengas que revisarlos."
"In particular, Typst will now set the baseline of a @box to the baseline of its first line of content and use it to align the `box` with its surrounding text. This yields better-looking output out of the box." = "En particular, Typst ahora establece la línea base de un @box en la línea base de su primera línea de contenido y la usa para alinear el `box` con el texto que lo rodea. Esto produce mejores resultados sin hacer nada."
"== File paths <file-paths>" = "== Rutas de archivo <file-paths>"
"If you are using Typst on Windows, you may have used backslashes in your file paths. This syntax is not supported anymore. Consistent use of forward slashes ensures your document compiles on all supported platforms." = "Si usás Typst en Windows, es posible que hayas usado barras invertidas en tus rutas de archivo. Esta sintaxis ya no está admitida. Usar barras normales de forma consistente asegura que tu documento compile en todas las plataformas admitidas."
"Moreover, the Typst CLI does not support non-Unicode input paths anymore. Such paths are exceedingly rare today." = "Además, la CLI de Typst ya no admite rutas de entrada que no sean Unicode. Hoy esas rutas son extremadamente raras."
"== #short-or-long[Math stretching][Math glyph stretching] <math-stretching>" = "== #short-or-long[Estiramiento matemático][Estiramiento de glifos matemáticos] <math-stretching>"
"In mathematical typesetting, glyphs frequently need to be stretched to the size of some part of an equation. This primarily applies to brackets, but also accents, arrows, and more. In Typst, this happens implicitly through matched delimiters or explicitly through the @math.lr[`lr`] and @math.stretch[`stretch`] functions." = "En la composición matemática, los glifos con frecuencia deben estirarse hasta el tamaño de alguna parte de una ecuación. Esto se aplica principalmente a los paréntesis, pero también a acentos, flechas y más. En Typst, esto ocurre de forma implícita mediante delimitadores emparejados o de forma explícita mediante las funciones @math.lr[`lr`] y @math.stretch[`stretch`]."
"Typst 0.15 makes some adjustments to how ratios passed to these functions are resolved. Previously, a size of `{200%}` passed to @math.lr.size[`lr.size`] or @math.stretch.size[`stretch.size`] would be interpreted relative to a glyph size that was potentially already affected by @math.display[display sizing]. Now, ratios are always resolved relative to the base glyph size. In practice, this means that, to retain the same appearance, you may need to increase the target sizes you've configured for glyphs that are already larger out of the box in display style (e.g. integrals)." = "Typst 0.15 hace algunos ajustes en cómo se resuelven las proporciones que se pasan a estas funciones. Antes, un tamaño de `{200%}` pasado a @math.lr.size[`lr.size`] o @math.stretch.size[`stretch.size`] se interpretaba respecto de un tamaño de glifo que podía estar ya afectado por el @math.display[tamaño de display]. Ahora las proporciones siempre se resuelven respecto del tamaño del glifo base. En la práctica, esto significa que, para conservar el mismo aspecto, quizás tengas que aumentar los tamaños objetivo que configuraste para glifos que ya son más grandes por defecto en estilo display (p. ej., las integrales)."
"== #short-or-long[Math delimiters][Math delimiters as functions] <math-delimiters>" = "== #short-or-long[Delimitadores matemáticos][Delimitadores matemáticos como funciones] <math-delimiters>"
"In Typst's math mode, various symbols defined in @sym can be called like a function, either to be applied as an accent or to delimit body content. Typst 0.15 extends this handling to additional delimiters like `chevron.l`. This can change the output of existing calls, which would previously fall back to displaying the parentheses (which would rarely have produced desirable output in the case of delimiters)." = "En el modo matemático de Typst, varios símbolos definidos en @sym se pueden llamar como una función, ya sea para aplicarlos como acento o para delimitar contenido. Typst 0.15 extiende este manejo a delimitadores adicionales como `chevron.l`. Esto puede cambiar el resultado de llamadas existentes, que antes recurrían a mostrar los paréntesis (algo que rara vez producía un resultado deseable en el caso de los delimitadores)."
"== Math classes <math-classes>" = "== Clases matemáticas <math-classes>"
"The @math.class[`class`] function defines how part of an equation should be laid out (primarily the spacing around it). In Typst 0.14 and below, the `class` function applied recursively: If applied to a larger piece of content, all items in it would receive the class. In Typst 0.15, the class is only applied to the directly wrapped content. This is mostly a bug fix, but can lead to subtle layout changes." = "La función @math.class[`class`] define cómo debe diseñarse una parte de una ecuación (principalmente el espaciado a su alrededor). En Typst 0.14 y anteriores, la función `class` se aplicaba de forma recursiva: si se aplicaba a un fragmento de contenido más grande, todos sus elementos recibían la clase. En Typst 0.15, la clase solo se aplica al contenido envuelto directamente. Es sobre todo una corrección de errores, pero puede producir cambios sutiles de diseño."
"== #short-or-long[Calligraphic letterforms][Calligraphic letterforms in the default math font] <calligraphic-letterforms>" = "== #short-or-long[Formas caligráficas][Formas caligráficas en la fuente matemática predeterminada] <calligraphic-letterforms>"
"With the update to _New Computer Modern Math_ 8.1.0, the default @math.cal[calligraphic letterforms] were changed. The previous letterforms can still be accessed by selecting @text.stylistic-set[stylistic set] 6." = "Con la actualización a _New Computer Modern Math_ 8.1.0, se cambiaron las @math.cal[formas caligráficas] predeterminadas. Las formas anteriores todavía se pueden obtener seleccionando el @text.stylistic-set[conjunto estilístico] 6."
"== #short-or-long[HTML paragraphs][Paragraphs, boxes, and blocks in HTML] <html-paragraphs>" = "== #short-or-long[Párrafos en HTML][Párrafos, cajas y bloques en HTML] <html-paragraphs>"
"Typst automatically @par:what-becomes-a-paragraph[collects inline-level content into paragraphs]. In Typst 0.14 and below, the exact same rules were used to collect inline-level HTML elements (e.g. a `<span>`) into Typst paragraphs, which in turn result in `<p>` elements. This had the unfortunate effect that even use of the low-level @html[typed HTML API] could result in `<p>` elements appearing automatically. Consider the example below:" = "Typst @par:what-becomes-a-paragraph[agrupa automáticamente el contenido en línea en párrafos]. En Typst 0.14 y anteriores, se usaban exactamente las mismas reglas para agrupar elementos HTML en línea (p. ej., un `<span>`) en párrafos de Typst, que a su vez producen elementos `<p>`. Esto tenía el efecto desafortunado de que incluso el uso de la @html[API HTML tipada] de bajo nivel podía hacer que aparecieran elementos `<p>` automáticamente. Considerá el siguiente ejemplo:"
"Where Typst 0.14 would insert an unexpected additional `<p>` element, Typst 0.15 yields the expected result:" = "Donde Typst 0.14 insertaría un elemento `<p>` adicional inesperado, Typst 0.15 produce el resultado esperado:"
"This change in output is achieved through a few new rules for how paragraphs are collected in HTML export. Previously, Typst would always categorize elements into either inline-level or block-level. It would then force inline-level elements into a paragraph whenever at least one block-level element was present in the same flow of content. In Typst 0.15, elements can instead be considered inline-level, block-level, or _neutral:_" = "Este cambio en la salida se logra con algunas reglas nuevas sobre cómo se agrupan los párrafos en la exportación a HTML. Antes, Typst siempre clasificaba los elementos como de línea o de bloque. Luego forzaba a los elementos en línea a formar un párrafo siempre que hubiera al menos un elemento de bloque en el mismo flujo de contenido. En Typst 0.15, los elementos se pueden considerar en cambio de línea, de bloque o _neutros:_"
"- Text, Typst @box elements and HTML _phrasing content_ (elements that are allowed as children of `<p>` elements) are considered inline-level #footnote[There are a few exceptions: Some elements like `<script>` are considered phrasing content by the HTML specifications, but don't make sense in paragraphs as they default to `display: none`.]" = "- El texto, los elementos @box de Typst y el _contenido de fraseo_ de HTML (los elementos que se permiten como hijos de elementos `<p>`) se consideran de línea #footnote[Hay algunas excepciones: algunos elementos como `<script>` se consideran contenido de fraseo según las especificaciones de HTML, pero no tienen sentido en párrafos porque por defecto tienen `display: none`.]"
"- All other HTML elements are considered neutral" = "- Todos los demás elementos HTML se consideran neutros"
"- Typst @block elements are considered block-level" = "- Los elementos @block de Typst se consideran de bloque"
"Neutral elements don't force adjacent inline-level content into paragraphs. They can co-exist with inline-level content in a _mixed flow._ This ensures that usage of the typed HTML API does not result in extraneous paragraphs." = "Los elementos neutros no fuerzan que el contenido en línea contiguo pase a párrafos. Pueden coexistir con contenido en línea en un _flujo mixto._ Así se asegura que el uso de la API HTML tipada no produzca párrafos superfluos."
"Meanwhile, Typst elements that are block-level out of the box (e.g. @heading) now explicitly use a @block in their default show rule to ensure that they still force adjacent inline-level elements into paragraphs. This ensures consistency in paragraph grouping across paged and HTML export. Package authors should also explicitly use @block[blocks] when creating HTML components that Typst should consider block-level." = "Por su parte, los elementos de Typst que son de bloque por defecto (p. ej., @heading) ahora usan explícitamente un @block en su regla show predeterminada para asegurar que sigan forzando a los elementos en línea contiguos a formar párrafos. Esto garantiza la consistencia del agrupamiento de párrafos entre la exportación paginada y la HTML. Los autores de paquetes también deberían usar explícitamente @block[bloques] al crear componentes HTML que Typst deba considerar de bloque."
"To make this change possible, the way @box[boxes] and @block[blocks] behave in HTML export has been adjusted: Instead of unconditionally wrapping their contents in a `<span>` or `<div>`, they now do just what is necessary to ensure their contents are considered inline- or block-level by browsers. If they contain multiple children, they still create a wrapper element, but for just a single child, they instead configure the CSS `display` property. And if the single child already has the appropriate `display` property by default, it is fully omitted. Then, the effect of the `box` or `block` is limited to influencing Typst's paragraph grouping." = "Para que este cambio sea posible, se ajustó el comportamiento de @box[cajas] y @block[bloques] en la exportación a HTML: en lugar de envolver siempre su contenido en un `<span>` o un `<div>`, ahora hacen solo lo necesario para que los navegadores consideren su contenido de línea o de bloque. Si contienen varios hijos, igualmente crean un elemento contenedor, pero si hay un único hijo, en cambio configuran la propiedad CSS `display`. Y si ese único hijo ya tiene por defecto la propiedad `display` adecuada, se omite por completo. Así, el efecto de `box` o `block` se limita a influir en el agrupamiento de párrafos de Typst."
"== #short-or-long[HTML raw text elements][HTML `script` and `style` elements] <html-script-and-style>" = "== #short-or-long[Elementos de texto sin procesar en HTML][Elementos `script` y `style` de HTML] <html-script-and-style>"
"The typed HTML functions for the HTML @html.script[`script`] and @html.style[`style`] element previously accepted arbitrary body content and then only failed during HTML serialization if the content resulted in non-textual elements. In Typst 0.15, they instead only accept strings in the first place. Note that you can also use them with @raw syntax by accessing the `.text` field." = "Las funciones tipadas de HTML para los elementos HTML @html.script[`script`] y @html.style[`style`] antes aceptaban cualquier contenido como cuerpo y solo fallaban durante la serialización a HTML si el contenido producía elementos no textuales. En Typst 0.15, en cambio, aceptan solo cadenas de texto desde el principio. Tené en cuenta que también podés usarlas con la sintaxis de @raw accediendo al campo `.text`."
"== #short-or-long[Classes in SVGs][Classes in SVG export] <classes-in-svgs>" = "== #short-or-long[Clases en SVG][Clases en la exportación a SVG] <classes-in-svgs>"
"Typst 0.14 and below would generate the `class` attributes `typst-frame`, `typst-doc`, `typst-group`, `typst-shape`, and `typst-text` on SVG elements in SVG export. These are no longer emitted. If you are using the `typst-frame` class to style @html.frame elements in HTML export, you'll need to adapt your style sheet." = "Typst 0.14 y anteriores generaban los atributos `class` `typst-frame`, `typst-doc`, `typst-group`, `typst-shape` y `typst-text` en los elementos SVG de la exportación a SVG. Ya no se emiten. Si usás la clase `typst-frame` para darle estilo a elementos @html.frame en la exportación a HTML, vas a tener que adaptar tu hoja de estilos."
"== #short-or-long[Variable families][Variable font family names] <variable-families>" = "== #short-or-long[Familias variables][Nombres de familias de fuentes variables] <variable-families>"
"Typst aims to unify different fonts from the same family under a single family name. To that effect, it automatically trims common style suffixes like \"Bold\" or \"Condensed\" from font family names. Instead of selecting these through the name, they should be accessed through Typst's built-in mechanisms (such as the @text.weight[`weight`] and @text.stretch[`stretch`] parameters)." = "Typst busca unificar las distintas fuentes de una misma familia bajo un único nombre de familia. Con ese fin, recorta automáticamente de los nombres de familia los sufijos de estilo comunes, como \"Bold\" o \"Condensed\". En lugar de elegirlos mediante el nombre, hay que acceder a ellos a través de los mecanismos integrados de Typst (como los parámetros @text.weight[`weight`] y @text.stretch[`stretch`])."
"In Typst 0.15, the additional suffixes \"Variable\", \"Var\", and \"VF\" are trimmed to unify static and variable fonts into a single family. If you've previously used a font with any of these suffixes in its family name, you should now omit the suffix when specifying the @text.font[`font`]." = "En Typst 0.15, además se recortan los sufijos \"Variable\", \"Var\" y \"VF\" para unificar las fuentes estáticas y variables en una sola familia. Si antes usabas una fuente con alguno de estos sufijos en el nombre de su familia, ahora tendrías que omitir el sufijo al especificar la @text.font[`font`]."
"== #short-or-long[Language tags][Upcoming raw language tag changes] <language-tags>" = "== #short-or-long[Etiquetas de lenguaje][Próximos cambios en las etiquetas de lenguaje de raw] <language-tags>"
"In the next Typst version, we will make a change to how @raw:language-tag-changes[raw language tags are parsed]. Should this upcoming change have an effect on your document, the compiler will already warn you today and suggest how to adjust your document to future-proof it against the change." = "En la próxima versión de Typst, vamos a cambiar cómo se @raw:language-tag-changes[analizan las etiquetas de lenguaje de raw]. Si este cambio próximo afecta a tu documento, el compilador ya hoy te va a advertir y a sugerirte cómo ajustarlo para que no te afecte."
"== #short-or-long[Numbering fallback][Numbering fallback for the number zero] <numbering-fallback>" = "== #short-or-long[Alternativa de numeración][Alternativa de numeración para el número cero] <numbering-fallback>"
"Not all @numbering systems can express the number zero. In Typst 0.14 and below, those would silently fall back to Arabic numerals for `{0}`. This behavior is deprecated in Typst 0.15. Using zero with these systems will become a hard error in the future." = "No todos los sistemas de @numbering pueden expresar el número cero. En Typst 0.14 y anteriores, esos sistemas recurrían silenciosamente a numerales arábigos para `{0}`. Este comportamiento está obsoleto en Typst 0.15. Usar el cero con esos sistemas pasará a ser un error grave en el futuro."
"== #short-or-long[Validation][Tightened validation in some functions] <validation>" = "== #short-or-long[Validación][Validación más estricta en algunas funciones] <validation>"
"The @array.slice function, @str constructor, and @text.features parameter now perform stricter validation on their inputs. If you've previously passed invalid or nonsensical input, you will now receive an error." = "La función @array.slice, el constructor @str y el parámetro @text.features ahora validan sus entradas de forma más estricta. Si antes pasabas entradas inválidas o sin sentido, ahora vas a recibir un error."
"== #short-or-long[Citation styles][Renamed citation styles] <citation-styles>" = "== #short-or-long[Estilos de cita][Estilos de cita renombrados] <citation-styles>"
"Typst 0.15 @changelog:0.15.0:deprecations[renames] some citation styles to stay aligned with upstream CSL changes. If you are relying on any of these, the compiler will warn you and suggest the new name." = "Typst 0.15 @changelog:0.15.0:deprecations[renombra] algunos estilos de cita para mantenerse alineado con los cambios de CSL en upstream. Si dependés de alguno de ellos, el compilador te va a advertir y a sugerirte el nuevo nombre."
"== #short-or-long[Symbols][Renamed symbols] <citation-styles>" = "== #short-or-long[Símbolos][Símbolos renombrados] <citation-styles>"
"Typst 0.15 also #link(changelogs.codex + \"#deprecations-in-sym\")[renames] a few symbols in @sym. If you are using any of these, the compiler will warn you and suggest the new name." = "Typst 0.15 también #link(changelogs.codex + \"#deprecations-in-sym\")[renombra] algunos símbolos de @sym. Si usás alguno de ellos, el compilador te va a advertir y a sugerirte el nuevo nombre."

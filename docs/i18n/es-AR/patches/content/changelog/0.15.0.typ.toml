"- The scoped functions `cbor.decode`, `csv.decode`, `json.decode`, `toml.decode`, `xml.decode`, `yaml.decode`, and `image.decode`; directly pass @bytes to the top-level functions instead #pr(8252) #breaking" = "- Las funciones con alcance `cbor.decode`, `csv.decode`, `json.decode`, `toml.decode`, `xml.decode`, `yaml.decode` e `image.decode`; pasá directamente @bytes a las funciones de nivel superior en su lugar #pr(8252) #breaking"
"- Various previously deprecated symbols, see the #link(changelogs.codex + \"#removals-in-sym-breaking-change\")[removals section in the dedicated changelog] for a full listing #breaking" = "- Varios símbolos obsoletos desde antes, ver la #link(changelogs.codex + \"#removals-in-sym-breaking-change\")[sección de eliminaciones del registro de cambios específico] para la lista completa #breaking"
"= Development <development>" = "= Desarrollo <development>"
"- The `typst-kit` crate was completely reworked to make it easier to create a Typst `World` implementation #pr(7710) #pr(8026)" = "- Se rehízo por completo el crate `typst-kit` para facilitar la creación de una implementación de `World` de Typst #pr(7710) #pr(8026)"
"- Diagnostic hints can now have spans (though typically they will be _detached,_ which just means there isn't a span) #pr(7364)" = "- Las sugerencias de los diagnósticos ahora pueden tener spans (aunque normalmente estarán _desconectados,_ lo que significa que simplemente no hay span) #pr(7364)"
"- Increased minimum supported Rust version to 1.92 #pr(8236)" = "- Se aumentó la versión mínima admitida de Rust a 1.92 #pr(8236)"

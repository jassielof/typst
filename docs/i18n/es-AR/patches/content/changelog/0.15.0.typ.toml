"- Some citation styles that were renamed or superseded #pr(404, repo: \"typst/hayagriva\") #pr(424, repo: \"typst/hayagriva\") #pr(453, repo: \"typst/hayagriva\")" = "- Algunos estilos de cita que se renombraron o fueron reemplazados #pr(404, repo: \"typst/hayagriva\") #pr(424, repo: \"typst/hayagriva\") #pr(453, repo: \"typst/hayagriva\")"

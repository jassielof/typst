"= Command Line Interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added new `typst eval` subcommand to evaluate a Typst code expression from the CLI; this command supersedes `typst query` #pr(7362)" = "- Se agregó el nuevo subcomando `typst eval` para evaluar una expresión de código de Typst desde la CLI; este comando reemplaza a `typst query` #pr(7362)"
"- Tracebacks for diagnostics are now more compact and readable #pr(8000)" = "- Los seguimientos (tracebacks) de los diagnósticos ahora son más compactos y legibles #pr(8000)"
"- Added `--pretty` flag for producing human-readable output; output is otherwise minified by default (applies to HTML, SVG, and PDF, but not PNG) #pr(8371)" = "- Se agregó el indicador `--pretty` para producir una salida legible por personas; por defecto la salida se minifica (se aplica a HTML, SVG y PDF, pero no a PNG) #pr(8371)"
"- Fonts" = "- Fuentes"
"- The output of `typst fonts --variants` is now more readable and informative; in particular, it also displays the paths of font files and, for variable fonts, variation axes #pr(7490) #pr(8425)" = "- La salida de `typst fonts --variants` ahora es más legible e informativa; en particular, también muestra las rutas de los archivos de fuente y, para las fuentes variables, los ejes de variación #pr(7490) #pr(8425)"
"- The CLI now discovers fonts lazily, saving time on operations that do not need fonts (like HTML export without @html.frame[frames]) #pr(7380)" = "- La CLI ahora descubre las fuentes de forma diferida, lo que ahorra tiempo en operaciones que no las necesitan (como la exportación a HTML sin @html.frame[marcos]) #pr(7380)"
"- Adobe Creative Cloud fonts are now discovered as system fonts #pr(7716)" = "- Las fuentes de Adobe Creative Cloud ahora se descubren como fuentes del sistema #pr(7716)"
"- Dependency output" = "- Salida de dependencias"
"- When writing to stdout while using `--deps-format make` (which is incompatible and thus fails), no empty Make dependency file will be emitted anymore #pr(7246)" = "- Al escribir en la salida estándar con `--deps-format make` (que es incompatible y por lo tanto falla), ya no se emite un archivo de dependencias de Make vacío #pr(7246)"
"- The JSON dependency format now includes information about outputs in addition to inputs #pr(7209)" = "- El formato de dependencias JSON ahora incluye información sobre las salidas además de las entradas #pr(7209)"
"- Path handling fixes on Windows #pr(8508)" = "- Correcciones en el manejo de rutas en Windows #pr(8508)"
"- Reading from a path that contains a drive letter now results in an explicit error instead of the drive letter being silently ignored" = "- Leer desde una ruta que contiene una letra de unidad ahora produce un error explícito en lugar de ignorar silenciosamente la letra de unidad"
"- Attempting to read from a path that contains a reserved filename (like `COM1`) now results in an explicit error" = "- Intentar leer desde una ruta que contiene un nombre de archivo reservado (como `COM1`) ahora produce un error explícito"
"- Non-Unicode input paths are not supported anymore #pr(7688) #breaking" = "- Las rutas de entrada que no son Unicode ya no están admitidas #pr(7688) #breaking"
"- The experimental `--timings` argument now requires an explicit file name instead of defaulting to `record-{n}.json` #pr(8119) #breaking" = "- El argumento experimental `--timings` ahora requiere un nombre de archivo explícito en lugar de usar por defecto `record-{n}.json` #pr(8119) #breaking"
"- Added colors to `--help/-h` and `typst info` output #pr(7443) #pr(7500)" = "- Se agregaron colores a la salida de `--help/-h` y de `typst info` #pr(7443) #pr(7500)"
"- Fixed inconsistency in environment variable handling between `typst info` and `typst compile` #pr(8030)" = "- Se corrigió una inconsistencia en el manejo de variables de entorno entre `typst info` y `typst compile` #pr(8030)"
"- Fixed a bug with the injection of a live reload script when using `typst watch` with HTML export #pr(7770)" = "- Se corrigió un error en la inyección de un script de recarga en vivo al usar `typst watch` con exportación a HTML #pr(7770)"
"- Fixed a bug where local timezone information was taken into account even if a fixed date is set via `--creation-timestamp` or `SOURCE_DATE_EPOCH`, leading to irreproducible results #pr(7856)" = "- Se corrigió un error por el cual se tenía en cuenta la información de zona horaria local aunque se fijara una fecha mediante `--creation-timestamp` o `SOURCE_DATE_EPOCH`, lo que producía resultados no reproducibles #pr(7856)"

"- Function autocompletions in math mode now always prefer round parentheses over square brackets (which are not supported in math) #pr(8417)" = "- Los autocompletados de funciones en modo matemático ahora prefieren siempre los paréntesis redondos a los corchetes (que no se admiten en matemática) #pr(8417)"

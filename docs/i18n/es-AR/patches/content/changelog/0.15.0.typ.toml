# Line patches for docs/content/changelog/0.15.0.typ (see docs/src/i18n.rs).
"This section documents all changes to the Typst language and compiler between Typst 0.14.2 and 0.15.0. If you are migrating an existing document to Typst 0.15, make sure to check out the @changelog:0.15.0:migration-guide. It walks you through changes you may need to make to your existing documents to ensure compatibility with Typst 0.15." = "Esta sección documenta todos los cambios del lenguaje y del compilador de Typst entre Typst 0.14.2 y 0.15.0. Si estás migrando un documento existente a Typst 0.15, fijate en la @changelog:0.15.0:migration-guide. Ahí se repasan los cambios que quizás tengas que hacer en tus documentos para asegurar la compatibilidad con Typst 0.15."
"= Highlights <highlights>" = "= Novedades destacadas <highlights>"
"- Typst now supports @text.variations[variable fonts]" = "- Typst ahora admite @text.variations[fuentes variables]"
"- HTML export now supports equations out of the box via MathML" = "- La exportación a HTML ahora admite ecuaciones de forma nativa mediante MathML"
"- With the new, experimental @format.bundle[_bundle_] export target, a single Typst project can output multiple files (e.g. a multi-page website)" = "- Con el nuevo formato de exportación experimental @format.bundle[_bundle_], un único proyecto de Typst puede generar varios archivos (p. ej., un sitio web de varias páginas)"
"- A single document can now contain multiple @bibliography.target[bibliographies]" = "- Un mismo documento ahora puede contener varias @bibliography.target[bibliografías]"
"- Typst can now target multiple @pdf.standard[PDF standards] at once" = "- Typst ahora puede apuntar a varios @pdf.standard[estándares de PDF] a la vez"
"- The new @selector.within[`within`] selector simplifies many introspection use cases" = "- El nuevo selector @selector.within[`within`] simplifica muchos casos de uso de introspección"
"- The new @divider element represents a thematic break that templates can style" = "- El nuevo elemento @divider representa un corte temático al que las plantillas pueden darle estilo"
"- @color.spot[Spot colors] enable use of custom pigments in offset printing" = "- Los @color.spot[colores planos (spot)] permiten usar pigmentos personalizados en la impresión offset"
"- With the new file @path type, project-relative paths can be passed to packages" = "- Con el nuevo tipo @path para rutas de archivo, se pueden pasar rutas relativas al proyecto a los paquetes"
"- The new, more general `typst eval` CLI subcommand supersedes `typst query`" = "- El nuevo subcomando `typst eval` de la CLI, más general, reemplaza a `typst query`"
"- Layout @reference:context:compiler-iterations[convergence] issues now result in detailed diagnostics" = "- Los problemas de @reference:context:compiler-iterations[convergencia] del diseño ahora producen diagnósticos detallados"
"- Two long-standing list layout issues with marker alignment and centering were fixed" = "- Se corrigieron dos problemas históricos del diseño de listas relacionados con la alineación de marcadores y el centrado"
"- Paragraph handling in HTML export is improved, preventing unexpected paragraphs from appearing" = "- Se mejoró el manejo de párrafos en la exportación a HTML, lo que evita que aparezcan párrafos inesperados"
"- This documentation now has a #link(\"https://github.com/typst/typst/releases/download/v0.15.0/typst-documentation.pdf\")[print version]" = "- Esta documentación ahora tiene una #link(\"https://github.com/typst/typst/releases/download/v0.15.0/typst-documentation.pdf\")[versión para imprimir]"
"= Language <language>" = "= Lenguaje <language>"
"== Syntax <syntax>" = "== Sintaxis <syntax>"
"- @path[File paths] (e.g. in imports or @image function calls) may not contain backslashes anymore; instead forward slashes must be used #pr(7688) #breaking" = "- Las @path[rutas de archivo] (p. ej., en importaciones o en llamadas a la función @image) ya no pueden contener barras invertidas; en su lugar, hay que usar barras normales #pr(7688) #breaking"
"- Added hints for invalid characters in code mode #pr(7752)" = "- Se agregaron sugerencias para caracteres inválidos en modo código #pr(7752)"
"- Added hint when trying to use a unary operator directly in an embedded expression using a hash (e.g. `[#-30deg]`) #pr(8069)" = "- Se agregó una sugerencia cuando se intenta usar un operador unario directamente en una expresión embebida con numeral (p. ej., `[#-30deg]`) #pr(8069)"
"- Fixed potential stack overflow crashes by enforcing a maximum parsing depth #pr(7207)" = "- Se corrigieron posibles fallos por desbordamiento de pila al imponer una profundidad máxima de análisis sintáctico #pr(7207)"
"- Fixed incremental parsing of unclosed strings #pr(8067)" = "- Se corrigió el análisis incremental de cadenas de texto sin cerrar #pr(8067)"
"== Styling <styling>" = "== Estilos <styling>"
"- Text show rules now have tracebacks that include the matched text #pr(8088)" = "- Las reglas show de texto ahora tienen seguimientos (tracebacks) que incluyen el texto coincidente #pr(8088)"
"- Fixed a crash with text show rules that match on multi-character symbols #pr(8011)" = "- Se corrigió un fallo con reglas show de texto que coinciden con símbolos de varios caracteres #pr(8011)"
"== Scripting <scripting>" = "== Scripting <scripting>"
"- Extended hint when built-in definitions are shadowed to set and show rules #pr(7131)" = "- Se extendió a las reglas set y show la sugerencia que aparece cuando se tapan definiciones integradas #pr(7131)"
"- Added hint when trying to spread one or multiple dictionaries into an array #pr(7798)" = "- Se agregó una sugerencia cuando se intenta expandir uno o varios diccionarios dentro de un array #pr(7798)"
"- Improved diagnostics for invalid method calls #pr(7865)" = "- Se mejoraron los diagnósticos de las llamadas a métodos inválidas #pr(7865)"
"- Improved hint for unknown variables in math that are available in `std` #pr(7810)" = "- Se mejoró la sugerencia para variables desconocidas en matemática que están disponibles en `std` #pr(7810)"
"- Fixed a misleading error message when trying to assign to a temporary return value #pr(8212)" = "- Se corrigió un mensaje de error engañoso al intentar asignar a un valor de retorno temporal #pr(8212)"
"= Library <library>" = "= Biblioteca <library>"
"== Foundations <foundations>" = "== Fundamentos <foundations>"
"- Added file @path type that is now accepted in all places where paths were previously only represented as strings #pr(7555)" = "- Se agregó el tipo @path para rutas de archivo, que ahora se acepta en todos los lugares donde antes las rutas solo se representaban como cadenas de texto #pr(7555)"
"- A path constructed in one file can be used in another file, but will be resolved relative to its original file" = "- Una ruta construida en un archivo se puede usar en otro, pero se resolverá respecto de su archivo original"
"- Likewise, paths can be passed across package boundaries" = "- Del mismo modo, las rutas se pueden pasar entre límites de paquetes"
"- The initial path type is very minimal, but additional features like file existence checks or directory walking are planned" = "- El tipo de ruta inicial es mínimo, pero están planeadas funciones adicionales, como la comprobación de existencia de archivos o el recorrido de directorios"
"- Collections" = "- Colecciones"
"- Added `map` and `filter` functions on @dictionary.filter[dictionaries] and @arguments.filter[arguments] #pr(7284)" = "- Se agregaron las funciones `map` y `filter` en @dictionary.filter[diccionarios] y @arguments.filter[argumentos] #pr(7284)"
"- Named arguments on @arguments values are now accessible with field access syntax #pr(8407)" = "- Ahora se puede acceder a los argumentos con nombre de los valores @arguments con la sintaxis de acceso a campos #pr(8407)"
"- The `slice` functions on @str.slice[strings] and @array.slice[arrays] will now error if passing both an `end` and a `count` #pr(7238) #minor-breaking" = "- Las funciones `slice` de @str.slice[cadenas de texto] y @array.slice[arrays] ahora producen un error si se les pasan `end` y `count` a la vez #pr(7238) #minor-breaking"
"- Added @array.range.inclusive[`inclusive` parameter] to `range` function #pr(8345)" = "- Se agregó el @array.range.inclusive[parámetro `inclusive`] a la función `range` #pr(8345)"
"- Calculation" = "- Cálculo"
"- Added @calc.asinh[`asinh`], @calc.acosh[`acosh`], @calc.atanh[`atanh`], and @calc.erf[`erf`] functions to `calc` module #pr(6967) #pr(7655)" = "- Se agregaron las funciones @calc.asinh[`asinh`], @calc.acosh[`acosh`], @calc.atanh[`atanh`] y @calc.erf[`erf`] al módulo `calc` #pr(6967) #pr(7655)"
"- Added `int.min` and `int.max` constants for the minimum and maximum representable integer, respectively #pr(8445)" = "- Se agregaron las constantes `int.min` e `int.max` para el entero mínimo y máximo representable, respectivamente #pr(8445)"
"- Fixed behavior of @calc.quo[`quo`] for negative integers #pr(7392)" = "- Se corrigió el comportamiento de @calc.quo[`quo`] con enteros negativos #pr(7392)"
"- Fixed potential overflows in @calc.norm[`norm`], @calc.abs[`abs`], @calc.gcd[`gcd`], and @calc.lcm[`lcm`] #pr(8156) #pr(8352)" = "- Se corrigieron posibles desbordamientos en @calc.norm[`norm`], @calc.abs[`abs`], @calc.gcd[`gcd`] y @calc.lcm[`lcm`] #pr(8156) #pr(8352)"
"- Floating-point calculations are now consistently deterministic across platforms #pr(7712)" = "- Los cálculos de punto flotante ahora son deterministas de forma consistente en todas las plataformas #pr(7712)"
"- Date & time handling" = "- Fechas y horas"
"- The @datetime.today.offset[`offset` parameter] of `datetime.today` now accepts @duration[durations] as an alternative to integers, allowing for sub-hour precision offsets #pr(7691)" = "- El @datetime.today.offset[parámetro `offset`] de `datetime.today` ahora acepta @duration[duraciones] como alternativa a los enteros, lo que permite desfases con precisión inferior a la hora #pr(7691)"
"- Addition and subtraction of @datetime[datetimes] and @duration[durations] now retains precision instead of clamping to full days in some cases #pr(7843)" = "- La suma y la resta de @datetime[fechas y horas] y @duration[duraciones] ahora conservan la precisión en lugar de redondear a días completos en algunos casos #pr(7843)"
"- The @datetime constructor now emits more precise errors when components are missing #pr(7371)" = "- El constructor de @datetime ahora emite errores más precisos cuando faltan componentes #pr(7371)"
"- Conversions" = "- Conversiones"
"- Added @int.constructor.base[`base` parameter] to `int` constructor to configure in which base to parse a string #pr(7386)" = "- Se agregó el @int.constructor.base[parámetro `base`] al constructor de `int` para configurar en qué base se interpreta una cadena de texto #pr(7386)"
"- Fixed that the @str.constructor.base[`base` parameter] of the `str` constructor was accepted for non-integer values if its value was `{10}` #pr(7237) #minor-breaking" = "- Se corrigió que el @str.constructor.base[parámetro `base`] del constructor de `str` se aceptara para valores no enteros si su valor era `{10}` #pr(7237) #minor-breaking"
"- Added hint when trying to @str.constructor[construct a string] with base 1 #pr(7237)" = "- Se agregó una sugerencia al intentar @str.constructor[construir una cadena de texto] con base 1 #pr(7237)"
"- The @panic function now displays strings as-is instead of showing their @repr, making it more suitable for friendly, user-facing messages #pr(8211)" = "- La función @panic ahora muestra las cadenas de texto tal cual en lugar de mostrar su @repr, lo que la hace más adecuada para mensajes amigables dirigidos al usuario #pr(8211)"
"- Changed @repr of styles and @location[locations] to be more distinct #pr(7364)" = "- Se cambió @repr de los estilos y de las @location[ubicaciones] para que sean más distintivos #pr(7364)"
"== Model <model>" = "== Modelo <model>"
"- Added @divider element representing a thematic break that templates can style #pr(7982)" = "- Se agregó el elemento @divider, que representa un corte temático al que las plantillas pueden darle estilo #pr(7982)"
"- Bundle-related elements" = "- Elementos relacionados con bundle"
"- The @document element can now be constructed to produce individual documents in bundle export #pr(7964)" = "- Ahora se puede construir el elemento @document para producir documentos individuales en la exportación bundle #pr(7964)"
"- Added @document.path[`path`] and @document.format[`format`] parameters to `document` element #pr(7964)" = "- Se agregaron los parámetros @document.path[`path`] y @document.format[`format`] al elemento `document` #pr(7964)"
"- Added experimental @asset element #pr(7964)" = "- Se agregó el elemento experimental @asset #pr(7964)"
"- Bibliography management" = "- Gestión de bibliografías"
"- A single document can now contain multiple bibliographies #pr(8307)" = "- Un mismo documento ahora puede contener varias bibliografías #pr(8307)"
"- Added @bibliography.target[`target` parameter] to `bibliography` element to configure which citation is picked up by which bibliography #pr(8307)" = "- Se agregó el @bibliography.target[parámetro `target`] al elemento `bibliography` para configurar qué cita recoge cada bibliografía #pr(8307)"
"- Added @bibliography.group[`group` parameter] to `bibliography` element to configure how numbers are shared/reset across bibliographies #pr(8307)" = "- Se agregó el @bibliography.group[parámetro `group`] al elemento `bibliography` para configurar cómo se comparten o reinician los números entre bibliografías #pr(8307)"
"- Added support for numeric values for the `month` key in `.bib` files #pr(104, repo: \"typst/biblatex\")" = "- Se agregó compatibilidad con valores numéricos para la clave `month` en archivos `.bib` #pr(104, repo: \"typst/biblatex\")"
"- Added support for BibLaTeX name options in `.bib` files #pr(90, repo: \"typst/biblatex\")" = "- Se agregó compatibilidad con las opciones de nombres de BibLaTeX en archivos `.bib` #pr(90, repo: \"typst/biblatex\")"
"- Added support for propagating non-numeric `volume` fields in `.bib` files to bibliographies #pr(478, repo: \"typst/hayagriva\")" = "- Se agregó compatibilidad con la propagación a las bibliografías de los campos `volume` no numéricos de archivos `.bib` #pr(478, repo: \"typst/hayagriva\")"
"- Improved sorting in bibliographies to take into account language conventions #pr(314, repo: \"typst/hayagriva\")" = "- Se mejoró el ordenamiento en las bibliografías para tener en cuenta las convenciones del idioma #pr(314, repo: \"typst/hayagriva\")"
"- Improved interoperability with CSL styles; for a full listing of changes, review #link(changelogs.hayagriva)[the Hayagriva 0.10.0 changelog]" = "- Se mejoró la interoperabilidad con los estilos CSL; para ver la lista completa de cambios, consultá #link(changelogs.hayagriva)[el registro de cambios de Hayagriva 0.10.0]"
"- Added support for setting directors on videos without a parent in Hayagriva YAML files #pr(450, repo: \"typst/hayagriva\")" = "- Se agregó compatibilidad para establecer directores en videos sin elemento padre en archivos YAML de Hayagriva #pr(450, repo: \"typst/hayagriva\")"
"- Improved handling of `Anthos` entries in Hayagriva YAML files by treating them as `chapter`s in CSL #pr(427, repo: \"typst/hayagriva\")" = "- Se mejoró el manejo de las entradas `Anthos` en archivos YAML de Hayagriva al tratarlas como `chapter` en CSL #pr(427, repo: \"typst/hayagriva\")"
"- Footnotes" = "- Notas al pie"
"- The link of a @footnote is now within the superscript instead of around it, improving PDF tagging and HTML output #pr(7637)" = "- El enlace de una @footnote ahora está dentro del superíndice en lugar de rodearlo, lo que mejora el etiquetado del PDF y la salida HTML #pr(7637)"
"- The thickness of the default @footnote.entry.separator[footnote separator] is now specified in font-relative instead of absolute units #pr(7950)" = "- El grosor del @footnote.entry.separator[separador de notas al pie] predeterminado ahora se especifica en unidades relativas a la fuente en lugar de absolutas #pr(7950)"
"- Numbering" = "- Numeración"
"- Added @numbering support for Armenian numerals #pr(7529), Arabic Abjad numerals #pr(170, repo: \"typst/codex\"), and Tibetan numerals #pr(163, repo: \"typst/codex\")" = "- Se agregó a @numbering compatibilidad con numerales armenios #pr(7529), numerales abyad árabes #pr(170, repo: \"typst/codex\") y numerales tibetanos #pr(163, repo: \"typst/codex\")"
"- Greek @numbering now uses the modern Greek style #pr(7632)" = "- La @numbering griega ahora usa el estilo griego moderno #pr(7632)"
"- The @par.first-line-indent property will now _fold,_ meaning that partial dictionaries across different set rules or @par calls are combined #pr(7747)" = "- La propiedad @par.first-line-indent ahora se _combina,_ es decir, los diccionarios parciales de distintas reglas set o llamadas a @par se unifican #pr(7747)"
"- Added @list.marker-align property for defining how to align list markers #pr(7895)" = "- Se agregó la propiedad @list.marker-align para definir cómo alinear los marcadores de lista #pr(7895)"
"- When omitted, it will default to the new baseline alignment (vertically), combined with `end` alignment (horizontally)" = "- Si se omite, se usa por defecto la nueva alineación de línea base (en vertical), combinada con la alineación `end` (en horizontal)"
"== Text <text>" = "== Texto <text>"
"- Added support for variable fonts #pr(8425)" = "- Se agregó compatibilidad con fuentes variables #pr(8425)"
"- The well-known variation axes `ital`, `slnt`, `wght`, `wdth`, and `opsz` are automatically set based on text @text.weight[`weight`], @text.stretch[`stretch`], @text.style[`style`], and @text.size[`size`]" = "- Los ejes de variación conocidos `ital`, `slnt`, `wght`, `wdth` y `opsz` se establecen automáticamente según @text.weight[`weight`], @text.stretch[`stretch`], @text.style[`style`] y @text.size[`size`] del texto"
"- Custom variations can be configured via the new @text.variations[`variations` parameter] of the `text` function" = "- Se pueden configurar variaciones personalizadas mediante el nuevo @text.variations[parámetro `variations`] de la función `text`"
"- When using a variable font with Typst, the suffixes \"Variable\", \"Var\", and \"VF\" should be omitted as Typst trims them to unify static and variable fonts into a single family #pr(8444) #minor-breaking" = "- Al usar una fuente variable con Typst, hay que omitir los sufijos \"Variable\", \"Var\" y \"VF\", porque Typst los recorta para unificar las fuentes estáticas y variables en una sola familia #pr(8444) #minor-breaking"
"- Font features" = "- Características de fuente"
"- The @text.alternates parameter now accepts an integer in addition to a boolean to select stylistic alternates other than `{0}` and `{1}` #pr(7423)" = "- El parámetro @text.alternates ahora acepta un entero además de un booleano para elegir alternativas estilísticas distintas de `{0}` y `{1}` #pr(7423)"
"- Parsing of tag names in @text.features is now more strict #pr(7423) #minor-breaking" = "- El análisis de los nombres de etiqueta en @text.features ahora es más estricto #pr(7423) #minor-breaking"
"- Fixed that `{context text.font}` did not reflect the `covers` field #pr(7354)" = "- Se corrigió que `{context text.font}` no reflejara el campo `covers` #pr(7354)"
"- Fixed uneven @text.cjk-latin-spacing[CJK-Latin spacing] in justified paragraphs #pr(7606)" = "- Se corrigió el espaciado desparejo @text.cjk-latin-spacing[entre CJK y latín] en párrafos justificados #pr(7606)"
"- Fixed a bug where the @lorem function would not produce the exact number of requested words #pr(7877)" = "- Se corrigió un error por el cual la función @lorem no producía la cantidad exacta de palabras pedida #pr(7877)"
"- Improved translations for Swedish #pr(7166), Portuguese #pr(7088), Czech #pr(7318), Latvian #pr(7701), Slovak #pr(7734), Polish #pr(7734), Vietnamese #pr(7774), Finnish #pr(7988) #pr(7989), and Welsh #pr(7811)" = "- Se mejoraron las traducciones al sueco #pr(7166), portugués #pr(7088), checo #pr(7318), letón #pr(7701), eslovaco #pr(7734), polaco #pr(7734), vietnamita #pr(7774), finés #pr(7988) #pr(7989) y galés #pr(7811)"
"- Added font exception to avoid _SimSun-ExtB_ being incorrectly merged with _SimSun_ #pr(8042)" = "- Se agregó una excepción de fuente para evitar que _SimSun-ExtB_ se fusionara incorrectamente con _SimSun_ #pr(8042)"
"- Updated New Computer Modern fonts to version 8.1.0 #pr(7597) #pr(7663) #pr(8164) #pr(8330) #pr(8435)" = "- Se actualizaron las fuentes New Computer Modern a la versión 8.1.0 #pr(7597) #pr(7663) #pr(8164) #pr(8330) #pr(8435)"
"- This update changes the default look of @math.cal[calligraphic letterforms] in the math font; the previous style can be restored through `{show math.equation: set text(stylistic-set: 6)}`" = "- Esta actualización cambia el aspecto predeterminado de las @math.cal[formas caligráficas] en la fuente matemática; se puede restaurar el estilo anterior con `{show math.equation: set text(stylistic-set: 6)}`"
"- Updated Unicode components #pr(8406)" = "- Se actualizaron los componentes de Unicode #pr(8406)"
"- In particular, this fixed an issue with linebreaking of guillemets" = "- En particular, esto corrigió un problema con los saltos de línea de las comillas angulares"
"== Math <math>" = "== Matemática <math>"
"- Layout" = "- Diseño"
"- Improved layout of under/over elements like @math.underbrace[`underbrace`] #pr(7299)" = "- Se mejoró el diseño de los elementos superiores/inferiores como @math.underbrace[`underbrace`] #pr(7299)"
"- Slightly improved spacing around @math.op elements #pr(7429)" = "- Se mejoró levemente el espaciado alrededor de los elementos @math.op #pr(7429)"
"- In which situations _cramped_ styles (with tighter spacing) are applied is now fully consistent with TeX and MathML Core #pr(8082)" = "- Las situaciones en las que se aplican estilos _comprimidos_ (con espaciado más ajustado) ahora son totalmente coherentes con TeX y MathML Core #pr(8082)"
"- The @math.lr.size[`size` parameter] of the `lr` function now consistently applies to @math.mid[middle delimiters] in the same way it does to outer delimiters #pr(7435)" = "- El @math.lr.size[parámetro `size`] de la función `lr` ahora se aplica de forma consistente a los @math.mid[delimitadores intermedios], del mismo modo que a los delimitadores externos #pr(7435)"
"- The @math.lr.size[`size` parameter] of the `lr` function now resolves relatively to the height of just the inner content; it does not take the delimiters into account anymore #pr(7605) #minor-breaking" = "- El @math.lr.size[parámetro `size`] de la función `lr` ahora se resuelve de forma relativa a la altura del contenido interior solamente; ya no tiene en cuenta los delimitadores #pr(7605) #minor-breaking"
"- Glyph @math.stretch[stretching] is now always relative to the base glyph rather than a potentially already scaled version (e.g. due to display sizing) #pr(7435) #minor-breaking" = "- El @math.stretch[estiramiento] de glifos ahora es siempre relativo al glifo base y no a una versión ya escalada (p. ej., por el tamaño de display) #pr(7435) #minor-breaking"
"- Fixed left/right alignment not being applied correctly due to spacing next to alignment points #pr(7473) #pr(7435)" = "- Se corrigió que la alineación izquierda/derecha no se aplicara bien por el espaciado junto a los puntos de alineación #pr(7473) #pr(7435)"
"- The @math.binom[`binom`] element now uses different OpenType constants for layout; though this does not lead to visible changes with most fonts #pr(7685)" = "- El elemento @math.binom[`binom`] ahora usa otras constantes de OpenType para el diseño, aunque esto no produce cambios visibles con la mayoría de las fuentes #pr(7685)"
"- The default length and stroke width of @math.cancel lines is now specified in font-relative instead of absolute units #pr(7241)" = "- El largo y el grosor de trazo predeterminados de las líneas de @math.cancel ahora se especifican en unidades relativas a la fuente en lugar de absolutas #pr(7241)"
"- Fixed potential misalignment in @math.cases[`cases`] function #pr(7662)" = "- Se corrigió una posible desalineación en la función @math.cases[`cases`] #pr(7662)"
"- Text handling" = "- Manejo de texto"
"- Improved handling of multi-character symbols in math #pr(6929)" = "- Se mejoró el manejo de símbolos de varios caracteres en matemática #pr(6929)"
"- Fixed that some glyphs did not stretch correctly in script sizes #pr(8171)" = "- Se corrigió que algunos glifos no se estiraran bien en tamaños de subíndice #pr(8171)"
"- Fraction, root, and under/over lines now respect @text.stroke #pr(7540)" = "- Las líneas de fracciones, raíces y superiores/inferiores ahora respetan @text.stroke #pr(7540)"
"- Accents in math are now always rendered in front of their base if they overlap #pr(7733)" = "- Los acentos en matemática ahora siempre se dibujan delante de su base si se superponen #pr(7733)"
"- The @math.class[`class`] function now applies the class only to its direct body rather than recursively #pr(8328) #minor-breaking" = "- La función @math.class[`class`] ahora aplica la clase solo a su cuerpo directo y no de forma recursiva #pr(8328) #minor-breaking"
"- More delimiter symbols (e.g. `chevron.l`) are now callable to produce an @math.lr[`lr`] element #pr(7228) #minor-breaking" = "- Más símbolos de delimitadores (p. ej., `chevron.l`) ahora se pueden llamar para producir un elemento @math.lr[`lr`] #pr(7228) #minor-breaking"
"- Fixed various bugs with rendering of mathematical expressions that look like function calls but in reality aren't (e.g. `[$pi(1, 2)$]`, since `pi` is not a function) #pr(7865)" = "- Se corrigieron varios errores de renderizado de expresiones matemáticas que parecen llamadas a funciones pero en realidad no lo son (p. ej., `[$pi(1, 2)$]`, ya que `pi` no es una función) #pr(7865)"
"- Fixed a bug with ordering of primes and nested attachments #pr(7647)" = "- Se corrigió un error con el orden de las primas y los adjuntos anidados #pr(7647)"
"== Symbols <symbols>" = "== Símbolos <symbols>"
"- Added many new symbols and variants. View #link(changelogs.codex)[the `codex` 0.3.0 changelog] for a full listing." = "- Se agregaron muchos símbolos y variantes nuevos. Mirá #link(changelogs.codex)[el registro de cambios de `codex` 0.3.0] para ver la lista completa."
"== Layout <layout>" = "== Diseño <layout>"
"- Baseline information is now retained in many more parts of the layout engine #pr(8150) #breaking" = "- Ahora la información de línea base se conserva en muchas más partes del motor de diseño #pr(8150) #breaking"
"- In particular, text contained in a @box with an inset is now aligned with the text surrounding the `box`" = "- En particular, el texto contenido en un @box con margen interno ahora queda alineado con el texto que rodea al `box`"
"- This also fixes a bug where wrapping an inline equation in a `box` would shift its baseline" = "- Esto también corrige un error por el cual envolver una ecuación en línea en un `box` desplazaba su línea base"
"- Similarly, using a @block in an equation will keep the baseline intact" = "- Del mismo modo, usar un @block dentro de una ecuación mantiene intacta la línea base"
"- Last but not least, the marker/number and item of a @list or @enum are now properly baseline-aligned with the first line of the item even if the item is vertically larger than a normal line #pr(7895)" = "- Por último, pero no menos importante, el marcador/número y el contenido de un elemento de @list o @enum ahora quedan correctamente alineados en la línea base con la primera línea del elemento, incluso si este es verticalmente más grande que una línea normal #pr(7895)"
"- Centering something in a list now centers based on the full available width rather than based on the maximum width of other list content #pr(7895)" = "- Centrar algo dentro de una lista ahora centra según todo el ancho disponible y no según el ancho máximo del resto del contenido de la lista #pr(7895)"
"- Page layout" = "- Diseño de página"
"- Added @page.bleed[`bleed` parameter] to `page` element to set up bleed margins #pr(6357)" = "- Se agregó el @page.bleed[parámetro `bleed`] al elemento `page` para configurar márgenes de sangrado #pr(6357)"
"- Fixed the size of `{\"us-executive\"}` @page.paper[paper] #pr(7869)" = "- Se corrigió el tamaño del @page.paper[papel] `{\"us-executive\"}` #pr(7869)"
"- Added warning for `{show page}` rules as they are unsupported #pr(7445)" = "- Se agregó una advertencia para las reglas `{show page}`, ya que no están admitidas #pr(7445)"
"- Paragraph layout" = "- Diseño de párrafos"
"- Fixed a bug where justified text could accidentally protrude into the margin when it ends with certain kinds of characters (e.g. a zero-width space) #pr(8415)" = "- Se corrigió un error por el cual el texto justificado podía sobresalir accidentalmente hacia el margen cuando terminaba con ciertos tipos de caracteres (p. ej., un espacio de ancho cero) #pr(8415)"
"- Fixed a bug where @par.first-line-indent[first-line indent] was applied at the start of a column even if `{all: false}` is set #pr(7722)" = "- Se corrigió un error por el cual la @par.first-line-indent[sangría de primera línea] se aplicaba al comienzo de una columna aunque estuviera establecido `{all: false}` #pr(7722)"
"- Added support for spacing that is both @v.weak[weak] and @fraction[fractional] #pr(6833)" = "- Se agregó compatibilidad con espaciado que es a la vez @v.weak[débil] y @fraction[fraccional] #pr(6833)"
"== Visualize <visualize>" = "== Visualización <visualize>"
"- Added support for @color.spot[spot colors] (also called separation colors) #pr(7629)" = "- Se agregó compatibilidad con @color.spot[colores planos (spot)] (también llamados colores de separación) #pr(7629)"
"- Tilings" = "- Mosaicos"
"- Added @tiling.constructor.offset[`offset` parameter] for shifting the starting position of a tiling #pr(7506)" = "- Se agregó el @tiling.constructor.offset[parámetro `offset`] para desplazar la posición inicial de un mosaico #pr(7506)"
"- Fixed parent-relative placement for @stack and @polygon #pr(8324)" = "- Se corrigió la ubicación relativa al padre para @stack y @polygon #pr(8324)"
"- Gradients" = "- Degradés"
"- Added @color.map[`color.map.coolwarm`] for use with gradients #pr(7489)" = "- Se agregó @color.map[`color.map.coolwarm`] para usar con degradés #pr(7489)"
"- Fixed interpolation of gradient @gradient.stops[stops] in Oklab color space #pr(7326)" = "- Se corrigió la interpolación de las @gradient.stops[paradas] de los degradés en el espacio de color Oklab #pr(7326)"
"- Fixed gradient @gradient.angle[angle] handling for negative-size shapes #pr(7826)" = "- Se corrigió el manejo del @gradient.angle[ángulo] de los degradés en formas de tamaño negativo #pr(7826)"
"- Fixed gradient strokes for @line[lines] and @curve[curves] #pr(7863)" = "- Se corrigieron los trazos con degradé en @line[líneas] y @curve[curvas] #pr(7863)"
"- Fixed parent-relative placement for @stack and @polygon #pr(8324)" = "- Se corrigió la ubicación relativa al padre para @stack y @polygon #pr(8324)"
"- Fixed various bugs with rectangle strokes in combination with @rect.radius[radii] #pr(7357) #pr(8081)" = "- Se corrigieron varios errores con los trazos de rectángulos combinados con @rect.radius[radios] #pr(7357) #pr(8081)"
"- Fixed a potential deadlock with font fallback in SVGs #pr(7766)" = "- Se corrigió un posible bloqueo (deadlock) con la fuente de reserva en SVG #pr(7766)"
"- Various improvements to SVG image handling (see the #link(changelogs.resvg)[resvg 0.46 and 0.47 changelogs]); in particular:" = "- Varias mejoras en el manejo de imágenes SVG (ver los #link(changelogs.resvg)[registros de cambios de resvg 0.46 y 0.47]); en particular:"
"- Added support for SVGs without top-level `xmlns` attribute" = "- Se agregó compatibilidad con SVG sin el atributo `xmlns` de nivel superior"
"- Added support for variable fonts in SVG using the `font-variation-settings` CSS property" = "- Se agregó compatibilidad con fuentes variables en SVG mediante la propiedad CSS `font-variation-settings`"
"- Various improvements to PDF image handling (see the #link(changelogs.hayro)[commits between `d0b540f` and `3483462` on hayro]); in particular:" = "- Varias mejoras en el manejo de imágenes PDF (ver los #link(changelogs.hayro)[commits entre `d0b540f` y `3483462` en hayro]); en particular:"
"- Added support for JPEG2000 (`JPXDecode`) and JBIG2 (`JBIG2Decode`) images" = "- Se agregó compatibilidad con imágenes JPEG2000 (`JPXDecode`) y JBIG2 (`JBIG2Decode`)"
"- Improved parsing robustness for non-compliant files" = "- Se mejoró la robustez del análisis de archivos que no cumplen con el estándar"
"- Added support for blend modes" = "- Se agregó compatibilidad con modos de mezcla"
"== Introspection <introspection>" = "== Introspección <introspection>"
"- Layout convergence issues now result in detailed diagnostics that help pin down the cause #pr(7364)" = "- Los problemas de convergencia del diseño ahora producen diagnósticos detallados que ayudan a identificar la causa #pr(7364)"
"- Added @selector.within[`within` selector] that matches elements that are contained within any elements matching an ancestor selector #pr(8250) #pr(7964) #pr(8114)" = "- Se agregó el @selector.within[selector `within`], que coincide con los elementos contenidos dentro de cualquier elemento que coincida con un selector ancestro #pr(8250) #pr(7964) #pr(8114)"
"- Added @counter.display.at[`at`] parameter to `counter.display` function #pr(6781)" = "- Se agregó el parámetro @counter.display.at[`at`] a la función `counter.display` #pr(6781)"
"- Improved how @counter.display auto-selects the numbering to use #pr(7446)" = "- Se mejoró cómo @counter.display elige automáticamente la numeración que usa #pr(7446)"
"== Data Loading <data-loading>" = "== Carga de datos <data-loading>"
"- Added support for namespaces to @xml function #pr(7899)" = "- Se agregó compatibilidad con espacios de nombres en la función @xml #pr(7899)"
"- Added hint when trying to read from a path that looks like a URL #pr(7682)" = "- Se agregó una sugerencia al intentar leer desde una ruta que parece una URL #pr(7682)"
"- Diagnostics for binary file loading failures now include file paths #pr(8259)" = "- Los diagnósticos de errores al cargar archivos binarios ahora incluyen las rutas de los archivos #pr(8259)"
"- The @json function now emits a friendly error when the loaded JSON has a leading UTF‑8 BOM #pr(7488)" = "- La función @json ahora emite un error amigable cuando el JSON cargado empieza con una marca BOM de UTF‑8 #pr(7488)"
"= Export <export>" = "= Exportación <export>"
"== Bundle <bundle-export>" = "== Bundle <bundle-export>"
"- Added new, experimental @format.bundle[_bundle_ export target] #pr(7964)" = "- Se agregó el nuevo @format.bundle[formato de exportación _bundle_], experimental #pr(7964)"
"- With bundle export, you can emit multiple output files from a single Typst project" = "- Con la exportación bundle, podés generar varios archivos de salida a partir de un único proyecto de Typst"
"- Bundles can contain any combination of @html[HTML pages], @pdf[PDFs], @format.png[PNGs], @format.svg[SVGs], and arbitrary @asset[assets]" = "- Los bundles pueden contener cualquier combinación de @html[páginas HTML], @pdf[PDF], @format.png[PNG], @format.svg[SVG] y @asset[recursos (assets)] arbitrarios"
"== HTML <html-export>" = "== HTML <html-export>"
"- Mathematical equations are now automatically exported to MathML _(thanks to #gh(\"mkorje\"))_ #pr(7436)" = "- Las ecuaciones matemáticas ahora se exportan automáticamente a MathML _(gracias a #gh(\"mkorje\"))_ #pr(7436)"
"- MathML defines how to render an equation, but also preserves its semantics" = "- MathML define cómo renderizar una ecuación, pero además preserva su semántica"
"- If you've previously relied on show rules that use @html.frame to render equations to SVG, try MathML output. Switching to it will improve the accessibility of your document (though rendering will be somewhat less consistent across browsers)." = "- Si antes usabas reglas show con @html.frame para renderizar ecuaciones como SVG, probá la salida MathML. Cambiar a esta mejora la accesibilidad de tu documento (aunque el renderizado será algo menos consistente entre navegadores)."
"- The @box and @block elements' purpose is now aligned with paged export #pr(8181) #breaking" = "- El propósito de los elementos @box y @block ahora está alineado con la exportación paginada #pr(8181) #breaking"
"- @box is used to bring block-level content inline" = "- @box se usa para llevar contenido de bloque a la línea"
"- @block ensures inline-level content becomes block-level" = "- @block asegura que el contenido en línea pase a ser de bloque"
"- Depending on the contained content, this may be achieved by setting the CSS `display` property or by wrapping in an additional `<span>` or `<div>`." = "- Según el contenido, esto puede lograrse estableciendo la propiedad CSS `display` o envolviéndolo en un `<span>` o `<div>` adicional."
"- The rules of how paragraphs are grouped in HTML have been adjusted to fix cases where paragraphs would appear unexpectedly #pr(8181) #pr(7505) #breaking" = "- Se ajustaron las reglas de cómo se agrupan los párrafos en HTML para corregir casos en que aparecían párrafos de forma inesperada #pr(8181) #pr(7505) #breaking"
"- The list of HTML elements that can be grouped into paragraphs was tweaked (it now includes all _phrasing content_ with the exception of elements that default to `display: none`)" = "- Se retocó la lista de elementos HTML que se pueden agrupar en párrafos (ahora incluye todo el _contenido de fraseo_ (phrasing content), con excepción de los elementos que por defecto tienen `display: none`)"
"- This default can be controlled by wrapping an element in a @box or @block as appropriate" = "- Este comportamiento por defecto se puede controlar envolviendo un elemento en un @box o @block, según corresponda"
"- HTML elements that cannot be part of paragraphs (like a `<div>`) do not immediately force adjacent inline-level Typst content to be wrapped in a paragraph; rather, they are considered _neutral_ for paragraph grouping" = "- Los elementos HTML que no pueden formar parte de párrafos (como un `<div>`) ya no fuerzan de inmediato que el contenido de Typst en línea contiguo se envuelva en un párrafo; en cambio, se consideran _neutros_ para el agrupamiento de párrafos"
"- Paragraph creation is only forced by _block-level Typst elements_ (as opposed to HTML elements). Built-in block-level elements like headings or images wrap the HTML elements they create in @block elements to force adjacent inline content into paragraphs. Package authors should do the same to ensure paragraph creation is consistent between HTML and paged export." = "- La creación de párrafos solo la fuerzan los _elementos de bloque de Typst_ (a diferencia de los elementos HTML). Los elementos de bloque integrados, como títulos o imágenes, envuelven los elementos HTML que crean en elementos @block para forzar que el contenido en línea contiguo pase a párrafos. Los autores de paquetes deberían hacer lo mismo para que la creación de párrafos sea consistente entre la exportación HTML y la paginada."
"- The @target function can now be used without the `html` feature flag (the rest of HTML export remains feature-flagged) #pr(8248)" = "- La función @target ahora se puede usar sin el indicador de característica `html` (el resto de la exportación a HTML sigue detrás de ese indicador) #pr(8248)"
"- DOM structure and built-in show rules" = "- Estructura del DOM y reglas show integradas"
"- The root `<html>` element now receives a `lang` attribute respecting what was configured for @text.lang #pr(7208)" = "- El elemento raíz `<html>` ahora recibe un atributo `lang` que respeta lo configurado en @text.lang #pr(7208)"
"- The Typst @image element now always emits `width` and `height` attributes on the generated HTML `<img>` element #pr(8118)" = "- El elemento @image de Typst ahora siempre emite los atributos `width` y `height` en el elemento HTML `<img>` generado #pr(8118)"
"- Code in `<pre>` tags will now prefer raw newlines over `<br>` elements to encode line breaks #pr(7675)" = "- El código en etiquetas `<pre>` ahora prefiere saltos de línea literales en lugar de elementos `<br>` para codificar los saltos de línea #pr(7675)"
"- Fixed generated HTML for @quote.attribution[quote attributions] #pr(8181)" = "- Se corrigió el HTML generado para las @quote.attribution[atribuciones de citas] #pr(8181)"
"- Fixed table cell show rules not working in HTML export #pr(7821)" = "- Se corrigió que las reglas show de celdas de tabla no funcionaran en la exportación a HTML #pr(7821)"
"- Serialization" = "- Serialización"
"- HTML is now minified by default; use the `--pretty` CLI flag or the checkbox in the web app to pretty-print it #pr(8371)" = "- El HTML ahora se minifica por defecto; usá el indicador `--pretty` de la CLI o la casilla de la app web para formatearlo de forma legible #pr(8371)"
"- HTML elements" = "- Elementos HTML"
"- The @html.elem.attrs[`attrs` parameter] on `html.elem` will now _fold,_ meaning that partial attributes across different set rules or `html.elem` calls are combined #pr(8182)" = "- El @html.elem.attrs[parámetro `attrs`] de `html.elem` ahora se _combina,_ es decir, los atributos parciales de distintas reglas set o llamadas a `html.elem` se unifican #pr(8182)"
"- @html.script and @html.style only accept a string and not arbitrary content anymore #pr(7784) #breaking" = "- @html.script y @html.style ahora solo aceptan una cadena de texto y no contenido arbitrario #pr(7784) #breaking"
"- Whitespace handling" = "- Manejo de espacios en blanco"
"- HTML `<br>` elements now collapse adjacent Typst spaces #pr(8166)" = "- Los elementos HTML `<br>` ahora colapsan los espacios adyacentes de Typst #pr(8166)"
"- Fixed spans being emitted to protect whitespace from collapsing unnecessarily in some cases #pr(8166)" = "- Se corrigió que se emitieran spans para proteger espacios en blanco del colapso sin necesidad en algunos casos #pr(8166)"
"== PDF <pdf-export>" = "== PDF <pdf-export>"
"- Typst can now target multiple (compatible) PDF standards at once, e.g. PDF/UA-1 and PDF/A-2a #pr(8294)" = "- Typst ahora puede apuntar a varios estándares de PDF (compatibles entre sí) a la vez, p. ej., PDF/UA-1 y PDF/A-2a #pr(8294)"
"- PDFs are now a bit more space-optimized at the cost of being harder to inspect with a text editor; use the `--pretty` CLI flag or the checkbox in the web app to pretty-print them #pr(8294) #pr(8371) #pr(8430)" = "- Los PDF ahora están algo más optimizados en espacio, a costa de ser más difíciles de inspeccionar con un editor de texto; usá el indicador `--pretty` de la CLI o la casilla de la app web para formatearlos de forma legible #pr(8294) #pr(8371) #pr(8430)"
"- Labelled headings now result in named destinations even if they are not referenced #pr(7964)" = "- Los títulos con etiqueta ahora generan destinos con nombre aunque no se los referencie #pr(7964)"
"- Graphics" = "- Gráficos"
"- Added support for more compositing features of COLRv1 fonts #pr(358, repo: \"LaurenzV/krilla\")" = "- Se agregó compatibilidad con más funciones de composición de las fuentes COLRv1 #pr(358, repo: \"LaurenzV/krilla\")"
"- Fixed rendering of @gradient[gradients] in LinearRGB, CMYK, and Luma color spaces #pr(8149)" = "- Se corrigió el renderizado de @gradient[degradés] en los espacios de color LinearRGB, CMYK y Luma #pr(8149)"
"- Fixed excessive sampling of linear gradients #pr(7818)" = "- Se corrigió el muestreo excesivo de los degradés lineales #pr(7818)"
"- Tagging" = "- Etiquetado"
"- Added support for more specific artifact kinds in @pdf.artifact; these are now internally used when appropriate #pr(8416)" = "- Se agregó compatibilidad con tipos de artefacto más específicos en @pdf.artifact; ahora se usan internamente cuando corresponde #pr(8416)"
"- Fixed \"invalid document structure\" errors with complex @list.marker[list markers] #pr(7789)" = "- Se corrigieron errores de \"estructura de documento inválida\" con @list.marker[marcadores de lista] complejos #pr(7789)"
"- Fixed wrong PDF tagging order for inline content outside of paragraphs #pr(7861)" = "- Se corrigió el orden incorrecto del etiquetado de PDF para contenido en línea fuera de párrafos #pr(7861)"
"- Fixed bounding box computations for stroked shapes in tagged PDFs #pr(8322)" = "- Se corrigió el cálculo de cuadros delimitadores de formas con trazo en PDF etiquetados #pr(8322)"
"- Standards compliance" = "- Cumplimiento de estándares"
"- Fixed potentially incompliant PDF files by emitting an error when PDF/UA-1 is requested but complying with PDF/UA-1 would require newer features than available in the current PDF version #pr(278, repo: \"LaurenzV/krilla\")" = "- Se corrigieron archivos PDF potencialmente no conformes: ahora se emite un error cuando se pide PDF/UA-1 pero cumplir con PDF/UA-1 requeriría funciones más nuevas que las disponibles en la versión de PDF actual #pr(278, repo: \"LaurenzV/krilla\")"
"- Fixed potentially incompliant PDF 1.4 files by emitting errors when implementation limits are exceeded #pr(348, repo: \"LaurenzV/krilla\")" = "- Se corrigieron archivos PDF 1.4 potencialmente no conformes: ahora se emiten errores cuando se superan los límites de implementación #pr(348, repo: \"LaurenzV/krilla\")"
"== SVG <svg-export>" = "== SVG <svg-export>"
"- SVGs are now minified by default; use the `--pretty` CLI flag or the checkbox in the web app to pretty-print them #pr(8371)" = "- Los SVG ahora se minifican por defecto; usá el indicador `--pretty` de la CLI o la casilla de la app web para formatearlos de forma legible #pr(8371)"
"- Somewhat reduced the size of generated SVGs #pr(7476) #pr(7680) #pr(7857)" = "- Se redujo algo el tamaño de los SVG generados #pr(7476) #pr(7680) #pr(7857)"
"- SVG elements do not have the classes `typst-frame`, `typst-doc`, `typst-group`, `typst-shape`, and `typst-text` anymore #pr(7680) #minor-breaking" = "- Los elementos SVG ya no tienen las clases `typst-frame`, `typst-doc`, `typst-group`, `typst-shape` ni `typst-text` #pr(7680) #minor-breaking"
"- Graphics" = "- Gráficos"
"- Fixed a bug where @tiling[tilings] could be incorrectly reused in multiple places #pr(7837)" = "- Se corrigió un error por el cual los @tiling[mosaicos] podían reutilizarse incorrectamente en varios lugares #pr(7837)"
"- Fixed rendering of @gradient[gradients] in LinearRGB, CMYK, and Luma color spaces #pr(8149)" = "- Se corrigió el renderizado de @gradient[degradés] en los espacios de color LinearRGB, CMYK y Luma #pr(8149)"
"- Fixed handling of @gradient.conic.angle[conic gradient angles] #pr(7952)" = "- Se corrigió el manejo de los @gradient.conic.angle[ángulos de los degradés cónicos] #pr(7952)"
"- Fixed excessive sampling of linear gradients #pr(7818)" = "- Se corrigió el muestreo excesivo de los degradés lineales #pr(7818)"
"- Fixed positioning and sizing of color bitmap glyphs #pr(7679) #pr(8440)" = "- Se corrigieron la posición y el tamaño de los glifos de mapa de bits en color #pr(7679) #pr(8440)"
"- Fixed sources of non-determinism in SVG export #pr(7680)" = "- Se corrigieron fuentes de no determinismo en la exportación a SVG #pr(7680)"
"== PNG <png-export>" = "== PNG <png-export>"
"- Fixed handling of @gradient.conic.angle[conic gradient angles] #pr(7952)" = "- Se corrigió el manejo de los @gradient.conic.angle[ángulos de los degradés cónicos] #pr(7952)"
"- Fixed positioning and sizing of color bitmap glyphs #pr(8440)" = "- Se corrigieron la posición y el tamaño de los glifos de mapa de bits en color #pr(8440)"

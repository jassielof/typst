# Line patches for docs/content/changelog/0.5.0.typ (see docs/src/i18n.rs).
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Added @raw syntax highlighting for many more languages" = "- Se agregó el resaltado de sintaxis de @raw para muchos más lenguajes"
"- Added support for Korean @numbering[numbering]" = "- Se agregó compatibilidad con la @numbering[numeración] coreana"
"- Added basic i18n for a few more languages (NL, SV, DA)" = "- Se agregó internacionalización básica para algunos idiomas más (NL, SV, DA)"
"- Improved line breaking for East Asian languages" = "- Se mejoró el salto de línea para los idiomas de Asia oriental"
"- Expanded functionality of outline @outline.indent[`indent`] property" = "- Se amplió la funcionalidad de la propiedad @outline.indent[`indent`] del índice"
"- Fixed footnotes in columns" = "- Se corrigieron las notas al pie en columnas"
"- Fixed page breaking bugs with @footnote[footnotes]" = "- Se corrigieron errores de saltos de página con @footnote[notas al pie]"
"- Fixed bug with handling of footnotes in lists, tables, and figures" = "- Se corrigió un error en el manejo de notas al pie en listas, tablas y figuras"
"- Fixed a bug with CJK punctuation adjustment" = "- Se corrigió un error en el ajuste de puntuación CJK"
"- Fixed a crash with rounded rectangles" = "- Se corrigió un fallo con rectángulos redondeados"
"- Fixed alignment of @line elements" = "- Se corrigió la alineación de los elementos @line"
"= Math <math>" = "= Matemática <math>"
"- *Breaking change:* The syntax rules for mathematical @math.attach[attachments] were improved: `[$f^abs(3)$]` now parses as `[$f^(abs(3))$]` instead of `[$(f^abs)(3)$]`. To disambiguate, add a space: `[$f^zeta (3)$]`." = "- *Cambio incompatible:* Se mejoraron las reglas de sintaxis de los @math.attach[adjuntos] matemáticos: `[$f^abs(3)$]` ahora se analiza como `[$f^(abs(3))$]` en lugar de `[$(f^abs)(3)$]`. Para desambiguar, agregá un espacio: `[$f^zeta (3)$]`."
"- Added @math:sizes[forced size] commands for math (e.g., @math.display[`display`])" = "- Se agregaron comandos de @math:sizes[tamaño forzado] para matemática (p. ej., @math.display[`display`])"
"- Added @math.equation.supplement[`supplement`] parameter to @math.equation[`equation`], used by @ref[references]" = "- Se agregó el parámetro @math.equation.supplement[`supplement`] a @math.equation[`equation`], que usan las @ref[referencias]"
"- New @sym[symbols]: `bullet`, `xor`, `slash.big`, `sigma.alt`, `tack.r.not`, `tack.r.short`, `tack.r.double.not`" = "- Nuevos @sym[símbolos]: `bullet`, `xor`, `slash.big`, `sigma.alt`, `tack.r.not`, `tack.r.short`, `tack.r.double.not`"
"- Fixed a bug with symbols in matrices" = "- Se corrigió un error con símbolos en matrices"
"- Fixed a crash in the @math.attach[`attach`] function" = "- Se corrigió un fallo en la función @math.attach[`attach`]"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Added new @datetime type and @datetime.today to retrieve the current date" = "- Se agregaron el nuevo tipo @datetime y @datetime.today para obtener la fecha actual"
"- Added @str.from-unicode and @str.to-unicode functions" = "- Se agregaron las funciones @str.from-unicode y @str.to-unicode"
"- Added @content.fields[`fields`] method on content" = "- Se agregó el método @content.fields[`fields`] sobre contenido"
"- Added `base` parameter to @str function" = "- Se agregó el parámetro `base` a la función @str"
"- Added @calc.exp and @calc.ln" = "- Se agregaron @calc.exp y @calc.ln"
"- Improved accuracy of @calc.pow and @calc.log for specific bases" = "- Se mejoró la precisión de @calc.pow y @calc.log para bases específicas"
"- Fixed @dictionary.remove[removal] order for dictionary" = "- Se corrigió el orden de @dictionary.remove[eliminación] en diccionarios"
"- Fixed `.at(default: ..)` for @str.at[strings] and @content.at[content]" = "- Se corrigió `.at(default: ..)` para @str.at[cadenas de texto] y @content.at[contenido]"
"- Fixed field access on styled elements" = "- Se corrigió el acceso a campos en elementos con estilos"
"- Removed deprecated `calc.mod` function" = "- Se eliminó la función obsoleta `calc.mod`"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added PNG export via `typst compile source.typ output-{n}.png`. The output path must contain `[{n}]` if the document has multiple pages." = "- Se agregó la exportación a PNG mediante `typst compile source.typ output-{n}.png`. La ruta de salida debe contener `[{n}]` si el documento tiene varias páginas."
"- Added `--diagnostic-format=short` for Unix-style short diagnostics" = "- Se agregó `--diagnostic-format=short` para diagnósticos cortos al estilo Unix"
"- Doesn't emit color codes anymore if stderr isn't a TTY" = "- Ya no emite códigos de color si stderr no es una TTY"
"- Now sets the correct exit when invoked with a nonexistent file" = "- Ahora establece el código de salida correcto cuando se invoca con un archivo inexistente"
"- Now ignores UTF-8 BOM in Typst files" = "- Ahora ignora el BOM de UTF-8 en los archivos de Typst"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Improved errors for mismatched delimiters" = "- Se mejoraron los errores por delimitadores desparejos"
"- Improved error message for failed length comparisons" = "- Se mejoró el mensaje de error para comparaciones de longitudes fallidas"
"- Fixed a bug with images not showing up in Apple Preview" = "- Se corrigió un error por el cual las imágenes no se mostraban en Vista Previa de Apple"
"- Fixed multiple bugs with the PDF outline" = "- Se corrigieron varios errores del índice (outline) del PDF"
"- Fixed citations and other searchable elements in @hide" = "- Se corrigieron las citas y otros elementos buscables en @hide"
"- Fixed bugs with @ref.supplement[reference supplements]" = "- Se corrigieron errores con los @ref.supplement[suplementos de referencias]"
"- Fixed Nix flake" = "- Se corrigió el flake de Nix"

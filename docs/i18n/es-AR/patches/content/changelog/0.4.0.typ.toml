# Line patches for docs/content/changelog/0.4.0.typ (see docs/src/i18n.rs).
"= Footnotes <footnotes>" = "= Notas al pie <footnotes>"
"- Implemented support for footnotes" = "- Se implementó la compatibilidad con notas al pie"
"- The @footnote function inserts a footnote" = "- La función @footnote inserta una nota al pie"
"- The @footnote.entry function can be used to customize the footnote listing" = "- La función @footnote.entry se puede usar para personalizar el listado de notas al pie"
"- The `{\"chicago-notes\"}` @cite.style[citation style] is now available" = "- Ahora está disponible el @cite.style[estilo de cita] `{\"chicago-notes\"}`"
"= Documentation <documentation>" = "= Documentación <documentation>"
"- Added a @guides:for-latex-users[Guide for LaTeX Users]" = "- Se agregó una @guides:for-latex-users[Guía para usuarios de LaTeX]"
"- Now shows default values for optional arguments" = "- Ahora se muestran los valores predeterminados de los argumentos opcionales"
"- Added richer outlines in \"On this Page\"" = "- Se agregaron índices más completos en \"On this Page\""
"- Added initial support for search keywords: \"Table of Contents\" will now find the @outline[outline] function. Suggestions for more keywords are welcome!" = "- Se agregó compatibilidad inicial con palabras clave de búsqueda: \"Table of Contents\" ahora encuentra la función @outline[outline]. ¡Se aceptan sugerencias de más palabras clave!"
"- Fixed issue with search result ranking" = "- Se corrigió un problema con el orden de los resultados de búsqueda"
"- Fixed many more small issues" = "- Se corrigieron muchos otros problemas menores"
"= Math <math>" = "= Matemática <math>"
"- *Breaking change*: Alignment points (`&`) in equations now alternate between left and right alignment" = "- *Cambio incompatible*: Los puntos de alineación (`&`) en las ecuaciones ahora alternan entre alineación izquierda y derecha"
"- Added support for writing roots with Unicode: For example, `[$root(x+y)$]` can now also be written as `[$√(x+y)$]`" = "- Se agregó compatibilidad para escribir raíces con Unicode: por ejemplo, `[$root(x+y)$]` ahora también se puede escribir `[$√(x+y)$]`"
"- Fixed uneven vertical @math.attach[`attachment`] alignment" = "- Se corrigió la alineación vertical despareja de los @math.attach[`attachment`]"
"- Fixed spacing on decorated elements (e.g., spacing around a @math.cancel[canceled] operator)" = "- Se corrigió el espaciado de los elementos decorados (p. ej., el espaciado alrededor de un operador @math.cancel[cancelado])"
"- Fixed styling for stretchable symbols" = "- Se corrigió el estilo de los símbolos estirables"
"- Added `tack.r.double`, `tack.l.double`, `dotless.i` and `dotless.j` @sym[symbols]" = "- Se agregaron los @sym[símbolos] `tack.r.double`, `tack.l.double`, `dotless.i` y `dotless.j`"
"- Fixed show rules on symbols (e.g. `{show sym.tack: set text(blue)}`)" = "- Se corrigieron las reglas show sobre símbolos (p. ej., `{show sym.tack: set text(blue)}`)"
"- Fixed missing rename from `ast.op` to `ast` that should have been in the previous release" = "- Se corrigió el cambio de nombre faltante de `ast.op` a `ast`, que debería haber estado en la versión anterior"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Added function scopes: A function can now hold related definitions in its own scope, similar to a module. The new @assert.eq function, for instance, is part of the @assert function's scope. Note that function scopes are currently only available for built-in functions." = "- Se agregaron los alcances de funciones: ahora una función puede contener definiciones relacionadas en su propio alcance, de forma similar a un módulo. La nueva función @assert.eq, por ejemplo, forma parte del alcance de la función @assert. Tené en cuenta que, por ahora, los alcances de funciones solo están disponibles para funciones integradas."
"- Added @assert.eq and @assert.ne functions for simpler equality and inequality assertions with more helpful error messages" = "- Se agregaron las funciones @assert.eq y @assert.ne para aserciones de igualdad y desigualdad más simples y con mensajes de error más útiles"
"- Exposed @list.item[list], @enum.item[enum], and @terms.item[term list] items in their respective functions' scope" = "- Se expusieron los elementos de @list.item[lista], @enum.item[enumeración] y @terms.item[lista de términos] en el alcance de sus respectivas funciones"
"- The `at` methods on @str.at[strings], @array.at[arrays], @dictionary.at[dictionaries], and @content.at[content] now support specifying a default value" = "- Los métodos `at` de @str.at[cadenas de texto], @array.at[arrays], @dictionary.at[diccionarios] y @content.at[contenido] ahora admiten especificar un valor predeterminado"
"- Added support for passing a function to @str.replace[`replace`] that is called with each match." = "- Se agregó compatibilidad para pasar a @str.replace[`replace`] una función que se llama con cada coincidencia."
"- Fixed @str.replace[replacement] strings: They are now inserted completely verbatim instead of supporting the previous (unintended) magic dollar syntax for capture groups" = "- Se corrigieron las cadenas de @str.replace[reemplazo]: ahora se insertan de forma completamente literal en lugar de admitir la anterior (y no intencional) sintaxis mágica con signo de dólar para los grupos de captura"
"- Fixed bug with trailing placeholders in destructuring patterns" = "- Se corrigió un error con marcadores de posición finales en patrones de desestructuración"
"- Fixed bug with underscore in parameter destructuring" = "- Se corrigió un error con el guion bajo en la desestructuración de parámetros"
"- Fixed crash with nested patterns and when hovering over an invalid pattern" = "- Se corrigió un fallo con patrones anidados y al pasar el mouse sobre un patrón inválido"
"- Better error messages when casting to an @int[integer] or @float[float] fails" = "- Mejores mensajes de error cuando falla la conversión a @int[entero] o @float[flotante]"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Implemented sophisticated CJK punctuation adjustment" = "- Se implementó un ajuste sofisticado de la puntuación CJK"
"- Disabled @text.overhang[overhang] for CJK punctuation" = "- Se desactivó el @text.overhang[sobresaliente] para la puntuación CJK"
"- Added basic translations for Traditional Chinese" = "- Se agregaron traducciones básicas para chino tradicional"
"- Fixed @raw.align[alignment] of text inside raw blocks (centering a raw block, e.g. through a figure, will now keep the text itself left-aligned)" = "- Se corrigió la @raw.align[alineación] del texto dentro de bloques raw (centrar un bloque raw, p. ej., mediante una figura, ahora mantiene el texto alineado a la izquierda)"
"- Added support for passing a array instead of a function to configure table cell @table.align[alignment] and @table.fill[fill] per column" = "- Se agregó compatibilidad para pasar un array en lugar de una función para configurar la @table.align[alineación] y el @table.fill[relleno] de las celdas de tabla por columna"
"- Fixed automatic figure @figure.kind[`kind`] detection" = "- Se corrigió la detección automática del @figure.kind[`kind`] de las figuras"
"- Made alignment of @enum.number-align[enum numbers] configurable, defaulting to `end`" = "- Ahora es configurable la alineación de los @enum.number-align[números de enumeración], con `end` por defecto"
"- Figures can now be made breakable with a show-set rule for blocks in figure" = "- Ahora se puede hacer que las figuras se dividan entre páginas con una regla show-set para los bloques dentro de figure"
"- Initial fix for smart quotes in RTL languages" = "- Corrección inicial de las comillas tipográficas en idiomas de derecha a izquierda"
"= Export <export>" = "= Exportación <export>"
"- Fixed ligatures in PDF export: They are now copyable and searchable" = "- Se corrigieron las ligaduras en la exportación a PDF: ahora se pueden copiar y buscar"
"- Exported PDFs now embed ICC profiles for images that have them" = "- Los PDF exportados ahora incrustan los perfiles ICC de las imágenes que los tienen"
"- Fixed export of strokes with zero thickness" = "- Se corrigió la exportación de trazos de grosor cero"
"= Web app <web-app>" = "= App web <web-app>"
"- Projects can now contain folders" = "- Los proyectos ahora pueden contener carpetas"
"- Added upload by drag-and-drop into the file panel" = "- Se agregó la carga por arrastrar y soltar en el panel de archivos"
"- Files from the file panel can now be dragged into the editor to insert them into a Typst file" = "- Los archivos del panel de archivos ahora se pueden arrastrar al editor para insertarlos en un archivo de Typst"
"- You can now copy-paste images and other files from your computer directly into the editor" = "- Ahora podés copiar y pegar imágenes y otros archivos de tu computadora directamente en el editor"
"- Added a button to resend confirmation email" = "- Se agregó un botón para reenviar el correo de confirmación"
"- Added an option to invert preview colors in dark mode" = "- Se agregó una opción para invertir los colores de la vista previa en modo oscuro"
"- Added tips to the loading screen and the Help menu. Feel free to propose more!" = "- Se agregaron consejos a la pantalla de carga y al menú de ayuda. ¡Sentite libre de proponer más!"
"- Added syntax highlighting for YAML files" = "- Se agregó el resaltado de sintaxis para archivos YAML"
"- Allowed middle mouse button click on many buttons to navigate into a new tab" = "- Se permitió el clic con el botón central del mouse en muchos botones para navegar a una pestaña nueva"
"- Allowed more project names" = "- Se permitieron más nombres de proyecto"
"- Fixed overridden Vim mode keybindings" = "- Se corrigieron los atajos de teclado del modo Vim que se sobrescribían"
"- Fixed many bugs regarding file upload and more" = "- Se corrigieron muchos errores relacionados con la carga de archivos y más"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Improved performance of counters, state, and queries" = "- Se mejoró el rendimiento de contadores, estados y consultas"
"- Improved incremental parsing for more efficient recompilations" = "- Se mejoró el análisis sintáctico incremental para lograr recompilaciones más eficientes"
"- Added support for `.yaml` extension in addition to `.yml` for bibliographies" = "- Se agregó compatibilidad con la extensión `.yaml`, además de `.yml`, para las bibliografías"
"- The CLI now emits escape codes only if the output is a TTY" = "- La CLI ahora emite códigos de escape solo si la salida es una TTY"
"- For users of the `typst` crate: The `Document` is now `Sync` again and the `World` doesn't have to be `'static` anymore" = "- Para quienes usan el crate `typst`: el `Document` vuelve a ser `Sync` y el `World` ya no tiene que ser `'static`"

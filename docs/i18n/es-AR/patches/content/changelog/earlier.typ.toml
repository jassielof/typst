# Line patches for docs/content/changelog/earlier.typ (see docs/src/i18n.rs).
"= March 28, 2023 <march-28-2023>" = "= 28 de marzo de 2023 <march-28-2023>"
"- *Breaking changes:*" = "- *Cambios incompatibles:*"
"- Enumerations now require a space after their marker, that is, `[1.ok]` must now be written as `[1. ok]`" = "- Las enumeraciones ahora requieren un espacio después de su marcador; es decir, `[1.ok]` ahora debe escribirse `[1. ok]`"
"- Changed default style for @terms[term lists]: Does not include a colon anymore and has a bit more indent" = "- Se cambió el estilo predeterminado de las @terms[listas de términos]: ya no incluye dos puntos y tiene un poco más de sangría"
"- Command line interface" = "- Interfaz de línea de comandos"
"- Added `--font-path` argument for CLI" = "- Se agregó el argumento `--font-path` a la CLI"
"- Embedded default fonts in CLI binary" = "- Se incrustaron las fuentes predeterminadas en el binario de la CLI"
"- Fixed build of CLI if `git` is not installed" = "- Se corrigió la compilación de la CLI cuando `git` no está instalado"
"- Miscellaneous improvements" = "- Mejoras varias"
"- Added support for disabling @math.mat[matrix] and @math.vec[vector] delimiters. Generally with `[#set math.mat(delim: none)]` or one-off with `[$mat(delim: #none, 1, 2; 3, 4)$]`." = "- Se agregó compatibilidad para desactivar los delimitadores de @math.mat[matrices] y @math.vec[vectores]. En general con `[#set math.mat(delim: none)]` o puntualmente con `[$mat(delim: #none, 1, 2; 3, 4)$]`."
"- Added @terms.separator[`separator`] argument to term lists" = "- Se agregó el argumento @terms.separator[`separator`] a las listas de términos"
"- Added @math.round[`round`] function for equations" = "- Se agregó la función @math.round[`round`] para ecuaciones"
"- Numberings now allow zeros. To reset a counter, you can write `[#counter(..).update(0)]`" = "- Las numeraciones ahora admiten ceros. Para reiniciar un contador, podés escribir `[#counter(..).update(0)]`"
"- Added documentation for `{page()}` and `{position()}` methods on @location type" = "- Se agregó documentación de los métodos `{page()}` y `{position()}` del tipo @location"
"- Added symbols for double, triple, and quadruple dot accent" = "- Se agregaron símbolos para el acento de punto doble, triple y cuádruple"
"- Added smart quotes for Norwegian Bokmål" = "- Se agregaron comillas tipográficas para el noruego bokmål"
"- Added Nix flake" = "- Se agregó un flake de Nix"
"- Fixed bibliography ordering in IEEE style" = "- Se corrigió el orden de la bibliografía en el estilo IEEE"
"- Fixed parsing of decimals in math: `[$1.2/3.4$]`" = "- Se corrigió el análisis de decimales en matemática: `[$1.2/3.4$]`"
"- Fixed parsing of unbalanced delimiters in fractions: `[$1/(2 (x)$]`" = "- Se corrigió el análisis de delimitadores desbalanceados en fracciones: `[$1/(2 (x)$]`"
"- Fixed unexpected parsing of numbers as enumerations, e.g. in `[1.2]`" = "- Se corrigió el análisis inesperado de números como enumeraciones, p. ej., en `[1.2]`"
"- Fixed combination of page fill and header" = "- Se corrigió la combinación de relleno de página y encabezado"
"- Fixed compiler crash if @repeat is used in page with automatic width" = "- Se corrigió un fallo del compilador si se usa @repeat en una página de ancho automático"
"- Fixed @math.mat[matrices] with explicit delimiter" = "- Se corrigieron las @math.mat[matrices] con delimitador explícito"
"- Fixed @terms.indent[`indent`] property of term lists" = "- Se corrigió la propiedad @terms.indent[`indent`] de las listas de términos"
"- Numerous documentation fixes" = "- Numerosas correcciones de documentación"
"- Links in bibliographies are now affected by link styling" = "- Los enlaces en las bibliografías ahora se ven afectados por el estilo de enlaces"
"- Fixed hovering over comments in web app" = "- Se corrigió el pasar el mouse sobre comentarios en la app web"
"= March 21, 2023 <march-21-2023>" = "= 21 de marzo de 2023 <march-21-2023>"
"- Reference and bibliography management" = "- Gestión de referencias y bibliografía"
"- @bibliography[Bibliographies] and @cite[citations] (currently supported styles are APA, Chicago Author Date, IEEE, and MLA)" = "- @bibliography[Bibliografías] y @cite[citas] (los estilos admitidos por ahora son APA, Chicago autor-fecha, IEEE y MLA)"
"- You can now @ref[reference] sections, figures, formulas, and works from the bibliography with `[@label]`" = "- Ahora podés @ref[referenciar] secciones, figuras, fórmulas y obras de la bibliografía con `[@label]`"
"- You can make an element referenceable with a label:" = "- Podés hacer que un elemento sea referenciable con una etiqueta:"
"- Introspection system for interactions between different parts of the document" = "- Sistema de introspección para interacciones entre distintas partes del documento"
"- @counter function" = "- Función @counter"
"- Access and modify counters for pages, headings, figures, and equations" = "- Accedé a los contadores de páginas, títulos, figuras y ecuaciones y modificalos"
"- Define and use your own custom counters" = "- Definí y usá tus propios contadores personalizados"
"- Time travel: Find out what the counter value was or will be at some other point in the document (e.g. when you're building a list of figures, you can determine the value of the figure counter at any given figure)." = "- Viaje en el tiempo: averiguá cuál era o será el valor del contador en otro punto del documento (p. ej., al armar una lista de figuras, podés determinar el valor del contador de figuras en cada figura)."
"- Counters count in layout order and not in code order" = "- Los contadores cuentan en orden de diseño y no en orden de código"
"- @state function" = "- Función @state"
"- Manage arbitrary state across your document" = "- Administrá estado arbitrario en todo tu documento"
"- Time travel: Find out the value of your state at any position in the document" = "- Viaje en el tiempo: averiguá el valor de tu estado en cualquier posición del documento"
"- State is modified in layout order and not in code order" = "- El estado se modifica en orden de diseño y no en orden de código"
"- @query function" = "- Función @query"
"- Find all occurrences of an element or a label, either in the whole document or before/after some location" = "- Encontrá todas las apariciones de un elemento o de una etiqueta, ya sea en todo el documento o antes/después de cierta ubicación"
"- Link to elements, find out their position on the pages and access their fields" = "- Enlazá a elementos, averiguá su posición en las páginas y accedé a sus campos"
"- Example use cases: Custom list of figures or page header with current chapter title" = "- Ejemplos de uso: una lista de figuras personalizada o un encabezado de página con el título del capítulo actual"
"- @locate function" = "- Función @locate"
"- Determines the location of itself in the final layout" = "- Determina la ubicación de sí misma en el diseño final"
"- Can be accessed to get the `page` and `x`, `y` coordinates" = "- Se puede acceder a ella para obtener `page` y las coordenadas `x`, `y`"
"- Can be used with counters and state to find out their values at that location" = "- Se puede usar con contadores y estado para averiguar sus valores en esa ubicación"
"- Can be used with queries to find elements before or after its location" = "- Se puede usar con consultas para encontrar elementos antes o después de su ubicación"
"- New @measure function" = "- Nueva función @measure"
"- Measure the layouted size of elements" = "- Mide el tamaño ya diseñado de los elementos"
"- To be used in combination with the new `style` function that lets you generate different content based on the style context something is inserted into (because that affects the measured size of content)" = "- Pensada para usarse junto con la nueva función `style`, que permite generar distinto contenido según el contexto de estilo en el que se inserta algo (porque eso afecta el tamaño medido del contenido)"
"- Exposed content representation" = "- Representación de contenido expuesta"
"- Content is not opaque anymore" = "- El contenido ya no es opaco"
"- Content can be compared for equality" = "- El contenido se puede comparar por igualdad"
"- The tree of content elements can be traversed with code" = "- El árbol de elementos de contenido se puede recorrer con código"
"- Can be observed in hover tooltips or with @repr" = "- Se puede observar en los tooltips al pasar el mouse o con @repr"
"- New @content[methods] on content: `func`, `has`, `at`, and `location`" = "- Nuevos @content[métodos] sobre contenido: `func`, `has`, `at` y `location`"
"- All optional fields on elements are now settable" = "- Todos los campos opcionales de los elementos ahora se pueden configurar con set"
"- More uniform field names (`heading.title` becomes `heading.body`, `list.items` becomes `list.children`, and a few more changes)" = "- Nombres de campo más uniformes (`heading.title` pasa a ser `heading.body`, `list.items` pasa a ser `list.children` y algunos cambios más)"
"- Further improvements" = "- Más mejoras"
"- Added @figure function" = "- Se agregó la función @figure"
"- Added @math.equation.numbering[`numbering`] parameter on equation function" = "- Se agregó el parámetro @math.equation.numbering[`numbering`] a la función equation"
"- Added @page.numbering[`numbering`] and @page.number-align[`number-align`] parameters on page function" = "- Se agregaron los parámetros @page.numbering[`numbering`] y @page.number-align[`number-align`] a la función page"
"- The page function's @page.header[`header`] and @page.footer[`footer`] parameters do not take functions anymore. If you want to customize them based on the page number, use the new @page.numbering[`numbering`] parameter or @counter function instead." = "- Los parámetros @page.header[`header`] y @page.footer[`footer`] de la función page ya no aceptan funciones. Si querés personalizarlos según el número de página, usá el nuevo parámetro @page.numbering[`numbering`] o la función @counter."
"- Added @page.footer-descent[`footer-descent`] and @page.header-ascent[`header-ascent`] parameters" = "- Se agregaron los parámetros @page.footer-descent[`footer-descent`] y @page.header-ascent[`header-ascent`]"
"- Better default alignment in header and footer" = "- Mejor alineación predeterminada en encabezado y pie de página"
"- Fixed Arabic vowel placement" = "- Se corrigió la ubicación de las vocales en árabe"
"- Fixed PDF font embedding issues" = "- Se corrigieron problemas de incrustación de fuentes en PDF"
"- Renamed `math.formula` to @math.equation" = "- Se renombró `math.formula` a @math.equation"
"- Font family must be a named argument now: `[#set text(font: \"..\")]`" = "- Ahora la familia de fuentes debe ser un argumento con nombre: `[#set text(font: \"..\")]`"
"- Added support for @par.hanging-indent[hanging indent]" = "- Se agregó compatibilidad con la @par.hanging-indent[sangría francesa]"
"- Renamed paragraph `indent` to @par.first-line-indent[`first-line-indent`]" = "- Se renombró la `indent` de los párrafos a @par.first-line-indent[`first-line-indent`]"
"- More accurate @calc.log[logarithm] when base is `2` or `10`" = "- @calc.log[Logaritmo] más preciso cuando la base es `2` o `10`"
"- Improved some error messages" = "- Se mejoraron algunos mensajes de error"
"- Fixed layout of @terms list" = "- Se corrigió el diseño de la lista @terms"
"- Web app improvements" = "- Mejoras de la app web"
"- Added template gallery" = "- Se agregó una galería de plantillas"
"- Added buttons to insert headings, equations, raw blocks, and references" = "- Se agregaron botones para insertar títulos, ecuaciones, bloques raw y referencias"
"- Jump to the source of something by clicking on it in the preview panel (works for text, equations, images, and more)" = "- Saltá al código fuente de algo haciendo clic en el panel de vista previa (funciona con texto, ecuaciones, imágenes y más)"
"- You can now upload your own fonts and use them in your project" = "- Ahora podés subir tus propias fuentes y usarlas en tu proyecto"
"- Hover debugging and autocompletion now takes multiple files into account and works in show rules" = "- La depuración al pasar el mouse y el autocompletado ahora tienen en cuenta varios archivos y funcionan en reglas show"
"- Hover tooltips now automatically collapse multiple consecutive equal values" = "- Los tooltips ahora colapsan automáticamente varios valores iguales consecutivos"
"- The preview now automatically scrolls to the right place when you type" = "- La vista previa ahora se desplaza automáticamente al lugar correcto mientras escribís"
"- Links are now clickable in the preview area" = "- Los enlaces ahora se pueden hacer clic en el área de vista previa"
"- Toolbar, preview, and editor can now all be hidden" = "- La barra de herramientas, la vista previa y el editor ahora se pueden ocultar"
"- Added autocompletion for raw block language tags" = "- Se agregó el autocompletado de etiquetas de lenguaje de bloques raw"
"- Added autocompletion in SVG files" = "- Se agregó el autocompletado en archivos SVG"
"- New back button instead of four-dots button" = "- Nuevo botón de volver en lugar del botón de cuatro puntos"
"- Lots of bug fixes" = "- Muchísimas correcciones de errores"
"= February 25, 2023 <february-25-2023>" = "= 25 de febrero de 2023 <february-25-2023>"
"- Font changes" = "- Cambios de fuentes"
"- New default font: Linux Libertine" = "- Nueva fuente predeterminada: Linux Libertine"
"- New default font for raw blocks: DejaVu Sans Mono" = "- Nueva fuente predeterminada para bloques raw: DejaVu Sans Mono"
"- New default font for math: Book weight of New Computer Modern Math" = "- Nueva fuente predeterminada para matemática: el peso Book de New Computer Modern Math"
"- Lots of new math fonts available" = "- Muchas fuentes matemáticas nuevas disponibles"
"- Removed Latin Modern fonts in favor of New Computer Modern family" = "- Se eliminaron las fuentes Latin Modern en favor de la familia New Computer Modern"
"- Removed unnecessary smallcaps fonts which are already accessible through the corresponding main font and the @smallcaps function" = "- Se eliminaron las fuentes de versalitas innecesarias, que ya son accesibles a través de la fuente principal correspondiente y la función @smallcaps"
"- Improved default spacing for headings" = "- Se mejoró el espaciado predeterminado de los títulos"
"- Added @panic function" = "- Se agregó la función @panic"
"- Added @str.clusters[`clusters`] and @str.codepoints[`codepoints`] methods for strings" = "- Se agregaron los métodos @str.clusters[`clusters`] y @str.codepoints[`codepoints`] para cadenas de texto"
"- Support for multiple authors in @document.author[`set document`]" = "- Compatibilidad con varios autores en @document.author[`set document`]"
"- Fixed crash when string is accessed at a position that is not a char boundary" = "- Se corrigió un fallo cuando se accede a una cadena en una posición que no es un límite de carácter"
"- Fixed semicolon parsing in `[#var ;]`" = "- Se corrigió el análisis del punto y coma en `[#var ;]`"
"- Fixed incremental parsing when inserting backslash at end of `[#\"abc\"]`" = "- Se corrigió el análisis incremental al insertar una barra invertida al final de `[#\"abc\"]`"
"- Fixed names of a few font families (including Noto Sans Symbols and New Computer Modern families)" = "- Se corrigieron los nombres de algunas familias de fuentes (incluidas Noto Sans Symbols y las familias New Computer Modern)"
"- Fixed autocompletion for font families" = "- Se corrigió el autocompletado de familias de fuentes"
"- Improved incremental compilation for user-defined functions" = "- Se mejoró la compilación incremental para funciones definidas por el usuario"
"= February 15, 2023 <february-15-2023>" = "= 15 de febrero de 2023 <february-15-2023>"
"- @box[Box] and @block[block] have gained `fill`, `stroke`, `radius`, and `inset` properties" = "- @box[Box] y @block[block] ganaron las propiedades `fill`, `stroke`, `radius` e `inset`"
"- Blocks may now be explicitly sized, fixed-height blocks can still break across pages" = "- Los bloques ahora pueden tener un tamaño explícito; los bloques de altura fija igualmente se pueden dividir entre páginas"
"- Blocks can now be configured to be @block.breakable[`breakable`] or not" = "- Ahora se puede configurar si los bloques son @block.breakable[`breakable`] o no"
"- @enum.numbering[Numbering style] can now be configured for nested enums" = "- El @enum.numbering[estilo de numeración] ahora se puede configurar para enumeraciones anidadas"
"- @list.marker[Markers] can now be configured for nested lists" = "- Los @list.marker[marcadores] ahora se pueden configurar para listas anidadas"
"- The @eval function now expects code instead of markup and returns an arbitrary value. Markup can still be evaluated by surrounding the string with brackets." = "- La función @eval ahora espera código en lugar de marcado y devuelve un valor arbitrario. El marcado igualmente se puede evaluar encerrando la cadena entre corchetes."
"- PDFs generated by Typst now contain XMP metadata" = "- Los PDF generados por Typst ahora contienen metadatos XMP"
"- Link boxes are now disabled in PDF output" = "- Los cuadros de enlace ahora están desactivados en la salida PDF"
"- Tables don't produce small empty cells before a pagebreak anymore" = "- Las tablas ya no producen celdas vacías pequeñas antes de un salto de página"
"- Fixed raw block highlighting bug" = "- Se corrigió un error de resaltado de bloques raw"
"= February 12, 2023 <february-12-2023>" = "= 12 de febrero de 2023 <february-12-2023>"
"- Shapes, images, and transformations (move/rotate/scale/repeat) are now block-level. To integrate them into a paragraph, use a @box as with other elements." = "- Las formas, imágenes y transformaciones (move/rotate/scale/repeat) ahora son de bloque. Para integrarlas en un párrafo, usá una @box, igual que con otros elementos."
"- A colon is now required in an \"everything\" show rule: Write `{show: it => ..}` instead of `{show it => ..}`. This prevents intermediate states that ruin your whole document." = "- Ahora se requieren dos puntos en una regla show de \"todo\": escribí `{show: it => ..}` en lugar de `{show it => ..}`. Esto evita estados intermedios que arruinan todo tu documento."
"- Non-math content like a shape or table in a math formula is now centered vertically" = "- El contenido que no es matemático, como una forma o una tabla dentro de una fórmula matemática, ahora se centra verticalmente"
"- Support for widow and orphan prevention within containers" = "- Compatibilidad con la prevención de viudas y huérfanas dentro de contenedores"
"- Support for @text.dir[RTL] in lists, grids, and tables" = "- Compatibilidad con @text.dir[RTL] en listas, grillas y tablas"
"- Support for explicit `{auto}` sizing for boxes and shapes" = "- Compatibilidad con el dimensionamiento explícito `{auto}` para cajas y formas"
"- Support for fractional (i.e. `{1fr}`) widths for boxes" = "- Compatibilidad con anchos fraccionarios (es decir, `{1fr}`) para cajas"
"- Fixed bug where columns jump to next page" = "- Se corrigió un error por el cual las columnas saltaban a la página siguiente"
"- Fixed bug where list items have no leading" = "- Se corrigió un error por el cual los elementos de lista no tenían interlineado"
"- Fixed relative sizing in lists, squares and grid auto columns" = "- Se corrigió el dimensionamiento relativo en listas, cuadrados y columnas automáticas de grillas"
"- Fixed relative displacement in @place function" = "- Se corrigió el desplazamiento relativo en la función @place"
"- Fixed that lines don't have a size" = "- Se corrigió que las líneas no tuvieran tamaño"
"- Fixed bug where `{set document(..)}` complains about being after content" = "- Se corrigió un error por el cual `{set document(..)}` se quejaba de estar después de contenido"
"- Fixed parsing of `{not in}` operation" = "- Se corrigió el análisis de la operación `{not in}`"
"- Fixed hover tooltips in math" = "- Se corrigieron los tooltips al pasar el mouse en matemática"
"- Fixed bug where a heading show rule may not contain a pagebreak when an outline is present" = "- Se corrigió un error por el cual una regla show de título no podía contener un salto de página cuando hay un índice"
"- Added @box.baseline[`baseline`] property on @box" = "- Se agregó la propiedad @box.baseline[`baseline`] a @box"
"- Added @math.op[`tg`] and @math.op[`ctg`] operators in math" = "- Se agregaron los operadores @math.op[`tg`] y @math.op[`ctg`] en matemática"
"- Added delimiter setting for @math.cases[`cases`] function" = "- Se agregó la configuración de delimitador a la función @math.cases[`cases`]"
"- Parentheses are now included when accepting a function autocompletion" = "- Ahora se incluyen los paréntesis al aceptar un autocompletado de función"
"= February 2, 2023 <february-2-2023>" = "= 2 de febrero de 2023 <february-2-2023>"
"- Merged text and math symbols, renamed a few symbols (including `infty` to `infinity` with the alias `oo`)" = "- Se fusionaron los símbolos de texto y de matemática y se renombraron algunos símbolos (incluido `infty` a `infinity`, con el alias `oo`)"
"- Fixed missing italic mappings" = "- Se corrigieron asignaciones de cursiva faltantes"
"- Math italics correction is now applied properly" = "- La corrección de cursiva matemática ahora se aplica correctamente"
"- Parentheses now scale in `[$zeta(x/2)$]`" = "- Los paréntesis ahora escalan en `[$zeta(x/2)$]`"
"- Fixed placement of large root index" = "- Se corrigió la ubicación del índice de una raíz grande"
"- Fixed spacing in `[$abs(-x)$]`" = "- Se corrigió el espaciado en `[$abs(-x)$]`"
"- Fixed inconsistency between text and identifiers in math" = "- Se corrigió la inconsistencia entre texto e identificadores en matemática"
"- Accents are now ignored when positioning superscripts" = "- Los acentos ahora se ignoran al posicionar superíndices"
"- Fixed vertical alignment in matrices" = "- Se corrigió la alineación vertical en matrices"
"- Fixed `text` set rule in `raw` show rule" = "- Se corrigió la regla set de `text` en la regla show de `raw`"
"- Heading and list markers now parse consistently" = "- Los marcadores de títulos y listas ahora se analizan de forma coherente"
"- Allow arbitrary math directly in content" = "- Ahora se permite matemática arbitraria directamente en el contenido"
"= January 30, 2023 <january-30-2023>" = "= 30 de enero de 2023 <january-30-2023>"
"- New expression syntax in markup/math" = "- Nueva sintaxis de expresiones en marcado/matemática"
"- Blocks cannot be directly embedded in markup anymore" = "- Los bloques ya no se pueden incrustar directamente en el marcado"
"- Like other expressions, they now require a leading hash" = "- Como las demás expresiones, ahora requieren un numeral inicial"
"- More expressions available with hash, including literals (`[#\"string\"]`) as well as field access and method call without space: `[#emoji.face]`" = "- Hay más expresiones disponibles con el numeral, incluidos los literales (`[#\"string\"]`), así como el acceso a campos y la llamada a métodos sin espacio: `[#emoji.face]`"
"- New import syntax" = "- Nueva sintaxis de importación"
"- `[#import \"module.typ\"]` creates binding named `module`" = "- `[#import \"module.typ\"]` crea un enlace con el nombre `module`"
"- `[#import \"module.typ\": a, b]` or `[#import \"module.typ\": *]` to import items" = "- `[#import \"module.typ\": a, b]` o `[#import \"module.typ\": *]` para importar elementos"
"- `[#import emoji: face, turtle]` to import from already bound module" = "- `[#import emoji: face, turtle]` para importar desde un módulo ya enlazado"
"- New symbol handling" = "- Nuevo manejo de símbolos"
"- Removed symbol notation" = "- Se eliminó la notación de símbolos"
"- Symbols are now in modules: `{sym}`, `{emoji}`, and `{math}`" = "- Los símbolos ahora están en módulos: `{sym}`, `{emoji}` y `{math}`"
"- Math module also reexports all of `{sym}`" = "- El módulo math también reexporta todo `{sym}`"
"- Modified through field access, still order-independent" = "- Se modifican mediante acceso a campos, y siguen sin depender del orden"
"- Unknown modifiers are not allowed anymore" = "- Ya no se permiten modificadores desconocidos"
"- Support for custom symbol definitions with `symbol` function" = "- Compatibilidad con definiciones de símbolos personalizadas con la función `symbol`"
"- Symbols now listed in documentation" = "- Ahora los símbolos aparecen listados en la documentación"
"- New `{math}` module" = "- Nuevo módulo `{math}`"
"- Contains all math-related functions" = "- Contiene todas las funciones relacionadas con la matemática"
"- Variables and function calls directly in math (without hash) access this module instead of the global scope, but can also access local variables" = "- Las variables y llamadas a funciones directamente en matemática (sin numeral) acceden a este módulo en lugar del alcance global, pero también pueden acceder a variables locales"
"- Can be explicitly used in code, e.g. `[#set math.vec(delim: \"[\")]`" = "- Se puede usar explícitamente en código, p. ej., `[#set math.vec(delim: \"[\")]`"
"- Delimiter matching in math" = "- Emparejamiento de delimitadores en matemática"
"- Any opening delimiters matches any closing one" = "- Cualquier delimitador de apertura coincide con cualquiera de cierre"
"- When matched, they automatically scale" = "- Cuando coinciden, escalan automáticamente"
"- To prevent scaling, escape them" = "- Para evitar el escalado, escapalos"
"- To forcibly match two delimiters, use `lr` function" = "- Para forzar la coincidencia de dos delimitadores, usá la función `lr`"
"- Line breaks may occur between matched delimiters" = "- Puede haber saltos de línea entre delimitadores emparejados"
"- Delimiters may also be unbalanced" = "- Los delimitadores también pueden estar desbalanceados"
"- You can also use the `lr` function to scale the brackets (or just one bracket) to a specific size manually" = "- También podés usar la función `lr` para escalar manualmente los paréntesis (o solo uno) a un tamaño específico"
"- Multi-line math with alignment" = "- Matemática de varias líneas con alineación"
"- The `\\` character inserts a line break" = "- El carácter `\\` inserta un salto de línea"
"- The `&` character defines an alignment point" = "- El carácter `&` define un punto de alineación"
"- Alignment points also work for underbraces, vectors, cases, and matrices" = "- Los puntos de alineación también funcionan con llaves inferiores, vectores, casos y matrices"
"- Multiple alignment points are supported" = "- Se admiten varios puntos de alineación"
"- More capable math function calls" = "- Llamadas a funciones matemáticas más potentes"
"- Function calls directly in math can now take code expressions with hash" = "- Las llamadas a funciones directamente en matemática ahora pueden recibir expresiones de código con numeral"
"- They can now also take named arguments" = "- Ahora también pueden recibir argumentos con nombre"
"- Within math function calls, semicolons turn preceding arguments to arrays to support matrices: `[$mat(1, 2; 3, 4)$]`" = "- Dentro de las llamadas a funciones matemáticas, los puntos y coma convierten los argumentos anteriores en arrays para admitir matrices: `[$mat(1, 2; 3, 4)$]`"
"- Arbitrary content in math" = "- Contenido arbitrario en matemática"
"- Text, images, and other arbitrary content can now be embedded in math" = "- Ahora se pueden incrustar en matemática texto, imágenes y otro contenido arbitrario"
"- Math now also supports font fallback to support e.g. CJK and emoji" = "- La matemática ahora también admite fuente de reserva para soportar, p. ej., CJK y emojis"
"- More math features" = "- Más funciones matemáticas"
"- New text operators: `op` function, `lim`, `max`, etc." = "- Nuevos operadores de texto: función `op`, `lim`, `max`, etc."
"- New matrix function: `mat`" = "- Nueva función de matriz: `mat`"
"- New n-ary roots with `root` function: `[$root(3, x)$]`" = "- Nuevas raíces n-arias con la función `root`: `[$root(3, x)$]`"
"- New under- and overbraces, -brackets, and -lines" = "- Nuevas llaves, corchetes y líneas, inferiores y superiores"
"- New `abs` and `norm` functions" = "- Nuevas funciones `abs` y `norm`"
"- New shorthands: `[|`, `|]`, and `||`" = "- Nuevos atajos: `[|`, `|]` y `||`"
"- New `attach` function, overridable attachments with `script` and `limit`" = "- Nueva función `attach`, con adjuntos reemplazables mediante `script` y `limit`"
"- Manual spacing in math, with `h`, `thin`, `med`, `thick` and `quad`" = "- Espaciado manual en matemática, con `h`, `thin`, `med`, `thick` y `quad`"
"- Symbols and other content may now be used like a function, e.g. `[$zeta(x)$]`" = "- Los símbolos y otro contenido ahora se pueden usar como una función, p. ej., `[$zeta(x)$]`"
"- Added Fira Math font, removed Noto Sans Math font" = "- Se agregó la fuente Fira Math y se quitó la fuente Noto Sans Math"
"- Support for alternative math fonts through `[#show math.formula: set text(\"Fira Math\")]`" = "- Compatibilidad con fuentes matemáticas alternativas mediante `[#show math.formula: set text(\"Fira Math\")]`"
"- More library improvements" = "- Más mejoras de la biblioteca"
"- New `calc` module, `abs`, `min`, `max`, `even`, `odd` and `mod` moved there" = "- Nuevo módulo `calc`, al que se movieron `abs`, `min`, `max`, `even`, `odd` y `mod`"
"- New `message` argument on `{assert}` function" = "- Nuevo argumento `message` en la función `{assert}`"
"- The `pairs` method on dictionaries now returns an array of length-2 arrays instead of taking a closure" = "- El método `pairs` de los diccionarios ahora devuelve un array de arrays de longitud 2 en lugar de recibir una función"
"- The method call `{dict.at(\"key\")}` now always fails if `\"key\"` doesn't exist Previously, it was allowed in assignments. Alternatives are `{dict.key = x}` and `{dict.insert(\"key\", x)}`." = "- La llamada al método `{dict.at(\"key\")}` ahora siempre falla si `\"key\"` no existe. Antes se permitía en asignaciones. Las alternativas son `{dict.key = x}` y `{dict.insert(\"key\", x)}`."
"- Smarter editor functionality" = "- Funcionalidad del editor más inteligente"
"- Autocompletion for local variables" = "- Autocompletado de variables locales"
"- Autocompletion for methods available on a value" = "- Autocompletado de métodos disponibles en un valor"
"- Autocompletion for symbols and modules" = "- Autocompletado de símbolos y módulos"
"- Autocompletion for imports" = "- Autocompletado de importaciones"
"- Hover over an identifier to see its value(s)" = "- Pasá el mouse sobre un identificador para ver su valor o valores"
"- Further editor improvements" = "- Más mejoras del editor"
"- New Font menu with previews" = "- Nuevo menú de fuentes con vistas previas"
"- Single projects may now be shared with share links" = "- Ahora se pueden compartir proyectos individuales con enlaces para compartir"
"- New dashboard experience if projects are shared with you" = "- Nueva experiencia de panel si se comparten proyectos con vos"
"- Keyboard Shortcuts are now listed in the menus and there are more of them" = "- Los atajos de teclado ahora aparecen en los menús y hay más"
"- New Offline indicator" = "- Nuevo indicador de sin conexión"
"- Tooltips for all buttons" = "- Tooltips para todos los botones"
"- Improved account protection" = "- Mejor protección de la cuenta"
"- Moved Status indicator into the error list button" = "- Se movió el indicador de estado al botón de la lista de errores"
"- Further fixes" = "- Más correcciones"
"- Multiple bug fixes for incremental parser" = "- Varias correcciones de errores del analizador incremental"
"- Fixed closure parameter capturing" = "- Se corrigió la captura de parámetros de clausuras"
"- Fixed tons of math bugs" = "- Se corrigieron toneladas de errores de matemática"
"- Bugfixes for performance, file management, editing reliability" = "- Correcciones de rendimiento, gestión de archivos y confiabilidad de edición"
"- Added redirection to the page originally navigated to after signin" = "- Se agregó la redirección a la página a la que se navegó originalmente después de iniciar sesión"

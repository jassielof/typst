# Line patches for docs/content/changelog/0.6.0.typ (see docs/src/i18n.rs).
"= Package Management <package-management>" = "= Gestión de paquetes <package-management>"
"- Typst now has built-in @reference:scripting:packages[package management]" = "- Typst ahora tiene @reference:scripting:packages[gestión de paquetes] integrada"
"- You can import #link(\"https://typst.app/universe\")[published] community packages or create and use #link(\"https://github.com/typst/packages#local-packages\")[system-local] ones" = "- Podés importar paquetes de la comunidad #link(\"https://typst.app/universe\")[publicados] o crear y usar paquetes #link(\"https://github.com/typst/packages#local-packages\")[locales del sistema]"
"- Published packages are also supported in the web app" = "- Los paquetes publicados también se admiten en la app web"
"= Math <math>" = "= Matemática <math>"
"- Added support for optical size variants of glyphs in math mode" = "- Se agregó compatibilidad con variantes de tamaño óptico de los glifos en modo matemático"
"- Added argument to enable @math.limits[`limits`] conditionally depending on whether the equation is set in @math.display[`display`] or @math.inline[`inline`] style" = "- Se agregó un argumento para habilitar @math.limits[`limits`] de forma condicional según si la ecuación se compone en estilo @math.display[`display`] o @math.inline[`inline`]"
"- Added `gt.eq.slant` and `lt.eq.slant` symbols" = "- Se agregaron los símbolos `gt.eq.slant` y `lt.eq.slant`"
"- Increased precedence of factorials in math mode (`[$1/n!$]` works correctly now)" = "- Se aumentó la precedencia de los factoriales en modo matemático (`[$1/n!$]` ahora funciona correctamente)"
"- Improved @math.underline[underlines] and @math.overline[overlines] in math mode" = "- Se mejoraron los @math.underline[subrayados] y @math.overline[sobrerrayados] en modo matemático"
"- Fixed usage of @math.limits[`limits`] function in show rules" = "- Se corrigió el uso de la función @math.limits[`limits`] en reglas show"
"- Fixed bugs with line breaks in equations" = "- Se corrigieron errores con los saltos de línea en ecuaciones"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Added support for alternating page @page.margin[margins] with the `inside` and `outside` keys" = "- Se agregó compatibilidad con @page.margin[márgenes] de página alternados con las claves `inside` y `outside`"
"- Added support for specifying the page @page.binding[`binding`]" = "- Se agregó compatibilidad para especificar el @page.binding[`binding`] (encuadernación) de la página"
"- Added @pagebreak.to[`to`] argument to pagebreak function to skip to the next even or odd page" = "- Se agregó el argumento @pagebreak.to[`to`] a la función pagebreak para saltar a la siguiente página par o impar"
"- Added basic i18n for a few more languages (TR, SQ, TL)" = "- Se agregó internacionalización básica para algunos idiomas más (TR, SQ, TL)"
"- Fixed bug with missing table row at page break" = "- Se corrigió un error por el cual faltaba una fila de tabla en un salto de página"
"- Fixed bug with @underline[underlines]" = "- Se corrigió un error con los @underline[subrayados]"
"- Fixed bug superfluous table lines" = "- Se corrigió un error de líneas de tabla superfluas"
"- Fixed smart quotes after line breaks" = "- Se corrigieron las comillas tipográficas después de saltos de línea"
"- Fixed a crash related to text layout" = "- Se corrigió un fallo relacionado con el diseño del texto"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- *Breaking change:* Added requirement for `--root`/`TYPST_ROOT` directory to contain the input file because it designates the _project_ root. Existing setups that use `TYPST_ROOT` to emulate package management should switch to #link(\"https://github.com/typst/packages#local-packages\")[local packages]" = "- *Cambio incompatible:* Ahora se exige que el directorio `--root`/`TYPST_ROOT` contenga el archivo de entrada, porque designa la raíz del _proyecto_. Las configuraciones existentes que usan `TYPST_ROOT` para emular la gestión de paquetes deberían pasar a usar #link(\"https://github.com/typst/packages#local-packages\")[paquetes locales]"
"- *Breaking change:* Now denies file access outside of the project root" = "- *Cambio incompatible:* Ahora se deniega el acceso a archivos fuera de la raíz del proyecto"
"- Added support for local packages and on-demand package download" = "- Se agregó compatibilidad con paquetes locales y con la descarga de paquetes a demanda"
"- Now watches all relevant files, within the root and all packages" = "- Ahora observa todos los archivos relevantes, dentro de la raíz y de todos los paquetes"
"- Now displays compilation time" = "- Ahora muestra el tiempo de compilación"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Added @outline.entry to customize outline entries with show rules" = "- Se agregó @outline.entry para personalizar las entradas del índice con reglas show"
"- Added some hints for error messages" = "- Se agregaron algunas sugerencias a los mensajes de error"
"- Added some missing syntaxes for @raw highlighting" = "- Se agregaron algunas sintaxis faltantes para el resaltado de @raw"
"- Improved rendering of rotated images in PNG export and web app" = "- Se mejoró el renderizado de imágenes rotadas en la exportación a PNG y en la app web"
"- Made @footnote[footnotes] reusable and referenceable" = "- Las @footnote[notas al pie] ahora se pueden reutilizar y referenciar"
"- Fixed bug with citations and bibliographies in @locate" = "- Se corrigió un error con citas y bibliografías en @locate"
"- Fixed inconsistent tense in documentation" = "- Se corrigió el uso inconsistente de tiempos verbales en la documentación"
"= Development <development>" = "= Desarrollo <development>"
"- Added #link(\"https://github.com/typst/typst/blob/main/CONTRIBUTING.md\")[contribution guide]" = "- Se agregó la #link(\"https://github.com/typst/typst/blob/main/CONTRIBUTING.md\")[guía de contribución]"
"- Reworked `World` interface to accommodate for package management and make it a bit simpler to implement _(Breaking change for implementors)_" = "- Se rehízo la interfaz `World` para dar cabida a la gestión de paquetes y hacerla un poco más simple de implementar _(Cambio incompatible para quienes la implementan)_"

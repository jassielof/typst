"- Fixed querying of @metadata[metadata] next to `<html>` and `<body>` element" = "- Se corrigió la consulta de @metadata[metadatos] junto a los elementos `<html>` y `<body>`"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- Fixed @curve[curves] with multiple non-closed components" = "- Se corrigieron las @curve[curvas] con varios componentes no cerrados"

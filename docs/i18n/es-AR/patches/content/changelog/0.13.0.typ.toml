# Line patches for docs/content/changelog/0.13.0.typ (see docs/src/i18n.rs).
"= Highlights <highlights>" = "= Novedades destacadas <highlights>"
"- There is now a distinction between @par[proper paragraphs] and just inline-level content. This is important for future work on accessibility and means that @par.first-line-indent[first line indent] can now be enabled for all paragraphs instead of just consecutive ones." = "- Ahora se distingue entre @par[párrafos propiamente dichos] y simple contenido en línea. Esto es importante para el trabajo futuro sobre accesibilidad y significa que la @par.first-line-indent[sangría de primera línea] ahora se puede habilitar para todos los párrafos y no solo para los consecutivos."
"- The @outline has a better out-of-the-box look and is more customizable" = "- El @outline tiene un mejor aspecto por defecto y es más personalizable"
"- The new @curve function (that supersedes the `path` function) provides a simpler and more flexible interface for creating Bézier curves" = "- La nueva función @curve (que reemplaza a la función `path`) ofrece una interfaz más simple y flexible para crear curvas de Bézier"
"- The `image` function now supports raw @image.format[pixel raster formats] for generating images from within Typst" = "- La función `image` ahora admite @image.format[formatos de trama de píxeles] sin procesar, para generar imágenes desde Typst"
"- Functions that accept file paths now also accept raw @bytes[bytes], for full flexibility" = "- Las funciones que aceptan rutas de archivo ahora también aceptan @bytes[bytes] sin procesar, para máxima flexibilidad"
"- WebAssembly @plugin[plugins] are more flexible and automatically run multi-threaded" = "- Los @plugin[plugins] de WebAssembly son más flexibles y se ejecutan automáticamente en varios hilos"
"- Fixed a long-standing bug where single-letter strings in math (`[$\"a\"$]`) would be displayed in italics" = "- Se corrigió un error histórico por el cual las cadenas de una sola letra en matemática (`[$\"a\"$]`) se mostraban en cursiva"
"- You can now specify which charset should be @text.font[covered] by which font family" = "- Ahora podés especificar qué juego de caracteres debe @text.font[cubrir] cada familia de fuentes"
"- The @pdf.attach[`pdf.embed`] function lets you embed arbitrary files in the exported PDF" = "- La función @pdf.attach[`pdf.embed`] te permite incrustar archivos arbitrarios en el PDF exportado"
"- HTML export is currently under active development. The feature is still _very_ incomplete, but already available for experimentation behind a feature flag." = "- La exportación a HTML está en pleno desarrollo. La característica todavía está _muy_ incompleta, pero ya se puede experimentar con ella detrás de un indicador de característica."
"= Model <model>" = "= Modelo <model>"
"- There is now a distinction between @par[proper paragraphs] and just inline-level content *(Breaking change)*" = "- Ahora se distingue entre @par[párrafos propiamente dichos] y simple contenido en línea *(Cambio incompatible)*"
"- All text at the root of a document is wrapped in paragraphs. Meanwhile, text in a container (like a block) is only wrapped in a paragraph if the container holds any block-level content. If all of the content is inline-level, no paragraph is created." = "- Todo el texto en la raíz de un documento se envuelve en párrafos. En cambio, el texto dentro de un contenedor (como un bloque) solo se envuelve en un párrafo si el contenedor tiene algún contenido de bloque. Si todo el contenido es en línea, no se crea ningún párrafo."
"- In the laid-out document, it's not immediately visible whether text became part of a paragraph. However, it is still important for accessibility, HTML export, and for properties like `first-line-indent`." = "- En el documento ya diseñado, no se nota de inmediato si el texto pasó a formar parte de un párrafo. Sin embargo, sigue siendo importante para la accesibilidad, la exportación a HTML y para propiedades como `first-line-indent`."
"- Show rules on `par` now only affect proper paragraphs" = "- Las reglas show sobre `par` ahora solo afectan a los párrafos propiamente dichos"
"- The `first-line-indent` and `hanging-indent` properties also only affect proper paragraphs" = "- Las propiedades `first-line-indent` y `hanging-indent` también solo afectan a los párrafos propiamente dichos"
"- Creating a `{par[..]}` with body content that is not fully inline-level will result in a warning" = "- Crear un `{par[..]}` con un cuerpo que no sea totalmente en línea producirá una advertencia"
"- The default show rules of various built-in elements like lists, quotes, etc. were adjusted to ensure they produce/don't produce paragraphs as appropriate" = "- Se ajustaron las reglas show predeterminadas de varios elementos integrados, como listas, citas, etc., para asegurar que produzcan o no produzcan párrafos según corresponda"
"- Removed support for booleans and content in @outline.indent" = "- Se eliminó la compatibilidad con booleanos y contenido en @outline.indent"
"- The @outline function was fully reworked to improve its out-of-the-box behavior *(Breaking change)*" = "- La función @outline se rehízo por completo para mejorar su comportamiento por defecto *(Cambio incompatible)*"
"- @outline.entry[Outline entries] are now @block[blocks] and are thus affected by block spacing" = "- Las @outline.entry[entradas del índice] ahora son @block[bloques] y por lo tanto les afecta el espaciado de bloques"
"- The `{auto}` indentation mode now aligns numberings and titles outline-wide for a grid-like look" = "- El modo de sangría `{auto}` ahora alinea numeraciones y títulos en todo el índice para lograr un aspecto de grilla"
"- Automatic indentation now also indents entries without a numbering" = "- La sangría automática ahora también aplica sangría a las entradas sin numeración"
"- Titles wrapping over multiple lines now have hanging indent" = "- Los títulos que ocupan varias líneas ahora tienen sangría francesa"
"- The page number won't appear alone on its own line anymore" = "- El número de página ya no aparece solo en su propia línea"
"- The link now spans the full entry instead of just the title and page number" = "- El enlace ahora abarca toda la entrada y no solo el título y el número de página"
"- The default spacing between outline leader dots was increased" = "- Se aumentó el espaciado predeterminado entre los puntos guía del índice"
"- The @outline.entry.fill[`fill`] parameter was moved from `outline` to `outline.entry` and can thus be configured through show-set rules" = "- El parámetro @outline.entry.fill[`fill`] se movió de `outline` a `outline.entry` y por lo tanto se puede configurar mediante reglas show-set"
"- Removed `body` and `page` fields from outline entry" = "- Se eliminaron los campos `body` y `page` de las entradas del índice"
"- Added `indented`, `prefix`, `inner`, `body`, and `page` methods on outline entries to simplify writing of show rules" = "- Se agregaron los métodos `indented`, `prefix`, `inner`, `body` y `page` a las entradas del índice para simplificar la escritura de reglas show"
"- Added configuration to @par.first-line-indent for indenting all paragraphs instead of just consecutive ones" = "- Se agregó una configuración a @par.first-line-indent para aplicar sangría a todos los párrafos y no solo a los consecutivos"
"- Added @ref.form[`form`] parameter to `ref` function. Setting the form to `{\"page\"}` will produce a page reference instead of a textual one." = "- Se agregó el parámetro @ref.form[`form`] a la función `ref`. Si se establece la forma en `{\"page\"}`, se produce una referencia de página en lugar de una textual."
"- Added @document.description field, which results in corresponding PDF and HTML metadata" = "- Se agregó el campo @document.description, que genera los metadatos correspondientes en PDF y HTML"
"- Added @enum.reversed parameter" = "- Se agregó el parámetro @enum.reversed"
"- Added support for Greek @numbering[numbering]" = "- Se agregó compatibilidad con la @numbering[numeración] griega"
"- When the @link function wraps around a container like a @block[block], it will now generate only one link for the whole block instead of individual links for all the visible leaf elements. This significantly reduces PDF file sizes when combining `link` and @repeat." = "- Cuando la función @link envuelve un contenedor como un @block[bloque], ahora genera un solo enlace para todo el bloque en lugar de enlaces individuales para cada elemento hoja visible. Esto reduce significativamente el tamaño de los archivos PDF al combinar `link` con @repeat."
"- The @link function will now only strip one prefix (like `mailto:` or `tel:`) instead of multiple" = "- La función @link ahora solo quita un prefijo (como `mailto:` o `tel:`) en lugar de varios"
"- The link function now suppresses hyphenation via a built-in show-set rule rather than through its default show rule" = "- La función link ahora suprime la separación silábica mediante una regla show-set integrada y no mediante su regla show predeterminada"
"- Displaying the page counter without a specified numbering will now take the page numbering into account" = "- Mostrar el contador de páginas sin una numeración especificada ahora tiene en cuenta la numeración de páginas"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- Added new @curve function that supersedes the `path` function and provides a simpler and more flexible interface. The `path` function is now deprecated." = "- Se agregó la nueva función @curve, que reemplaza a la función `path` y ofrece una interfaz más simple y flexible. La función `path` ahora está obsoleta."
"- The `image` function now supports raw @image.format[pixel raster formats]. This can be used to generate images from within Typst without the need for encoding in an image exchange format." = "- La función `image` ahora admite @image.format[formatos de trama de píxeles] sin procesar. Se puede usar para generar imágenes desde Typst sin necesidad de codificarlas en un formato de intercambio de imágenes."
"- Added @image.scaling parameter for configuring how an image is scaled by PNG export and PDF viewers (smooth or pixelated)" = "- Se agregó el parámetro @image.scaling para configurar cómo escalan una imagen la exportación a PNG y los visores de PDF (suavizado o pixelado)"
"- Added @image.icc parameter for providing or overriding the ICC profile of an image" = "- Se agregó el parámetro @image.icc para proporcionar o reemplazar el perfil ICC de una imagen"
"- Renamed `pattern` to @tiling. The name `pattern` remains as a deprecated alias." = "- Se renombró `pattern` a @tiling. El nombre `pattern` sigue existiendo como alias obsoleto."
"- Added @gradient.center, @gradient.radius, @gradient.focal-center, and @gradient.focal-radius methods" = "- Se agregaron los métodos @gradient.center, @gradient.radius, @gradient.focal-center y @gradient.focal-radius"
"- Fixed interaction of clipping and outset on @box and @block" = "- Se corrigió la interacción entre el recorte y el outset en @box y @block"
"- Fixed panic with `path` of infinite length" = "- Se corrigió un pánico con un `path` de longitud infinita"
"- Fixed non-solid (e.g. tiling) text fills in clipped blocks" = "- Se corrigieron los rellenos de texto que no son sólidos (p. ej., mosaicos) en bloques recortados"
"- Fixed a crash for images with a DPI value of zero" = "- Se corrigió un fallo con imágenes con un valor de DPI igual a cero"
"- Fixed floating-point error in @gradient.repeat" = "- Se corrigió un error de punto flotante en @gradient.repeat"
"- Auto-detection of image formats from a raw buffer now has support for SVGs" = "- La detección automática del formato de imagen a partir de un búfer sin procesar ahora admite SVG"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Functions that accept file paths now also accept raw @bytes[bytes]" = "- Las funciones que aceptan rutas de archivo ahora también aceptan @bytes[bytes] sin procesar"
"- @image, @cbor, @csv, @json, @toml, @xml, and @yaml now support a path string or bytes and their `.decode` variants are deprecated" = "- @image, @cbor, @csv, @json, @toml, @xml y @yaml ahora admiten una cadena de ruta o bytes, y sus variantes `.decode` quedan obsoletas"
"- @plugin, @bibliography, @bibliography.style, @cite.style, @raw.theme, and @raw.syntaxes now accept bytes in addition to path strings. These did not have `.decode` variants, so this adds new flexibility." = "- @plugin, @bibliography, @bibliography.style, @cite.style, @raw.theme y @raw.syntaxes ahora aceptan bytes además de cadenas de ruta. Estos no tenían variantes `.decode`, así que esto agrega flexibilidad nueva."
"- The `path` argument/field of @image and @bibliography was renamed to `source` and `sources`, respectively *(Minor breaking change)*" = "- El argumento o campo `path` de @image y @bibliography se renombró a `source` y `sources`, respectivamente *(Cambio incompatible menor)*"
"- Improved WebAssembly @plugin[plugins]" = "- Se mejoraron los @plugin[plugins] de WebAssembly"
"- The `plugin` type is replaced by a @plugin[`plugin` function] that returns a @module[module] containing normal Typst functions. This module can be used with import syntax. *(Breaking change)*" = "- El tipo `plugin` se reemplaza por una @plugin[función `plugin`] que devuelve un @module[módulo] con funciones normales de Typst. Este módulo se puede usar con la sintaxis de importación. *(Cambio incompatible)*"
"- Plugins now automatically run in multiple threads without any changes by plugin authors" = "- Los plugins ahora se ejecutan automáticamente en varios hilos sin ningún cambio por parte de sus autores"
"- A new @plugin.transition API is introduced which allows plugins to run impure initialization in a way that doesn't break Typst's purity guarantees" = "- Se introduce una nueva API @plugin.transition que permite a los plugins ejecutar inicializaciones no puras de una manera que no rompe las garantías de pureza de Typst"
"- The variable name bound by a bare import (no renaming, no import list) is now determined statically and dynamic imports without `{as}` renaming (e.g. `{import \"ot\" + \"her.typ\"}`) are a hard error *(Breaking change)*" = "- El nombre de variable que enlaza una importación simple (sin renombrar ni lista de importación) ahora se determina de forma estática, y las importaciones dinámicas sin renombrar con `{as}` (p. ej., `{import \"ot\" + \"her.typ\"}`) son un error grave *(Cambio incompatible)*"
"- Values of the @arguments type can now be added with `+` and @reference:scripting:blocks[joined] in curly-braced code blocks" = "- Los valores del tipo @arguments ahora se pueden sumar con `+` y @reference:scripting:blocks[unir] en bloques de código entre llaves"
"- Functions in an element function's scope can now be called with method syntax, bringing elements and types closer (in anticipation of a future full unification of the two). Currently, this is only useful for @outline.entry as no other element function defines methods." = "- Las funciones del alcance de una función de elemento ahora se pueden llamar con sintaxis de método, lo que acerca los elementos y los tipos (en anticipación de una futura unificación total de ambos). Por ahora, esto solo es útil para @outline.entry, ya que ninguna otra función de elemento define métodos."
"- Added @calc.norm function" = "- Se agregó la función @calc.norm"
"- Added support for 32-bit floats in @float.from-bytes and @float.to-bytes" = "- Se agregó compatibilidad con flotantes de 32 bits en @float.from-bytes y @float.to-bytes"
"- The @decimal constructor now also accepts decimal values" = "- El constructor de @decimal ahora también acepta valores decimales"
"- Improved `repr` of @symbol[symbols], @arguments[arguments], and @type[types]" = "- Se mejoró el `repr` de @symbol[símbolos], @arguments[argumentos] y @type[tipos]"
"- Duplicate @symbol[symbol] variants and modifiers are now a hard error *(Breaking change)*" = "- Las variantes y los modificadores de @symbol[símbolos] duplicados ahora son un error grave *(Cambio incompatible)*"
"= Math <math>" = "= Matemática <math>"
"- Fixed a bug where single letter strings in math (`[$\"a\"$]`) would be displayed in italics" = "- Se corrigió un error por el cual las cadenas de una sola letra en matemática (`[$\"a\"$]`) se mostraban en cursiva"
"- Math function calls can now have hyphenated named arguments and support @arguments:spreading[argument spreading]" = "- Las llamadas a funciones matemáticas ahora pueden tener argumentos con nombre con guiones y admiten la @arguments:spreading[expansión de argumentos]"
"- Better looking accents thanks to support for the `flac` (Flattened Accent Forms) and `dtls` (Dotless Forms) OpenType features" = "- Acentos de mejor aspecto gracias a la compatibilidad con las características OpenType `flac` (formas de acento aplanadas) y `dtls` (formas sin punto)"
"- Added `lcm` @math.op[text operator]" = "- Se agregó el @math.op[operador de texto] `lcm`"
"- The @math.bold[`bold`] function now works with ϝ and Ϝ" = "- La función @math.bold[`bold`] ahora funciona con ϝ y Ϝ"
"- The @math.italic[`italic`] function now works with ħ" = "- La función @math.italic[`italic`] ahora funciona con ħ"
"- Fixed a bug where the extent of a math equation was wrongly affected by internal metadata" = "- Se corrigió un error por el cual la extensión de una ecuación matemática se veía afectada por error por metadatos internos"
"- Fixed interaction of @math.lr[`lr`] and @reference:context[context] expressions" = "- Se corrigió la interacción entre @math.lr[`lr`] y las expresiones de @reference:context[contexto]"
"- Fixed weak spacing being unconditionally ignored in @math.lr[`lr`]" = "- Se corrigió que el espaciado débil se ignorara incondicionalmente en @math.lr[`lr`]"
"- Fixed sub/superscripts sometimes being in the wrong position with @math.lr[`lr`]" = "- Se corrigió que los subíndices y superíndices a veces quedaran en la posición equivocada con @math.lr[`lr`]"
"- Fixed multi-line annotations (e.g. overbrace) changing the math baseline" = "- Se corrigió que las anotaciones de varias líneas (p. ej., overbrace) cambiaran la línea base matemática"
"- Fixed merging of attachments when the base is a nested equation" = "- Se corrigió la fusión de adjuntos cuando la base es una ecuación anidada"
"- Fixed resolving of contextual (em-based) text sizes within math" = "- Se corrigió la resolución de los tamaños de texto contextuales (basados en em) dentro de matemática"
"- Fixed spacing around up tacks (⊥)" = "- Se corrigió el espaciado alrededor de las tachuelas hacia arriba (⊥)"
"= Bibliography <bibliography>" = "= Bibliografía <bibliography>"
"- Prose and author-only citations now use editor names if the author names are unavailable" = "- Las citas en prosa y las de solo autor ahora usan los nombres de los editores si no están disponibles los nombres de los autores"
"- Some non-standard but widely used BibLaTeX `editortype`s like `producer`, `writer`, `scriptwriter`, and `none` (defined by widespread style `biblatex-chicago` to mean performers within `music` and `video` entries) are now recognized" = "- Ahora se reconocen algunos `editortype` de BibLaTeX no estándar pero de uso muy extendido, como `producer`, `writer`, `scriptwriter` y `none` (definido por el estilo difundido `biblatex-chicago` para indicar intérpretes en entradas de `music` y `video`)"
"- CSL styles can now render affixes around the bibliography" = "- Los estilos CSL ahora pueden renderizar afijos alrededor de la bibliografía"
"- For BibTeX entries with `eprinttype = {pubmed}`, the PubMed ID will now be correctly processed" = "- Para las entradas de BibTeX con `eprinttype = {pubmed}`, el ID de PubMed ahora se procesará correctamente"
"- Whitespace handling for strings delimiting initialized names has been improved" = "- Se mejoró el manejo de espacios en blanco en las cadenas que delimitan nombres abreviados con iniciales"
"- Uppercase spelling after apostrophes used as quotation marks is now possible" = "- Ahora es posible la escritura en mayúsculas después de los apóstrofos usados como comillas"
"- Fixed bugs around the handling of CSL delimiting characters" = "- Se corrigieron errores en el manejo de los caracteres delimitadores de CSL"
"- Fixed a problem with parsing multibyte characters in page ranges that could prevent Hayagriva from parsing some BibTeX page ranges" = "- Se corrigió un problema al analizar caracteres multibyte en rangos de páginas que podía impedir que Hayagriva analizara algunos rangos de páginas de BibTeX"
"- Updated CSL APA style" = "- Se actualizó el estilo CSL de APA"
"- Updated CSL locales for Finnish, Swiss German, Austrian German, German, and Arabic" = "- Se actualizaron las configuraciones regionales CSL de finés, alemán suizo, alemán austríaco, alemán y árabe"
"= Text <text>" = "= Texto <text>"
"- Added support for specifying which charset should be @text.font[covered] by which font family" = "- Se agregó compatibilidad para especificar qué juego de caracteres debe @text.font[cubrir] cada familia de fuentes"
"- Added @smallcaps.all[`all`] parameter to `smallcaps` function that also enables small capitals on uppercase letters" = "- Se agregó el parámetro @smallcaps.all[`all`] a la función `smallcaps`, que además activa las versalitas en las letras mayúsculas"
"- Added basic i18n for Basque and Bulgarian" = "- Se agregó internacionalización básica para vasco y búlgaro"
"- @par.justify[Justification] does not affect @raw[raw] blocks anymore" = "- La @par.justify[justificación] ya no afecta a los bloques @raw[raw]"
"- @text.cjk-latin-spacing[CJK-Latin-spacing] does not affect @raw[raw] text anymore" = "- El @text.cjk-latin-spacing[espaciado entre CJK y latín] ya no afecta al texto @raw[raw]"
"- Fixed wrong language codes being used for Greek and Ukrainian" = "- Se corrigieron los códigos de idioma erróneos que se usaban para griego y ucraniano"
"- Fixed default quotes for Croatian and Bulgarian" = "- Se corrigieron las comillas predeterminadas de croata y búlgaro"
"- Fixed crash in RTL text handling" = "- Se corrigió un fallo en el manejo de texto de derecha a izquierda"
"- Added support for @raw syntax highlighting for a few new languages: CFML, NSIS, and WGSL" = "- Se agregó compatibilidad con el resaltado de sintaxis de @raw para algunos lenguajes nuevos: CFML, NSIS y WGSL"
"- New font metadata exception for New Computer Modern Sans Math" = "- Nueva excepción de metadatos de fuente para New Computer Modern Sans Math"
"- Updated bundled New Computer Modern fonts to version 7.0.1" = "- Se actualizaron las fuentes New Computer Modern incluidas a la versión 7.0.1"
"= Layout <layout>" = "= Diseño <layout>"
"- Fixed various bugs with footnotes" = "- Se corrigieron varios errores con las notas al pie"
"- Fixed footnotes getting lost when multiple footnotes were nested within another footnote" = "- Se corrigió que se perdieran notas al pie cuando había varias anidadas dentro de otra nota al pie"
"- Fixed endless loops with empty and overlarge footnotes" = "- Se corrigieron bucles infinitos con notas al pie vacías y demasiado grandes"
"- Fixed crash with overlarge footnotes within a floating placement" = "- Se corrigió un fallo con notas al pie demasiado grandes dentro de una ubicación flotante"
"- Fixed sizing of quadratic shapes (@square and @circle)" = "- Se corrigió el dimensionamiento de las formas cuadráticas (@square y @circle)"
"- Fixed @block.sticky not working properly at the top of a container" = "- Se corrigió que @block.sticky no funcionara bien en la parte superior de un contenedor"
"- Fixed crash due to consecutive weak spacing" = "- Se corrigió un fallo por espaciados débiles consecutivos"
"- Fixed crash when a @block[block] or text have negative sizes" = "- Se corrigió un fallo cuando un @block[bloque] o un texto tienen tamaños negativos"
"- Fixed unnecessary hyphenations occurring in rare scenarios due to a bad interaction between padding and paragraph optimization" = "- Se corrigieron separaciones silábicas innecesarias que ocurrían en escenarios poco frecuentes por una mala interacción entre el relleno y la optimización de párrafos"
"- Fixed lone @cite[citations] in @align not becoming their own paragraph" = "- Se corrigió que las @cite[citas] sueltas dentro de @align no pasaran a ser su propio párrafo"
"= Syntax <syntax>" = "= Sintaxis <syntax>"
"- Top-level closing square brackets that do not have a matching opening square bracket are now a hard error *(Minor breaking change)*" = "- Los corchetes de cierre de nivel superior que no tienen un corchete de apertura correspondiente ahora son un error grave *(Cambio incompatible menor)*"
"- Adding a space between the identifier and the parentheses in a set rule is not allowed anymore *(Minor breaking change)*" = "- Ya no se permite agregar un espacio entre el identificador y los paréntesis en una regla set *(Cambio incompatible menor)*"
"- Numbers with a unit cannot have a base prefix anymore, e.g. `0b100000pt` is not allowed anymore. Previously, it was syntactically allowed but always resolved to a value of zero. *(Minor breaking change)*" = "- Los números con unidad ya no pueden tener un prefijo de base; por ejemplo, ya no se permite `0b100000pt`. Antes se permitía sintácticamente, pero siempre se resolvía a un valor de cero. *(Cambio incompatible menor)*"
"- Using `is` as an identifier will now warn as it might become a keyword in the future" = "- Usar `is` como identificador ahora produce una advertencia, porque podría convertirse en una palabra clave en el futuro"
"- Fixed minor whitespace handling bugs" = "- Se corrigieron errores menores en el manejo de espacios en blanco"
"- in math mode argument lists" = "- en las listas de argumentos del modo matemático"
"- at the end of headings" = "- al final de los títulos"
"- between a term list's term and description" = "- entre el término y la descripción de una lista de términos"
"- Fixed parsing of empty single line raw blocks with 3+ backticks and a language tag" = "- Se corrigió el análisis de bloques raw de una sola línea vacíos con 3 o más acentos graves y una etiqueta de lenguaje"
"- Fixed minor bug with parentheses parsing in math" = "- Se corrigió un error menor en el análisis de paréntesis en matemática"
"- Markup that can only appear at the start of the line (headings, lists) can now also appear at the start of a list item" = "- El marcado que solo puede aparecer al comienzo de la línea (títulos, listas) ahora también puede aparecer al comienzo de un elemento de lista"
"- A shebang `#!` at the very start of a file is now ignored" = "- Un shebang `#!` al comienzo mismo de un archivo ahora se ignora"
"= PDF export <pdf-export>" = "= Exportación a PDF <pdf-export>"
"- Added @pdf.attach[`pdf.embed`] function for embedding arbitrary files in the exported PDF" = "- Se agregó la función @pdf.attach[`pdf.embed`] para incrustar archivos arbitrarios en el PDF exportado"
"- Added support for PDF/A-3b export" = "- Se agregó compatibilidad con la exportación a PDF/A-3b"
"- The PDF timestamp will now contain the timezone by default" = "- La marca de tiempo del PDF ahora contendrá la zona horaria por defecto"
"= HTML export <html-export>" = "= Exportación a HTML <html-export>"
"*Note:* HTML export is currently under active development. The feature is still _very_ incomplete, but already available for experimentation behind a feature flag." = "*Nota:* La exportación a HTML está en pleno desarrollo. La característica todavía está _muy_ incompleta, pero ya se puede experimentar con ella detrás de un indicador de característica."
"- Added HTML output support for some (but not all) of the built-in elements" = "- Se agregó compatibilidad con salida HTML para algunos (pero no todos) de los elementos integrados"
"- Added @html.elem function for outputting an arbitrary HTML element" = "- Se agregó la función @html.elem para generar un elemento HTML arbitrario"
"- Added @html.frame function for integrating content that requires layout into HTML (by embedding an SVG)" = "- Se agregó la función @html.frame para integrar en HTML contenido que requiere diseño (incrustando un SVG)"
"- Added @target function which returns either `{\"paged\"}` or `{\"html\"}` depending on the export target" = "- Se agregó la función @target, que devuelve `{\"paged\"}` o `{\"html\"}` según el formato de exportación"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- Autocompletion improvements" = "- Mejoras en el autocompletado"
"- Added autocompletion for file paths" = "- Se agregó el autocompletado de rutas de archivo"
"- Smarter autocompletion of variables: Completing `{rect(fill: |)}` will now only show variables which contain a valid fill (either directly or nested, e.g. a dictionary containing a valid fill)" = "- Autocompletado de variables más inteligente: al completar `{rect(fill: |)}` ahora solo se mostrarán las variables que contengan un relleno válido (ya sea directamente o anidado, p. ej., un diccionario que contenga un relleno válido)"
"- Different functions will now autocomplete with different brackets (round vs square) depending on which kind is more useful" = "- Ahora las distintas funciones se autocompletan con distintos tipos de paréntesis (redondos o cuadrados) según cuál sea más útil"
"- Positional parameters which are already provided aren't autocompleted again anymore" = "- Los parámetros posicionales que ya se proporcionaron ya no se vuelven a autocompletar"
"- Fixed variable autocompletion not considering parameters" = "- Se corrigió que el autocompletado de variables no considerara los parámetros"
"- Added autocompletion snippets for common figure usages" = "- Se agregaron snippets de autocompletado para usos comunes de figuras"
"- Fixed autocompletion after half-completed import item" = "- Se corrigió el autocompletado después de un elemento de importación a medio completar"
"- Fixed autocompletion for `cite` function" = "- Se corrigió el autocompletado de la función `cite`"
"- Added warning when an unconditional return in a code block discards joined content" = "- Se agregó una advertencia cuando un return incondicional en un bloque de código descarta contenido unido"
"- Fixed error message when accessing non-existent label" = "- Se corrigió el mensaje de error al acceder a una etiqueta inexistente"
"- Fixed handling of nested imports in IDE functionality" = "- Se corrigió el manejo de importaciones anidadas en la funcionalidad del IDE"
"= Command Line Interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added `--features` argument and `TYPST_FEATURES` environment variable for opting into experimental features. The only feature so far is `html`." = "- Se agregaron el argumento `--features` y la variable de entorno `TYPST_FEATURES` para optar por características experimentales. La única característica hasta ahora es `html`."
"- Added a live reloading HTTP server to `typst watch` when targeting HTML" = "- Se agregó un servidor HTTP con recarga en vivo a `typst watch` cuando se apunta a HTML"
"- Fixed self-update not being aware about certain target architectures" = "- Se corrigió que la autoactualización no reconociera ciertas arquitecturas de destino"
"- Fixed crash when piping `typst fonts` output to another command" = "- Se corrigió un fallo al canalizar la salida de `typst fonts` a otro comando"
"- Fixed handling of relative paths in `--make-deps` output" = "- Se corrigió el manejo de rutas relativas en la salida de `--make-deps`"
"- Fixed handling of multipage SVG and PNG export in `--make-deps` output" = "- Se corrigió el manejo de la exportación a SVG y PNG de varias páginas en la salida de `--make-deps`"
"- Colons in filenames are now correctly escaped in `--make-deps` output" = "- Los dos puntos en los nombres de archivo ahora se escapan correctamente en la salida de `--make-deps`"
"= Symbols <symbols>" = "= Símbolos <symbols>"
"- New" = "- Nuevos"
"- Renamed *(Breaking change)*" = "- Renombrados *(Cambio incompatible)*"
"- Changed codepoint *(Breaking change)*" = "- Punto de código modificado *(Cambio incompatible)*"
"- `angle.l.double` from `《` to `⟪`" = "- `angle.l.double` de `《` a `⟪`"
"- `angle.r.double` from `》` to `⟫`" = "- `angle.r.double` de `》` a `⟫`"
"- `angstrom` from U+212B (`Å`) to U+00C5 (`Å`)" = "- `angstrom` de U+212B (`Å`) a U+00C5 (`Å`)"
"- Deprecated" = "- Obsoletos"
"- `sect` and all its variants in favor of `inter`" = "- `sect` y todas sus variantes, en favor de `inter`"
"- `integral.sect` in favor of `integral.inter`" = "- `integral.sect`, en favor de `integral.inter`"
"- Removed *(Breaking change)*" = "- Eliminados *(Cambio incompatible)*"
"- `degree.c` in favor of `°C` (`[$upright(°C)$]` or `[$upright(degree C)$]` in math)" = "- `degree.c`, en favor de `°C` (`[$upright(°C)$]` o `[$upright(degree C)$]` en matemática)"
"- `degree.f` in favor of `°F` (`[$upright(°F)$]` or `[$upright(degree F)$]` in math)" = "- `degree.f`, en favor de `°F` (`[$upright(°F)$]` o `[$upright(degree F)$]` en matemática)"
"- `kelvin` in favor of just K (`[$upright(K)$]` in math)" = "- `kelvin`, en favor de simplemente K (`[$upright(K)$]` en matemática)"
"- `ohm` in favor of `Omega`" = "- `ohm`, en favor de `Omega`"
"= Deprecations <deprecations>" = "= Obsolescencias <deprecations>"
"- The `path` function in favor of the @curve function" = "- La función `path`, en favor de la función @curve"
"- The name `pattern` for tiling patterns in favor of the new name @tiling" = "- El nombre `pattern` para los patrones de mosaico, en favor del nuevo nombre @tiling"
"- `image.decode`, `cbor.decode`, `csv.decode`, `json.decode`, `toml.decode`, `xml.decode`, `yaml.decode` in favor of the top-level functions directly accepting both paths and bytes" = "- `image.decode`, `cbor.decode`, `csv.decode`, `json.decode`, `toml.decode`, `xml.decode`, `yaml.decode`, en favor de que las funciones de nivel superior acepten directamente tanto rutas como bytes"
"- The `sect` and its variants in favor of `inter`, and `integral.sect` in favor of `integral.inter`" = "- `sect` y sus variantes, en favor de `inter`, y `integral.sect`, en favor de `integral.inter`"
"- The compatibility behavior of type/str comparisons (e.g. `{int == \"integer\"}`) which was temporarily introduced in Typst 0.8 now emits warnings. It will be removed in Typst 0.14." = "- El comportamiento de compatibilidad de las comparaciones entre tipo y cadena de texto (p. ej., `{int == \"integer\"}`), que se introdujo temporalmente en Typst 0.8, ahora emite advertencias. Se eliminará en Typst 0.14."
"= Removals <removals>" = "= Eliminaciones <removals>"
"- Removed `style` function and `styles` argument of @measure, use a @reference:context[context] expression instead *(Breaking change)*" = "- Se eliminaron la función `style` y el argumento `styles` de @measure; usá en su lugar una expresión de @reference:context[contexto] *(Cambio incompatible)*"
"- Removed `state.display` function, use @state.get instead *(Breaking change)*" = "- Se eliminó la función `state.display`; usá @state.get en su lugar *(Cambio incompatible)*"
"- Removed `location` argument of @state.at, @counter.at, and @query *(Breaking change)*" = "- Se eliminó el argumento `location` de @state.at, @counter.at y @query *(Cambio incompatible)*"
"- Removed compatibility behavior where @counter.display worked without @reference:context[context] *(Breaking change)*" = "- Se eliminó el comportamiento de compatibilidad por el cual @counter.display funcionaba sin @reference:context[contexto] *(Cambio incompatible)*"
"- Removed compatibility behavior of @locate *(Breaking change)*" = "- Se eliminó el comportamiento de compatibilidad de @locate *(Cambio incompatible)*"
"= Development <development>" = "= Desarrollo <development>"
"- The `typst::compile` function is now generic and can return either a `PagedDocument` or an `HtmlDocument`" = "- La función `typst::compile` ahora es genérica y puede devolver un `PagedDocument` o un `HtmlDocument`"
"- `typst-timing` now supports WebAssembly targets via `web-sys` when the `wasm` feature is enabled" = "- `typst-timing` ahora admite destinos WebAssembly mediante `web-sys` cuando está habilitada la característica `wasm`"
"- Increased minimum supported Rust version to 1.80" = "- Se aumentó la versión mínima admitida de Rust a 1.80"
"- Fixed linux/arm64 Docker image" = "- Se corrigió la imagen de Docker para linux/arm64"

"- Math font autocompletions are now based on the presence of an OpenType MATH table instead of the word \"Math\" in the name #pr(6316)" = "- Los autocompletados de fuentes matemáticas ahora se basan en la presencia de una tabla MATH de OpenType y no en la palabra \"Math\" en el nombre #pr(6316)"
"- Autocompletion immediately after a comma in a parameter list is now supported for explicitly triggered completions (e.g. via Ctrl/Cmd+Space) #pr(6550)" = "- El autocompletado inmediatamente después de una coma en una lista de parámetros ahora se admite para autocompletados disparados explícitamente (p. ej., con Ctrl/Cmd+Espacio) #pr(6550)"
"- Citation style aliases are now displayed as autocompletions #pr(6696)" = "- Los alias de estilos de cita ahora se muestran como autocompletados #pr(6696)"
"- Fixed autocompletion false positives with cursor after parameter list #pr(6475)" = "- Se corrigieron falsos positivos del autocompletado con el cursor después de la lista de parámetros #pr(6475)"
"- Fixed autocompletion after partial identifier in math #pr(6415)" = "- Se corrigió el autocompletado después de un identificador parcial en matemática #pr(6415)"
"- Fixed which definitions are suggested in math #pr(6415)" = "- Se corrigió qué definiciones se sugieren en matemática #pr(6415)"
"- Fixed inapplicable method autocompletions being listed #pr(5824)" = "- Se corrigió que se listaran autocompletados de métodos que no aplican #pr(5824)"
"- Tooltips" = "- Tooltips"
"- Fixed tooltip for scoped functions (e.g. `calc.round`) #pr(6234)" = "- Se corrigió el tooltip de las funciones con alcance (p. ej., `calc.round`) #pr(6234)"
"- Fixed tooltip and details for figure references #pr(6580)" = "- Se corrigieron el tooltip y los detalles de las referencias a figuras #pr(6580)"
"- Expression tooltips now use `×` instead of `x` to indicate a repeated value #pr(6163)" = "- Los tooltips de expresiones ahora usan `×` en lugar de `x` para indicar un valor repetido #pr(6163)"
"- Fixed jump from click (jumping to the source panel with a click in the preview) in presence of transformations and clipping #pr(6037)" = "- Se corrigió el salto desde un clic (saltar al panel de código fuente con un clic en la vista previa) en presencia de transformaciones y recortes #pr(6037)"
"= Symbols <symbols>" = "= Símbolos <symbols>"
"- Added many new symbols and variants; many more than could be listed here. View #link(\"https://github.com/typst/codex/blob/v0.2.0/CHANGELOG.md#version-020-october-7-2025\")[the dedicated changelog] for a full listing." = "- Se agregaron muchos símbolos y variantes nuevos; muchos más de los que se pueden enumerar acá. Mirá #link(\"https://github.com/typst/codex/blob/v0.2.0/CHANGELOG.md#version-020-october-7-2025\")[el registro de cambios específico] para ver la lista completa."
"- Code points that have a symbol and emoji presentation now have the correct variation selector attached depending on whether they appear in `sym` or `emoji`. That said, they still don't render consistently in Typst due to how font fallback works. #pr(114, repo: \"typst/codex\")" = "- Los puntos de código que tienen presentación de símbolo y de emoji ahora llevan el selector de variación correcto según aparezcan en `sym` o en `emoji`. Dicho esto, igualmente no se renderizan de forma consistente en Typst por cómo funciona la fuente de reserva. #pr(114, repo: \"typst/codex\")"
"- The @symbol function can now be used to create symbols that comprise not just one character, but one full grapheme cluster #pr(6489)" = "- La función @symbol ahora se puede usar para crear símbolos que comprenden no solo un carácter, sino un grafema completo #pr(6489)"
"= Deprecations <deprecations>" = "= Obsolescencias <deprecations>"
"- The name `pdf.embed` in favor of the new name @pdf.attach #pr(6705)" = "- El nombre `pdf.embed`, en favor del nuevo nombre @pdf.attach #pr(6705)"
"- The `{\"chicago-fullnotes\"}` bibliography style in favor of `{\"chicago-notes\"}` #pr(6920)" = "- El estilo de bibliografía `{\"chicago-fullnotes\"}`, en favor de `{\"chicago-notes\"}` #pr(6920)"
"- The `{\"modern-humanities-research-association\"}` bibliography style in favor of `{\"modern-humanities-research-association-notes\"}` #pr(6994)" = "- El estilo de bibliografía `{\"modern-humanities-research-association\"}`, en favor de `{\"modern-humanities-research-association-notes\"}` #pr(6994)"
"- The `--make-deps` CLI flag in favor of `--deps` with `--deps-format make` #pr(7022)" = "- El indicador de CLI `--make-deps`, en favor de `--deps` con `--deps-format make` #pr(7022)"
"- Various symbols, see the #link(\"https://github.com/typst/codex/blob/v0.2.0/CHANGELOG.md#deprecated\")[deprecation section in the dedicated changelog] for a full listing" = "- Varios símbolos; ver la #link(\"https://github.com/typst/codex/blob/v0.2.0/CHANGELOG.md#deprecated\")[sección de obsolescencias del registro de cambios específico] para la lista completa"
"= Removals <removals>" = "= Eliminaciones <removals>"
"- Removed compatibility behavior of type/str comparisons (e.g. `{int == \"integer\"}`), which was temporarily introduced in Typst 0.8 and deprecated in Typst 0.13 *(Breaking change)*" = "- Se eliminó el comportamiento de compatibilidad de las comparaciones entre tipo y cadena de texto (p. ej., `{int == \"integer\"}`), que se había introducido temporalmente en Typst 0.8 y se declaró obsoleto en Typst 0.13 *(Cambio incompatible)*"
"= Development <development>" = "= Desarrollo <development>"
"- The `Default` impl for `Library` had to be removed for crate splitting and trait coherence reasons, but you can get a drop-in replacement via `use typst::LibraryExt` #pr(6576)" = "- La implementación de `Default` para `Library` tuvo que eliminarse por razones de división de crates y coherencia de traits, pero podés obtener un reemplazo directo con `use typst::LibraryExt` #pr(6576)"
"- The `PdfOptions` struct has a new `tagged` field, which defaults to `{true}` #pr(6619) #pr(7046)" = "- La estructura `PdfOptions` tiene un nuevo campo `tagged`, que por defecto es `{true}` #pr(6619) #pr(7046)"
"- Fixed a potential panic in `World::font` implementations. Downstream `World` implementations might need to apply #link(\"https://github.com/typst/typst/pull/6117\")[the same fix]. #pr(6117)" = "- Se corrigió un posible pánico en las implementaciones de `World::font`. Las implementaciones de `World` posteriores quizás deban aplicar #link(\"https://github.com/typst/typst/pull/6117\")[la misma corrección]. #pr(6117)"
"- Increased minimum supported Rust version to 1.88 #pr(6637)" = "- Se aumentó la versión mínima admitida de Rust a 1.88 #pr(6637)"
"- The Docker container now has the optional non-root user `typst` #pr(7058)" = "- El contenedor Docker ahora tiene el usuario opcional sin privilegios de root `typst` #pr(7058)"

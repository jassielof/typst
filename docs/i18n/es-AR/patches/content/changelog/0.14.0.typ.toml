# Line patches for docs/content/changelog/0.14.0.typ (see docs/src/i18n.rs).
"= Highlights <highlights>" = "= Novedades destacadas <highlights>"
"- Typst now produces @guides:accessibility[_accessible_ PDFs] out of the box, with opt-in support for stricter checks and conformance to PDF/UA-1" = "- Typst ahora produce de forma nativa PDF @guides:accessibility[_accesibles_], con soporte opcional para verificaciones más estrictas y conformidad con PDF/UA-1"
"- Typst now supports all @pdf.standard:pdf-a[PDF/A standards]" = "- Typst ahora admite todos los @pdf.standard:pdf-a[estándares PDF/A]"
"- PDFs can now be used as @image.format[images] (thanks to #gh(\"LaurenzV\"))" = "- Ahora se pueden usar PDF como @image.format[imágenes] (gracias a #gh(\"LaurenzV\"))"
"- Added support for @par.justification-limits[character-level justification] (can significantly improve the appearance of justified text)" = "- Se agregó compatibilidad con la @par.justification-limits[justificación por carácter] (puede mejorar mucho el aspecto del texto justificado)"
"- Added support for many more built-in elements in HTML export" = "- Se agregó compatibilidad con muchos más elementos integrados en la exportación a HTML"
"- Added typed HTML API (e.g. @html.div) with individually typed attributes" = "- Se agregó una API HTML tipada (p. ej., @html.div) con atributos tipados individualmente"
"- Added support for multiple @table.header[headers] and subheaders in tables" = "- Se agregó compatibilidad con varios @table.header[encabezados] y subencabezados en las tablas"
"- Added @title element for displaying the document title" = "- Se agregó el elemento @title para mostrar el título del documento"
"- Added @math.frac.style[`frac.style`] property for producing skewed and inline fractions" = "- Se agregó la propiedad @math.frac.style[`frac.style`] para producir fracciones oblicuas y en línea"
"= PDF export <pdf-export>" = "= Exportación a PDF <pdf-export>"
"PDF export was fully rewritten to use the new #link(\"https://github.com/LaurenzV/krilla\")[`krilla`] library, fixing various bugs and enabling many improvements. Known fixes are listed below, but there will likely be other changes in how the output behaves. If you spot any regressions, please #link(\"https://github.com/typst/typst/issues\")[report them on GitHub]. _(Thanks to #gh(\"LaurenzV\") for creating krilla!)_ #pr(5420)" = "La exportación a PDF se reescribió por completo para usar la nueva biblioteca #link(\"https://github.com/LaurenzV/krilla\")[`krilla`], lo que corrige varios errores y permite muchas mejoras. Más abajo se enumeran las correcciones conocidas, pero probablemente haya otros cambios en el comportamiento de la salida. Si detectás alguna regresión, por favor #link(\"https://github.com/typst/typst/issues\")[reportala en GitHub]. _(¡Gracias a #gh(\"LaurenzV\") por crear krilla!)_ #pr(5420)"
"- Typst now produces _accessible_ PDFs out of the box. Such documents are suitable for consumption in a wide range of circumstances. That not only includes consumption by people with permanent or temporary disabilities, but also by those with different devices or preferences." = "- Typst ahora produce PDF _accesibles_ de forma nativa. Esos documentos son aptos para su consumo en una amplia variedad de circunstancias. Eso no incluye solo el consumo por parte de personas con discapacidades permanentes o temporales, sino también de quienes usan otros dispositivos o tienen otras preferencias."
"- Typst PDFs are now _tagged_ by default. _Tags_ are rich metadata that PDF viewers can use to make the document consumable in other ways than visually (e.g., through a screen reader)." = "- Los PDF de Typst ahora están _etiquetados_ por defecto. Las _etiquetas_ (tags) son metadatos enriquecidos que los visores de PDF pueden usar para que el documento se pueda consumir de otras formas además de la visual (p. ej., mediante un lector de pantalla)."
"- In addition, Typst can now emit documents conforming to the PDF/UA-1 standard. (PDF/UA-2 is not yet supported, but planned.)" = "- Además, Typst ahora puede emitir documentos conformes con el estándar PDF/UA-1. (PDF/UA-2 todavía no está admitido, pero está planeado.)"
"- There is an increasing amount of existing and upcoming legislation requiring documents to be accessible, for instance, the European Accessibility Act and the Americans with Disabilities Act." = "- Cada vez hay más legislación vigente y futura que exige que los documentos sean accesibles, por ejemplo, la Ley Europea de Accesibilidad y la Ley de Estadounidenses con Discapacidades."
"- For more details on all of this, read the new @guides:accessibility[Accessibility Guide]." = "- Para más detalles sobre todo esto, leé la nueva @guides:accessibility[Guía de accesibilidad]."
"- Typst now supports all PDF/A standards: PDF/A-1b, PDF/A-1a, PDF/A-2b, PDF/A-2u, PDF/A-2a, PDF/A-3b, PDF/A-3u, PDF/A-3a, PDF/A-4, PDF/A-4f, and PDF/A-4e. See the @pdf.standard:pdf-a[expanded PDF/A documentation] for guidance on how to select a suitable standard. #pr(5420) #pr(7038)" = "- Typst ahora admite todos los estándares PDF/A: PDF/A-1b, PDF/A-1a, PDF/A-2b, PDF/A-2u, PDF/A-2a, PDF/A-3b, PDF/A-3u, PDF/A-3a, PDF/A-4, PDF/A-4f y PDF/A-4e. Consultá la @pdf.standard:pdf-a[documentación ampliada de PDF/A] para saber cómo elegir un estándar adecuado. #pr(5420) #pr(7038)"
"- Typst now supports the PDF versions 1.4, 1.5, 1.6, and 2.0 in addition to PDF 1.7. See the @pdf.standard:pdf-versions[relevant section of the PDF documentation] for details. #pr(5420)" = "- Typst ahora admite las versiones de PDF 1.4, 1.5, 1.6 y 2.0, además de PDF 1.7. Consultá la @pdf.standard:pdf-versions[sección correspondiente de la documentación de PDF] para ver los detalles. #pr(5420)"
"- Added @pdf.artifact function for marking content as not semantically meaningful #pr(6619)" = "- Se agregó la función @pdf.artifact para marcar contenido como carente de significado semántico #pr(6619)"
"- Added experimental @pdf.header-cell, @pdf.data-cell, and @pdf.table-summary functions for enhancing accessibility of documents with complex tables. These functions are guarded by the `a11y-extras` feature. They do not have a final interface and will be removed in the future, either through integration into table functions or through full removal. #pr(6619)" = "- Se agregaron las funciones experimentales @pdf.header-cell, @pdf.data-cell y @pdf.table-summary para mejorar la accesibilidad de documentos con tablas complejas. Estas funciones están protegidas por la característica `a11y-extras`. No tienen una interfaz definitiva y se eliminarán en el futuro, ya sea integrándolas en las funciones de tablas o eliminándolas por completo. #pr(6619)"
"- PDF heading bookmarks now contain the heading's numbering #pr(6622)" = "- Los marcadores de títulos del PDF ahora contienen la numeración del título #pr(6622)"
"- @pdf.attach[Attachments]" = "- @pdf.attach[Archivos adjuntos]"
"- Renamed `pdf.embed` to @pdf.attach (the old name will remain as a deprecated alias until Typst 0.15) #pr(6705)" = "- Se renombró `pdf.embed` a @pdf.attach (el nombre anterior seguirá existiendo como alias obsoleto hasta Typst 0.15) #pr(6705)"
"- The @pdf.attach.mime-type[`mime`] property of `pdf.attach` is now checked for syntactical correctness *(Minor breaking change)*" = "- Ahora se comprueba la corrección sintáctica de la propiedad @pdf.attach.mime-type[`mime`] de `pdf.attach` *(Cambio incompatible menor)*"
"- Fixed parsing of the @pdf.attach.data[`data`] argument of `pdf.attach` #pr(6435)" = "- Se corrigió el análisis del argumento @pdf.attach.data[`data`] de `pdf.attach` #pr(6435)"
"- Attachments now smartly determine whether they should be compressed #pr(6256)" = "- Los archivos adjuntos ahora determinan de forma inteligente si deben comprimirse #pr(6256)"
"- Text extraction (i.e. copy paste)" = "- Extracción de texto (es decir, copiar y pegar)"
"- Now works correctly even when multiple different characters result in the same glyph #pr(5420)" = "- Ahora funciona correctamente incluso cuando varios caracteres distintos dan como resultado el mismo glifo #pr(5420)"
"- Spaces between words at which a natural line break occurred are now correctly retained for text extraction #pr(6866)" = "- Los espacios entre palabras en los que se produjo un salto de línea natural ahora se conservan correctamente para la extracción de texto #pr(6866)"
"- Fixed mapping of hyphenation artifacts to Unicode text #pr(6799)" = "- Se corrigió la asignación de los artefactos de separación silábica a texto Unicode #pr(6799)"
"- Images" = "- Imágenes"
"- CMYK images now work properly in PDF export #pr(5420)" = "- Las imágenes CMYK ahora funcionan correctamente en la exportación a PDF #pr(5420)"
"- Improved export of text in SVG images with a filter #pr(5420)" = "- Se mejoró la exportación de texto en imágenes SVG con un filtro #pr(5420)"
"- Improved compatibility of SVG images with Quartz rendering engine (the engine used in Apple Preview) #pr(5420)" = "- Se mejoró la compatibilidad de las imágenes SVG con el motor de renderizado Quartz (el que usa Vista Previa de Apple) #pr(5420)"
"- Improved handling of SVG images with high group nesting depth #pr(5420)" = "- Se mejoró el manejo de imágenes SVG con gran profundidad de anidamiento de grupos #pr(5420)"
"- Fixed a bug with text in patterns #pr(5420)" = "- Se corrigió un error con el texto en patrones #pr(5420)"
"- Fixed gradients with transparency #pr(5420)" = "- Se corrigieron los degradés con transparencia #pr(5420)"
"= HTML export <html-export>" = "= Exportación a HTML <html-export>"
"- Added support for many more built-in elements (the @reference:model[_Model_ category] is now fully covered)" = "- Se agregó compatibilidad con muchos más elementos integrados (ahora la @reference:model[categoría _Modelo_] está totalmente cubierta)"
"- The @image element #pr(6578)" = "- El elemento @image #pr(6578)"
"- The @footnote and @footnote.entry element #pr(6917)" = "- Los elementos @footnote y @footnote.entry #pr(6917)"
"- The @outline and @outline.entry element #pr(6606)" = "- Los elementos @outline y @outline.entry #pr(6606)"
"- The @bibliography element #pr(6952)" = "- El elemento @bibliography #pr(6952)"
"- The @smartquote element #pr(6710)" = "- El elemento @smartquote #pr(6710)"
"- The @sub and @super elements #pr(6422)" = "- Los elementos @sub y @super #pr(6422)"
"- The @underline, @overline, @strike, and @highlight elements #pr(6510)" = "- Los elementos @underline, @overline, @strike y @highlight #pr(6510)"
"- The @smallcaps element #pr(6600)" = "- El elemento @smallcaps #pr(6600)"
"- The @lower and @upper functions #pr(6585)" = "- Las funciones @lower y @upper #pr(6585)"
"- Added typed HTML API (e.g. @html.div) with individually typed attributes #pr(6476)" = "- Se agregó una API HTML tipada (p. ej., @html.div) con atributos tipados individualmente #pr(6476)"
"- For example, to generate a `video` element you can now write `[#html.video(width: 400, src: \"sunrise.mp4\")]` instead of `[#html.elem(\"video\", attrs: (width: \"400\", src: \"sunrise.mp4\"))]`. Note how the `width` attribute takes an integer instead of a string." = "- Por ejemplo, para generar un elemento `video` ahora podés escribir `[#html.video(width: 400, src: \"sunrise.mp4\")]` en lugar de `[#html.elem(\"video\", attrs: (width: \"400\", src: \"sunrise.mp4\"))]`. Fijate que el atributo `width` toma un entero en lugar de una cadena de texto."
"- Added support for intra-doc @link targets #pr(6602)" = "- Se agregó compatibilidad con destinos de @link dentro del mismo documento #pr(6602)"
"- The @raw element" = "- El elemento @raw"
"- Added syntax highlighting support #pr(6691)" = "- Se agregó compatibilidad con resaltado de sintaxis #pr(6691)"
"- Block-level `raw` elements now emit both a `<code>` and a `<pre>` tag #pr(6701)" = "- Los elementos `raw` de bloque ahora emiten tanto una etiqueta `<code>` como una `<pre>` #pr(6701)"
"- The @raw.lang[language tag] of `raw` elements is now preserved as a `data-lang` attribute on the `<code>` tag #pr(6702)" = "- La @raw.lang[etiqueta de lenguaje] de los elementos `raw` ahora se conserva como atributo `data-lang` en la etiqueta `<code>` #pr(6702)"
"- The @document.author[`authors`] and @document.keywords[`keywords`] properties of the `document` function now yield corresponding HTML `<meta>` tags #pr(6134)" = "- Las propiedades @document.author[`authors`] y @document.keywords[`keywords`] de la función `document` ahora producen las etiquetas HTML `<meta>` correspondientes #pr(6134)"
"- The @html.elem function now supports custom HTML element names #pr(6676)" = "- La función @html.elem ahora admite nombres de elementos HTML personalizados #pr(6676)"
"- Improved encoding of @html.frame #pr(6605)" = "- Se mejoró la codificación de @html.frame #pr(6605)"
"- Empty attributes are now encoded with shorthand syntax (e.g. ```html <div hidden></div>```) #pr(6479)" = "- Los atributos vacíos ahora se codifican con sintaxis abreviada (p. ej., ```html <div hidden></div>```) #pr(6479)"
"- Zero-sized horizontal weak spacing (`{h(0pt, weak: true)}`) does not cause a \"was ignored during HTML export\" warning anymore, so it can be used to destruct surrounding spaces without producing any output, as in paged export #pr(6917)" = "- El espaciado horizontal débil de tamaño cero (`{h(0pt, weak: true)}`) ya no causa la advertencia \"was ignored during HTML export\", por lo que se puede usar para eliminar los espacios circundantes sin producir ninguna salida, como en la exportación paginada #pr(6917)"
"- Fixed encoding of `<pre>` and `<textarea>` elements that start with a newline #pr(6487) #pr(6497)" = "- Se corrigió la codificación de los elementos `<pre>` y `<textarea>` que empiezan con un salto de línea #pr(6487) #pr(6497)"
"- Fixed encoding of #link(\"https://html.spec.whatwg.org/#raw-text-elements\")[raw text elements] #pr(6487) #pr(6720)" = "- Se corrigió la codificación de los #link(\"https://html.spec.whatwg.org/#raw-text-elements\")[elementos de texto sin procesar] #pr(6487) #pr(6720)"
"- Fixed sizing of @html.frame #pr(6505)" = "- Se corrigió el dimensionamiento de @html.frame #pr(6505)"
"- Fixed @measure in HTML export #pr(7186)" = "- Se corrigió @measure en la exportación a HTML #pr(7186)"
"- Fixed nested @html.frame[`html.frame`s] #pr(6509)" = "- Se corrigieron los @html.frame[`html.frame`] anidados #pr(6509)"
"- Fixed that a @box without a body was ignored in HTML export #pr(6709)" = "- Se corrigió que un @box sin cuerpo se ignorara en la exportación a HTML #pr(6709)"
"- Fixed encoding of whitespace in HTML #pr(6750)" = "- Se corrigió la codificación de los espacios en blanco en HTML #pr(6750)"
"= SVG export <svg-export>" = "= Exportación a SVG <svg-export>"
"- Added support for COLR-flavored color glyphs #pr(6693)" = "- Se agregó compatibilidad con glifos de color de tipo COLR #pr(6693)"
"- Reduced amount of `<g>` grouping elements that are generated #pr(6247)" = "- Se redujo la cantidad de elementos de agrupación `<g>` que se generan #pr(6247)"
"= PNG export <png-export>" = "= Exportación a PNG <png-export>"
"- Fixed crash when @text.size[text size] is negative #pr(7004)" = "- Se corrigió un fallo cuando el @text.size[tamaño del texto] es negativo #pr(7004)"
"= Visualize <visualize>" = "= Visualización <visualize>"
"- Added support for using PDFs as @image[images] using the new #link(\"https://github.com/LaurenzV/hayro\")[`hayro`] library. PDFs will be embedded directly in PDF export, rasterized in PNG export, and turned into SVGs in SVG and HTML export. _(Thanks to #gh(\"LaurenzV\") for creating hayro!)_ #pr(6623)" = "- Se agregó compatibilidad para usar PDF como @image[imágenes] mediante la nueva biblioteca #link(\"https://github.com/LaurenzV/hayro\")[`hayro`]. Los PDF se incrustan directamente en la exportación a PDF, se rasterizan en la exportación a PNG y se convierten en SVG en las exportaciones a SVG y HTML. _(¡Gracias a #gh(\"LaurenzV\") por crear hayro!)_ #pr(6623)"
"- Added support for WebP images #pr(6311)" = "- Se agregó compatibilidad con imágenes WebP #pr(6311)"
"- Various minor improvements for SVG images (see the #link(\"https://github.com/linebender/resvg/blob/v0.45.1/CHANGELOG.md#0450---2025-02-26\")[resvg 0.44 and 0.45 changelogs])" = "- Varias mejoras menores para imágenes SVG (ver los #link(\"https://github.com/linebender/resvg/blob/v0.45.1/CHANGELOG.md#0450---2025-02-26\")[registros de cambios de resvg 0.44 y 0.45])"
"- SVG images can now refer to external image files #pr(6794)" = "- Las imágenes SVG ahora pueden referirse a archivos de imagen externos #pr(6794)"
"- Clip paths are now properly anti-aliased #pr(6570)" = "- Los trazados de recorte ahora tienen un suavizado de bordes (anti-aliasing) correcto #pr(6570)"
"- Fixed gradients on curves where the last segment is @curve.line #pr(6647)" = "- Se corrigieron los degradés en curvas cuyo último segmento es @curve.line #pr(6647)"
"- Fixed stroke cap handling of shapes with partial strokes #pr(5688)" = "- Se corrigió el manejo de las terminaciones de trazo en formas con trazos parciales #pr(5688)"
"- Fixed corner radius handling of shapes with partial strokes #pr(6976)" = "- Se corrigió el manejo del radio de las esquinas en formas con trazos parciales #pr(6976)"
"- Fixed crash when sampling across two coinciding gradient stops #pr(6166)" = "- Se corrigió un fallo al muestrear entre dos paradas de degradé coincidentes #pr(6166)"
"= Layout <layout>" = "= Diseño <layout>"
"- Added opt-in support for character-level justification in addition to word-level justification, configured via the new @par.justification-limits property. This is an impactful microtypographical technique that can significantly improve the appearance of justified text. #pr(6161)" = "- Se agregó compatibilidad opcional con la justificación por carácter, además de la justificación por palabra, que se configura con la nueva propiedad @par.justification-limits. Es una técnica microtipográfica de gran impacto que puede mejorar mucho el aspecto del texto justificado. #pr(6161)"
"- Fixed wrong linebreak opportunities related to object replacement characters #pr(6251)" = "- Se corrigieron oportunidades de salto de línea erróneas relacionadas con los caracteres de reemplazo de objetos #pr(6251)"
"- Fixed an issue where a breakable block would still produce an empty segment even if nothing fit into the first segment, leading to various undesirable behaviors in combination with fills, strokes, and @block.sticky[stickiness] #pr(6335)" = "- Se corrigió un problema por el cual un bloque divisible entre páginas igualmente producía un segmento vacío aunque no entrara nada en el primer segmento, lo que causaba varios comportamientos indeseados en combinación con rellenos, trazos y @block.sticky[adherencia] #pr(6335)"
"- Fixed crash with set rule for column or rowspan on a grid cell #pr(6401)" = "- Se corrigió un fallo con una regla set de columnas o filas combinadas en una celda de grilla #pr(6401)"
"- Fixed @text.cjk-latin-spacing[CJK-Latin-spacing] at manual line breaks #pr(6700) and at sub- and superscript boundaries #pr(7175)" = "- Se corrigió el @text.cjk-latin-spacing[espaciado entre CJK y latín] en saltos de línea manuales #pr(6700) y en los límites de subíndices y superíndices #pr(7175)"
"= Math <math>" = "= Matemática <math>"
"- Added @math.frac.style[`frac.style`] property with new options for skewed and inline fractions #pr(6672)" = "- Se agregó la propiedad @math.frac.style[`frac.style`] con nuevas opciones para fracciones oblicuas y en línea #pr(6672)"
"- Added @math.equation.alt property for setting an alternative description for an equation #pr(6619)" = "- Se agregó la propiedad @math.equation.alt para establecer una descripción alternativa de una ecuación #pr(6619)"
"- Text handling" = "- Manejo de texto"
"- A single equation can now use multiple fonts #pr(6365)" = "- Una misma ecuación ahora puede usar varias fuentes #pr(6365)"
"- Glyph layout in math now uses proper text shaping, leading to better handling of more complex Unicode features #pr(6336)" = "- El diseño de glifos en matemática ahora usa un modelado de texto (text shaping) adecuado, lo que permite manejar mejor las características más complejas de Unicode #pr(6336)"
"- Generated characters in an equation (e.g. the `√` produced by `sqrt`) can now be targeted by text show rules #pr(6365)" = "- Los caracteres generados en una ecuación (p. ej., el `√` que produce `sqrt`) ahora pueden ser el objetivo de reglas show de texto #pr(6365)"
"- Added @math.scr[`scr`] function for roundhand script font style #pr(6309)" = "- Se agregó la función @math.scr[`scr`] para el estilo de fuente script de caligrafía redondeada #pr(6309)"
"- Added `dotless` parameter to @math.accent[`accent`] (typically for rendering a dotless accented i or j) #pr(5939)" = "- Se agregó el parámetro `dotless` a @math.accent[`accent`] (normalmente para renderizar una i o una j acentuadas sin punto) #pr(5939)"
"- Script-style glyphs are now preferred at reduced math sizes #pr(6320)" = "- Ahora se prefieren los glifos de estilo script en tamaños matemáticos reducidos #pr(6320)"
"- Fixed @text.stroke in math #pr(6243)" = "- Se corrigió @text.stroke en matemática #pr(6243)"
"- Broken glyph assemblies are now prevented even when font data is incorrect #pr(6688)" = "- Ahora se evitan los ensamblajes de glifos rotos incluso cuando los datos de la fuente son incorrectos #pr(6688)"
"- Layout" = "- Diseño"
"- Fixed a bug with vertical accent positioning #pr(5941)" = "- Se corrigió un error en el posicionamiento vertical de los acentos #pr(5941)"
"- Fixed positioning of bottom accents #pr(6187)" = "- Se corrigió el posicionamiento de los acentos inferiores #pr(6187)"
"- Fixed a bug with layout of roots #pr(6021)" = "- Se corrigió un error en el diseño de las raíces #pr(6021)"
"- Improved layout of @math.vec[`vec`] and @math.cases[`cases`], making it consistent with @math.mat[`mat`] #pr(5934)" = "- Se mejoró el diseño de @math.vec[`vec`] y @math.cases[`cases`], para que sea coherente con @math.mat[`mat`] #pr(5934)"
"- Removed linebreak opportunity before closing bracket in inline math #pr(6216)" = "- Se eliminó la oportunidad de salto de línea antes de un paréntesis de cierre en la matemática en línea #pr(6216)"
"- An @math.mat.augment[`augment`] line can now exist at the start and end of a matrix, not only in between columns and rows #pr(5806)" = "- Ahora puede haber una línea @math.mat.augment[`augment`] al comienzo y al final de una matriz, no solo entre columnas y filas #pr(5806)"
"- Shorthands and multi-character numbers do not bind more tightly than fractions anymore in cases like `[$x>=(y)/z$]` #pr(5925) #pr(5996) *(Minor breaking change)*" = "- Los atajos y los números de varios caracteres ya no se unen más fuerte que las fracciones en casos como `[$x>=(y)/z$]` #pr(5925) #pr(5996) *(Cambio incompatible menor)*"
"- Named arguments passed to symbols used as function now raise an error instead of being silently ignored #pr(6192) *(Minor breaking change)*" = "- Los argumentos con nombre pasados a símbolos usados como función ahora producen un error en lugar de ignorarse silenciosamente #pr(6192) *(Cambio incompatible menor)*"
"- The @math.mid[`mid`] element does not force the @math.class[`{\"large\"}` math class] upon its contents anymore and instead defaults to `{\"relation\"}` #pr(5980)" = "- El elemento @math.mid[`mid`] ya no impone la @math.class[clase matemática `{\"large\"}`] a su contenido y, en cambio, usa por defecto `{\"relation\"}` #pr(5980)"
"- Fixed error in math parsing when `..` isn't followed by anything #pr(7105)" = "- Se corrigió un error en el análisis de matemática cuando `..` no va seguido de nada #pr(7105)"
"- Fixed the default math class of ⅋, ⎰, ⟅, ⎱, ⟆, ⟇, and ، #pr(5949) #pr(6537)" = "- Se corrigió la clase matemática predeterminada de ⅋, ⎰, ⟅, ⎱, ⟆, ⟇ y ، #pr(5949) #pr(6537)"
"_Thanks to #gh(\"mkorje\") for his work on math!_" = "_¡Gracias a #gh(\"mkorje\") por su trabajo en matemática!_"
"= Model <model>" = "= Modelo <model>"
"- Tables" = "- Tablas"
"- Added support for multiple @table.header[headers] and subheaders in tables #pr(6168)" = "- Se agregó compatibilidad con varios @table.header[encabezados] y subencabezados en las tablas #pr(6168)"
"- Table headers now force a rowbreak, i.e. an incomplete row before a header will not be filled with cells after the header #pr(6687)" = "- Los encabezados de tabla ahora fuerzan un salto de fila, es decir, una fila incompleta antes de un encabezado no se completará con celdas posteriores al encabezado #pr(6687)"
"- Fixed a bug where @table.header[headers] and footers could accidentally expand to contain non-header cells #pr(5919)" = "- Se corrigió un error por el cual los @table.header[encabezados] y pies podían expandirse accidentalmente para contener celdas que no son de encabezado #pr(5919)"
"- Added @title element for displaying the document title #pr(5618)" = "- Se agregó el elemento @title para mostrar el título del documento #pr(5618)"

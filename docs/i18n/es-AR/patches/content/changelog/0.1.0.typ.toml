# Line patches for docs/content/changelog/0.1.0.typ (see docs/src/i18n.rs).
"= Breaking changes <breaking-changes>" = "= Cambios incompatibles <breaking-changes>"
"- When using the CLI, you now have to use subcommands:" = "- Al usar la CLI, ahora hay que usar subcomandos:"
"- `typst compile file.typ` or `typst c file.typ` to create a PDF" = "- `typst compile file.typ` o `typst c file.typ` para crear un PDF"
"- `typst watch file.typ` or `typst w file.typ` to compile and watch" = "- `typst watch file.typ` o `typst w file.typ` para compilar y observar"
"- `typst fonts` to list all fonts" = "- `typst fonts` para listar todas las fuentes"
"- Manual counters now start at zero. Read the \"How to step\" section @counter[here] for more details" = "- Los contadores manuales ahora empiezan en cero. Leé la sección \"How to step\" @counter[acá] para más detalles"
"- The @bibliography.style[bibliography styles] `{\"author-date\"}` and `{\"author-title\"}` were renamed to `{\"chicago-author-date\"}` and `{\"chicago-author-title\"}`" = "- Los @bibliography.style[estilos de bibliografía] `{\"author-date\"}` y `{\"author-title\"}` se renombraron a `{\"chicago-author-date\"}` y `{\"chicago-author-title\"}`"
"= Figure improvements <figure-improvements>" = "= Mejoras en las figuras <figure-improvements>"
"- Figures now automatically detect their content and adapt their behavior. Figures containing tables, for instance, are automatically prefixed with \"Table X\" and have a separate counter" = "- Las figuras ahora detectan automáticamente su contenido y adaptan su comportamiento. Las figuras que contienen tablas, por ejemplo, llevan automáticamente el prefijo \"Tabla X\" y tienen un contador aparte"
"- The figure's supplement (e.g. \"Figure\" or \"Table\") can now be customized" = "- El suplemento de la figura (p. ej., \"Figura\" o \"Tabla\") ahora se puede personalizar"
"- In addition, figures can now be completely customized because the show rule gives access to the automatically resolved kind, supplement, and counter" = "- Además, las figuras ahora se pueden personalizar por completo, porque la regla show da acceso al tipo, suplemento y contador resueltos automáticamente"
"= Bibliography improvements <bibliography-improvements>" = "= Mejoras en la bibliografía <bibliography-improvements>"
"- The @bibliography now also accepts multiple bibliography paths (as an array)" = "- La @bibliography ahora también acepta varias rutas de bibliografía (como array)"
"- Parsing of BibLaTeX files is now more permissive (accepts non-numeric edition, pages, volumes, dates, and Jabref-style comments; fixed abbreviation parsing)" = "- El análisis de archivos BibLaTeX ahora es más permisivo (acepta ediciones, páginas, volúmenes y fechas no numéricos y comentarios al estilo de Jabref; se corrigió el análisis de abreviaturas)"
"- Labels and references can now include `:` and `.` except at the end" = "- Las etiquetas y las referencias ahora pueden incluir `:` y `.` salvo al final"
"- Fixed APA bibliography ordering" = "- Se corrigió el orden de la bibliografía APA"
"= Drawing additions <drawing-additions>" = "= Novedades de dibujo <drawing-additions>"
"- Added @polygon function for drawing polygons" = "- Se agregó la función @polygon para dibujar polígonos"
"- Added support for clipping in @box.clip[boxes] and @block.clip[blocks]" = "- Se agregó compatibilidad con el recorte en @box.clip[cajas] y @block.clip[bloques]"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Now returns with non-zero status code if there is an error" = "- Ahora termina con un código de estado distinto de cero si hay un error"
"- Now watches the root directory instead of the current one" = "- Ahora observa el directorio raíz en lugar del actual"
"- Now puts the PDF file next to input file by default" = "- Ahora coloca el archivo PDF junto al archivo de entrada por defecto"
"- Now accepts more kinds of input files (e.g. `/dev/stdin`)" = "- Ahora acepta más tipos de archivos de entrada (p. ej., `/dev/stdin`)"
"- Added `--open` flag to directly open the PDF" = "- Se agregó el indicador `--open` para abrir directamente el PDF"
"= Miscellaneous improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Added @yaml function to load data from YAML files" = "- Se agregó la función @yaml para cargar datos desde archivos YAML"
"- Added basic i18n for a few more languages (IT, RU, ZH, FR, PT)" = "- Se agregó internacionalización básica para algunos idiomas más (IT, RU, ZH, FR, PT)"
"- Added numbering support for Hebrew" = "- Se agregó compatibilidad con numeración para hebreo"
"- Added support for @int[integers] with base 2, 8, and 16" = "- Se agregó compatibilidad con @int[enteros] en base 2, 8 y 16"
"- Added symbols for double bracket and laplace operator" = "- Se agregaron símbolos para el doble corchete y el operador laplaciano"
"- The @link function now accepts @label[labels]" = "- La función @link ahora acepta @label[etiquetas]"
"- The link syntax now allows more characters" = "- La sintaxis de enlaces ahora admite más caracteres"
"- Improved justification of Japanese and Chinese text" = "- Se mejoró la justificación del texto japonés y chino"
"- Calculation functions behave more consistently w.r.t to non-real results" = "- Las funciones de cálculo ahora se comportan de forma más coherente con los resultados que no son reales"
"- Replaced deprecated angle brackets" = "- Se reemplazaron los paréntesis angulares obsoletos"
"- Reduced maximum function call depth from 256 to 64" = "- Se redujo la profundidad máxima de llamadas a funciones de 256 a 64"
"- Fixed @par.first-line-indent[`first-line-indent`] being not applied when a paragraph starts with styled text" = "- Se corrigió que @par.first-line-indent[`first-line-indent`] no se aplicara cuando un párrafo empieza con texto con estilo"
"- Fixed extraneous spacing in unary operators in equations" = "- Se corrigió el espaciado superfluo en operadores unarios en ecuaciones"
"- Fixed block spacing, e.g. in `{block(above: 1cm, below: 1cm, ..)}`" = "- Se corrigió el espaciado de bloques, p. ej., en `{block(above: 1cm, below: 1cm, ..)}`"
"- Fixed styling of text operators in math" = "- Se corrigió el estilo de los operadores de texto en matemática"
"- Fixed invalid parsing of language tag in raw block with a single backtick" = "- Se corrigió el análisis inválido de la etiqueta de lenguaje en un bloque raw con un solo acento grave"
"- Fixed bugs with displaying counters and state" = "- Se corrigieron errores al mostrar contadores y estados"
"- Fixed crash related to page counter" = "- Se corrigió un fallo relacionado con el contador de páginas"
"- Fixed crash when @symbol function was called without arguments" = "- Se corrigió un fallo cuando la función @symbol se llamaba sin argumentos"
"- Fixed crash in bibliography generation" = "- Se corrigió un fallo en la generación de bibliografías"
"- Fixed access to label of certain content elements" = "- Se corrigió el acceso a la etiqueta de ciertos elementos de contenido"
"- Fixed line number in error message for CSV parsing" = "- Se corrigió el número de línea en el mensaje de error del análisis de CSV"
"- Fixed invalid autocompletion after certain markup elements" = "- Se corrigió un autocompletado inválido después de ciertos elementos de marcado"

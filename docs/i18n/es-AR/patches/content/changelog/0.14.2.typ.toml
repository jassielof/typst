# Line patches for docs/content/changelog/0.14.2.typ (see docs/src/i18n.rs).
"= Security <security>" = "= Seguridad <security>"
"- Updated the WebAssembly runtime used for executing @plugin[plugins]. The version used in Typst 0.14.0 and 0.14.1 suffers from a memory handling vulnerability. Based on our investigation, the vulnerability would be very hard to exploit in practice, but an exploit could theoretically be feasible. In any case, *we recommend upgrading to Typst 0.14.2.* This holds in particular for local users. In the web app, the bug is not critical as the browser offers an extra layer of protection." = "- Se actualizó el entorno de ejecución de WebAssembly que se usa para ejecutar @plugin[plugins]. La versión usada en Typst 0.14.0 y 0.14.1 tiene una vulnerabilidad de manejo de memoria. Según nuestra investigación, en la práctica la vulnerabilidad sería muy difícil de explotar, pero en teoría podría haber un exploit viable. De cualquier modo, *recomendamos actualizar a Typst 0.14.2.* Esto vale en particular para quienes usan Typst en local. En la app web el error no es crítico, porque el navegador ofrece una capa extra de protección."
"Typst 0.13.1 and below are not affected by this vulnerability." = "Typst 0.13.1 y las anteriores no están afectadas por esta vulnerabilidad."
"_Technical details:_ The #link(\"https://github.com/wasmi-labs/wasmi/\")[`wasmi`] WebAssembly runtime versions used in 0.14.0 and 0.14.1 have a _use-after-free_ memory handling bug in certain memory growth situations. Specifically, the bug occurs when the plugin tries to grow its memory, but allocating the requested amount of memory fails. Based on our investigation, the bug is hard to trigger in practice as the WebAssembly linear memory is always limited to 4GB on a technical level and modern operating systems rarely fail to serve a 4GB memory allocation request (typically not even under RAM pressure). Once the bug is triggered, it would also still be very challenging to turn it into an actual exploit. Regardless, we recommend upgrading to Typst 0.14.2 for protection against a potential exploit." = "_Detalles técnicos:_ Las versiones del entorno de ejecución de WebAssembly #link(\"https://github.com/wasmi-labs/wasmi/\")[`wasmi`] usadas en 0.14.0 y 0.14.1 tienen un error de manejo de memoria de tipo _use-after-free_ en ciertas situaciones de crecimiento de memoria. En concreto, el error ocurre cuando el plugin intenta hacer crecer su memoria, pero falla la asignación de la cantidad pedida. Según nuestra investigación, el error es difícil de provocar en la práctica, porque la memoria lineal de WebAssembly está siempre limitada a 4 GB a nivel técnico y los sistemas operativos modernos rara vez fallan al atender una solicitud de asignación de 4 GB (normalmente ni siquiera con poca RAM). Y aun si se lo provoca, convertirlo en un exploit real seguiría siendo muy difícil. De todos modos, recomendamos actualizar a Typst 0.14.2 como protección ante un posible exploit."
"= Diagnostics <diagnostics>" = "= Diagnósticos <diagnostics>"
"- Added a hint when @array.sorted fails because a pair of elements could not be compared. This hint aids with fixing bugs in user code that were surfaced by a change in internal sorting behavior in Typst 0.14.1." = "- Se agregó una sugerencia cuando @array.sorted falla porque no se pudo comparar un par de elementos. Esta sugerencia ayuda a corregir errores en el código de usuario que quedaron expuestos por un cambio en el comportamiento interno de ordenamiento en Typst 0.14.1."

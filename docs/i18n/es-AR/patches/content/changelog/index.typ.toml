# Line patches for docs/content/changelog/index.typ (see docs/src/i18n.rs).
"title: \"Changelog\"," = "title: \"Registro de cambios\","
"description: \"Learn what has changed in the latest Typst releases and move your documents forward.\"," = "description: \"Conocé qué cambió en las últimas versiones de Typst y llevá tus documentos al día.\","
"Learn what has changed in the latest Typst releases and move your documents forward. This section documents all changes to Typst since its initial public release." = "Conocé qué cambió en las últimas versiones de Typst y llevá tus documentos al día. Esta sección documenta todos los cambios de Typst desde su primera versión pública."
"Some changelog items contain references like this one: #pr(5017). These refer to a _pull request_ or _issue_ on #link(\"https://github.com/typst/typst\")[GitHub] related to the change. If the reference refers to another repository than `typst/typst`, the repository is explicitly listed like this: #pr(350, repo: \"typst/hayagriva\")." = "Algunos elementos del registro de cambios contienen referencias como esta: #pr(5017). Remiten a un _pull request_ o _issue_ en #link(\"https://github.com/typst/typst\")[GitHub] relacionado con el cambio. Si la referencia remite a un repositorio distinto de `typst/typst`, el repositorio se indica explícitamente, así: #pr(350, repo: \"typst/hayagriva\")."
"title: [Versions]," = "title: [Versiones],"
"(#date.display(\"[month repr:long] [day], [year]\"))" = "(#date.display(\"[day]/[month]/[year]\"))"
"if rc != none [, Release Candidate #rc]" = "if rc != none [, versión candidata #rc]"
"(Unreleased)" = "(Sin publicar)"
"description: \"Changes in Typst \" + base-version," = "description: \"Cambios en Typst \" + base-version,"
"= Contributors <contributors>" = "= Colaboradores <contributors>"
"Thanks to everyone who contributed to this release!" = "¡Gracias a todos los que contribuyeron a esta versión!"
"title: \"Earlier\"," = "title: \"Anteriores\","
"title-fmt: [Changes in early, unversioned Typst]," = "title-fmt: [Cambios en las primeras versiones de Typst, sin numerar],"
"description: \"Changes in early, unversioned Typst\"," = "description: \"Cambios en las primeras versiones de Typst, sin numerar\","

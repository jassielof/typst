# Line patches for docs/content/changelog/0.14.1.typ (see docs/src/i18n.rs).
"= PDF export <pdf-export>" = "= Exportación a PDF <pdf-export>"
"- Fixed regression where links to labelled elements would sometimes not work correctly #pr(304, repo: \"LaurenzV/krilla\")" = "- Se corrigió una regresión por la cual los enlaces a elementos con etiqueta a veces no funcionaban bien #pr(304, repo: \"LaurenzV/krilla\")"
"- Fixed bug where PDF text attributes could be written incorrectly #pr(7478)" = "- Se corrigió un error por el cual los atributos de texto del PDF podían escribirse de forma incorrecta #pr(7478)"
"- Fixed crash in link handling #pr(7471)" = "- Se corrigió un fallo en el manejo de enlaces #pr(7471)"
"- Fixed crash for zero-sized pages #pr(7454)" = "- Se corrigió un fallo con páginas de tamaño cero #pr(7454)"
"- Fixed crash when a table @table.vline[`vline`] or @table.hline[`hline`] has an out-of-bounds index #pr(7448)" = "- Se corrigió un fallo cuando una @table.vline[`vline`] o una @table.hline[`hline`] de una tabla tenía un índice fuera de rango #pr(7448)"
"- Fixed crash in formatting of font-related PDF export errors #pr(7460)" = "- Se corrigió un fallo en el formato de los errores de exportación a PDF relacionados con fuentes #pr(7460)"
"- Fixed crash when a @footnote or @place element was queried and reinserted into the document #pr(7216)" = "- Se corrigió un fallo cuando un elemento @footnote o @place se consultaba y se volvía a insertar en el documento #pr(7216)"
"- Fixed crash for PNGs with invalid metadata #pr(286, repo: \"LaurenzV/krilla\"), #pr(287, repo: \"LaurenzV/krilla\")" = "- Se corrigió un fallo con PNG con metadatos inválidos #pr(286, repo: \"LaurenzV/krilla\"), #pr(287, repo: \"LaurenzV/krilla\")"
"- Fixed bug where text in SVGs with `fill-and-stroke` paint order could be exported incorrectly #pr(292, repo: \"LaurenzV/krilla\")" = "- Se corrigió un error por el cual el texto de SVG con orden de pintura `fill-and-stroke` podía exportarse de forma incorrecta #pr(292, repo: \"LaurenzV/krilla\")"
"- Fixed bug with layer isolation in SVGs where blending/masking is used #pr(295, repo: \"LaurenzV/krilla\")" = "- Se corrigió un error de aislamiento de capas en SVG donde se usan mezcla o máscaras #pr(295, repo: \"LaurenzV/krilla\")"
"- Fixed that table headers could be tagged incorrectly in some scenarios #pr(289, repo: \"LaurenzV/krilla\")" = "- Se corrigió que los encabezados de tabla pudieran etiquetarse de forma incorrecta en algunos casos #pr(289, repo: \"LaurenzV/krilla\")"
"- Fixed issues where generated PDFs could differ between 32-bit and 64-bit systems #pr(317, repo: \"LaurenzV/krilla\"), #pr(316, repo: \"LaurenzV/krilla\"), #pr(312, repo: \"LaurenzV/krilla\")" = "- Se corrigieron problemas por los cuales los PDF generados podían diferir entre sistemas de 32 y de 64 bits #pr(317, repo: \"LaurenzV/krilla\"), #pr(316, repo: \"LaurenzV/krilla\"), #pr(312, repo: \"LaurenzV/krilla\")"
"- Upgraded JPEG decoder used during PDF export for improved compatibility, fixing a case where a valid JPEG was rejected #pr(288, repo: \"LaurenzV/krilla\")" = "- Se actualizó el decodificador de JPEG que se usa en la exportación a PDF para mejorar la compatibilidad, lo que corrige un caso en el que se rechazaba un JPEG válido #pr(288, repo: \"LaurenzV/krilla\")"
"- A PDF document information dictionary that would be empty is now fully omitted instead #pr(280, repo: \"LaurenzV/krilla\")" = "- Un diccionario de información del documento PDF que quedaría vacío ahora se omite por completo #pr(280, repo: \"LaurenzV/krilla\")"
"- A rare crash in PDF tagging was turned into a compiler error #pr(7450)" = "- Un fallo poco frecuente en el etiquetado de PDF se convirtió en un error del compilador #pr(7450)"
"= HTML export <html-export>" = "= Exportación a HTML <html-export>"
"- Fixed export of table @table.header[headers] and @table.footer[footers] with gutter #pr(7332)" = "- Se corrigió la exportación de @table.header[encabezados] y @table.footer[pies] de tabla con separación #pr(7332)"
"- A @page set rule in HTML export is now a warning instead of a hard error, in line with how unsupported elements are generally treated #pr(7513)" = "- Una regla set de @page en la exportación a HTML ahora es una advertencia y no un error grave, en línea con el modo en que se tratan en general los elementos no admitidos #pr(7513)"
"= Math <math>" = "= Matemática <math>"
"- Fixed regression where `arrow.l.r` could not be used as an @math.accent[accent] anymore #pr(7481)" = "- Se corrigió una regresión por la cual `arrow.l.r` ya no se podía usar como @math.accent[acento] #pr(7481)"
"- Fixed that single-letter strings did not react to spaces around them like multi-letter strings do #pr(7276)" = "- Se corrigió que las cadenas de una sola letra no reaccionaran a los espacios a su alrededor como lo hacen las de varias letras #pr(7276)"
"- Fixed that spacing around @math.mat[`mat`] and @math.vec[`vec`] with a fence delimiter was whitespace-dependent #pr(7309)" = "- Se corrigió que el espaciado alrededor de @math.mat[`mat`] y @math.vec[`vec`] con un delimitador de cerco dependiera de los espacios en blanco #pr(7309)"
"- Fixed height calculation for horizontally stretched glyphs #pr(7327)" = "- Se corrigió el cálculo de la altura de los glifos estirados horizontalmente #pr(7327)"
"= Model <model>" = "= Modelo <model>"
"- Fixed regression where Typst would error in heading numbering functions that don't handle the counter state `{(0,)}`. This can occur in the first layout iteration. Such errors are usually automatically caught by Typst, which was not the case here. #pr(7459)" = "- Se corrigió una regresión por la cual Typst fallaba en las funciones de numeración de títulos que no manejan el estado de contador `{(0,)}`. Esto puede ocurrir en la primera iteración del diseño. Typst suele capturar automáticamente esos errores, pero acá no lo hacía. #pr(7459)"
"= Text <text>" = "= Texto <text>"
"- Fixed regression where Typst would synthesize superscripts for some fonts even when @super.typographic[typographic] glyphs were available #pr(7462)" = "- Se corrigió una regresión por la cual Typst sintetizaba superíndices para algunas fuentes aun cuando había glifos @super.typographic[tipográficos] disponibles #pr(7462)"
"- Fixed regression where some oblique fonts would be classified as italic #pr(7483)" = "- Se corrigió una regresión por la cual algunas fuentes oblicuas se clasificaban como cursivas #pr(7483)"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Fixed crash due to violated invariants in @array.sorted #pr(7520)" = "- Se corrigió un fallo por invariantes violadas en @array.sorted #pr(7520)"
"- Fixed crashes due to overflow in @calc.rem, @calc.rem-euclid, @calc.div-euclid, @calc.quo, and @calc.gcd #pr(7419)" = "- Se corrigieron fallos por desbordamiento en @calc.rem, @calc.rem-euclid, @calc.div-euclid, @calc.quo y @calc.gcd #pr(7419)"
"- Upgraded WebAssembly runtime, fixing a bug that @plugin[plugins] could run into #pr(7438)" = "- Se actualizó el entorno de ejecución de WebAssembly, lo que corrige un error con el que podían toparse los @plugin[plugins] #pr(7438)"
"= Command Line Interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Compiling to standard output in combination with `--deps --deps-format=make` (which results in an error) will not produce an empty Make dependency file as a side effect anymore #pr(7246)" = "- Compilar a la salida estándar junto con `--deps --deps-format=make` (lo que produce un error) ya no genera como efecto secundario un archivo de dependencias de Make vacío #pr(7246)"
"= Development <development>" = "= Desarrollo <development>"
"- Increased minimum supported Rust version to 1.89 #pr(7363)" = "- Se aumentó la versión mínima admitida de Rust a 1.89 #pr(7363)"

# Line patches for docs/content/changelog/0.3.0.typ (see docs/src/i18n.rs).
"= Breaking changes <breaking-changes>" = "= Cambios incompatibles <breaking-changes>"
"- Renamed a few symbols: What was previous `dot.op` is now just `dot` and the basic dot is `dot.basic`. The same applies to `ast` and `tilde`." = "- Se renombraron algunos símbolos: lo que antes era `dot.op` ahora es simplemente `dot`, y el punto básico es `dot.basic`. Lo mismo aplica a `ast` y `tilde`."
"- Renamed `mod` to @calc.rem[`rem`] to more accurately reflect the behavior. It will remain available as `mod` until the next update as a grace period." = "- Se renombró `mod` a @calc.rem[`rem`] para reflejar con más precisión su comportamiento. Seguirá disponible como `mod` hasta la próxima actualización como período de gracia."
"- A lone underscore is not a valid identifier anymore, it can now only be used in patterns" = "- Un guion bajo suelto ya no es un identificador válido; ahora solo se puede usar en patrones"
"- Removed `before` and `after` arguments from @query. This is now handled through flexible @selector[selectors] combinator methods" = "- Se eliminaron los argumentos `before` y `after` de @query. Ahora esto se maneja con métodos combinadores flexibles de @selector[selectores]"
"- Added support for @math.attach[attachments] (sub-, superscripts) that precede the base symbol. The `top` and `bottom` arguments have been renamed to `t` and `b`." = "- Se agregó compatibilidad con @math.attach[adjuntos] (subíndices y superíndices) que preceden al símbolo base. Los argumentos `top` y `bottom` se renombraron a `t` y `b`."
"= New features <new-features>" = "= Funciones nuevas <new-features>"
"- Added support for more complex @stroke[strokes] (configurable caps, joins, and dash patterns)" = "- Se agregó compatibilidad con @stroke[trazos] más complejos (terminaciones, uniones y patrones de guiones configurables)"
"- Added @math.cancel[`cancel`] function for equations" = "- Se agregó la función @math.cancel[`cancel`] para ecuaciones"
"- Added support for @reference:scripting:bindings[destructuring] in argument lists and assignments" = "- Se agregó compatibilidad con la @reference:scripting:bindings[desestructuración] en listas de argumentos y asignaciones"
"- Added @image.alt[`alt`] text argument to image function" = "- Se agregó el argumento de texto @image.alt[`alt`] a la función image"
"- Added @toml function for loading data from a TOML file" = "- Se agregó la función @toml para cargar datos desde un archivo TOML"
"- Added @array.zip[`zip`], @array.sum[`sum`], and @array.product[`product`] methods for arrays" = "- Se agregaron los métodos @array.zip[`zip`], @array.sum[`sum`] y @array.product[`product`] para arrays"
"- Added `fact`, `perm`, `binom`, `gcd`, `lcm`, `atan2`, `quo`, `trunc`, and `fract` @calc[calculation] functions" = "- Se agregaron las funciones de @calc[cálculo] `fact`, `perm`, `binom`, `gcd`, `lcm`, `atan2`, `quo`, `trunc` y `fract`"
"= Improvements <improvements>" = "= Mejoras <improvements>"
"- Text in SVGs now displays properly" = "- El texto en SVG ahora se muestra correctamente"
"- Typst now generates a PDF heading outline" = "- Typst ahora genera un índice (outline) de títulos en el PDF"
"- @ref[References] now provides the referenced element as a field in show rules" = "- Las @ref[referencias] ahora proporcionan el elemento referenciado como campo en las reglas show"
"- Refined linebreak algorithm for better Chinese justification" = "- Se refinó el algoritmo de saltos de línea para una mejor justificación del chino"
"- Locations are now a valid kind of selector" = "- Las ubicaciones ahora son un tipo válido de selector"
"- Added a few symbols for algebra" = "- Se agregaron algunos símbolos para álgebra"
"- Added Spanish smart quote support" = "- Se agregó compatibilidad con comillas tipográficas del español"
"- Added @selector function to turn a selector-like value into a selector on which combinator methods can be called" = "- Se agregó la función @selector para convertir un valor similar a un selector en un selector sobre el que se pueden llamar métodos combinadores"
"- Improved some error messages" = "- Se mejoraron algunos mensajes de error"
"- The outline and bibliography headings can now be styled with show-set rules" = "- Los títulos del índice y de la bibliografía ahora se pueden estilizar con reglas show-set"
"- Operations on numbers now produce an error instead of overflowing" = "- Las operaciones con números ahora producen un error en lugar de desbordarse"
"= Bug fixes <bug-fixes>" = "= Correcciones de errores <bug-fixes>"
"- Fixed wrong linebreak before punctuation that follows inline equations, citations, and other elements" = "- Se corrigió un salto de línea erróneo antes de los signos de puntuación que siguen a ecuaciones en línea, citas y otros elementos"
"- Fixed a bug with @arguments[argument sinks]" = "- Se corrigió un error con los @arguments[sumideros de argumentos]"
"- Fixed strokes with thickness zero" = "- Se corrigieron los trazos de grosor cero"
"- Fixed hiding and show rules in math" = "- Se corrigieron las reglas de ocultamiento y show en matemática"
"- Fixed alignment in matrices" = "- Se corrigió la alineación en matrices"
"- Fixed some alignment bugs in equations" = "- Se corrigieron algunos errores de alineación en ecuaciones"
"- Fixed grid cell alignment" = "- Se corrigió la alineación de celdas de grilla"
"- Fixed alignment of list marker and enum markers in presence of global alignment settings" = "- Se corrigió la alineación de los marcadores de lista y de enumeración con configuraciones de alineación globales"
"- Fixed path closing" = "- Se corrigió el cierre de trazados"
"- Fixed compiler crash with figure references" = "- Se corrigió un fallo del compilador con referencias a figuras"
"- A single trailing line breaks is now ignored in math, just like in text" = "- Un único salto de línea final ahora se ignora en matemática, igual que en el texto"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Font path and compilation root can now be set with the environment variables `TYPST_FONT_PATHS` and `TYPST_ROOT`" = "- Ahora se pueden establecer la ruta de fuentes y la raíz de compilación con las variables de entorno `TYPST_FONT_PATHS` y `TYPST_ROOT`"
"- The output of `typst fonts` now includes the embedded fonts" = "- La salida de `typst fonts` ahora incluye las fuentes incrustadas"
"= Development <development>" = "= Desarrollo <development>"
"- Added instrumentation for debugging and optimization" = "- Se agregó instrumentación para depuración y optimización"
"- Added `--update` flag and `UPDATE_EXPECT` environment variable to update reference images for tests" = "- Se agregaron el indicador `--update` y la variable de entorno `UPDATE_EXPECT` para actualizar las imágenes de referencia de las pruebas"
"- You can now run a specific subtest with `--subtest`" = "- Ahora podés ejecutar una subprueba específica con `--subtest`"
"- Tests now run on multiple threads" = "- Las pruebas ahora se ejecutan en varios hilos"

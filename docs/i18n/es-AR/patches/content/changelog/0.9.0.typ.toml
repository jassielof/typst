# Line patches for docs/content/changelog/0.9.0.typ (see docs/src/i18n.rs).
"= Bibliography management <bibliography-management>" = "= Gestión de bibliografías <bibliography-management>"
"- New bibliography engine based on #link(\"https://citationstyles.org/\")[CSL] (Citation Style Language). Ships with about 100 commonly used citation styles and can load custom `.csl` files." = "- Nuevo motor de bibliografía basado en #link(\"https://citationstyles.org/\")[CSL] (Citation Style Language). Incluye alrededor de 100 estilos de cita de uso común y puede cargar archivos `.csl` personalizados."
"- Added new @cite.form[`form`] argument to the `cite` function to produce different forms of citations (e.g. for producing a citation suitable for inclusion in prose)" = "- Se agregó el nuevo argumento @cite.form[`form`] a la función `cite` para producir distintas formas de citas (p. ej., para producir una cita adecuada para incluirla en prosa)"
"- The @cite function now takes only a single label/key instead of allowing multiple. Adjacent citations are merged and formatted according to the citation style's rules automatically. This works both with the reference syntax and explicit calls to the `cite` function. *(Breaking change)*" = "- La función @cite ahora toma una única etiqueta/clave en lugar de permitir varias. Las citas adyacentes se combinan y se formatean automáticamente según las reglas del estilo de cita. Esto funciona tanto con la sintaxis de referencia como con llamadas explícitas a la función `cite`. *(Cambio incompatible)*"
"- The `cite` function now takes a @label[label] instead of a string *(Breaking change)*" = "- La función `cite` ahora toma una @label[etiqueta] en lugar de una cadena de texto *(Cambio incompatible)*"
"- Added @bibliography.full[`full`] argument to bibliography function to print the full bibliography even if not all works were cited" = "- Se agregó el argumento @bibliography.full[`full`] a la función bibliography para imprimir la bibliografía completa aunque no se hayan citado todas las obras"
"- Bibliography entries can now contain Typst equations (wrapped in `[$..$]` just like in markup), this works both for `.yaml` and `.bib` bibliographies" = "- Las entradas de bibliografía ahora pueden contener ecuaciones de Typst (entre `[$..$]`, igual que en marcado); esto funciona tanto para bibliografías `.yaml` como `.bib`"
"- The hayagriva YAML format was improved. See its #link(\"https://github.com/typst/hayagriva/blob/main/CHANGELOG.md\")[changelog] for more details. *(Breaking change)*" = "- Se mejoró el formato YAML de hayagriva. Consultá su #link(\"https://github.com/typst/hayagriva/blob/main/CHANGELOG.md\")[registro de cambios] para más detalles. *(Cambio incompatible)*"
"- A few bugs with `.bib` file parsing were fixed" = "- Se corrigieron algunos errores en el análisis de archivos `.bib`"
"- Removed `brackets` argument of `cite` function in favor of `form`" = "- Se eliminó el argumento `brackets` de la función `cite` en favor de `form`"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- Gradients and colors (thanks to #gh(\"Dherse\"))" = "- Degradés y colores (gracias a #gh(\"Dherse\"))"
"- Added support for @gradient[gradients] on shapes and text" = "- Se agregó compatibilidad con @gradient[degradés] en formas y texto"
"- Supports linear, radial, and conic gradients" = "- Admite degradés lineales, radiales y cónicos"
"- Added support for defining colors in more color spaces, including @color.oklab[Oklab], @color.linear-rgb[Linear RGB(A)], @color.hsl[HSL], and @color.hsv[HSV]" = "- Se agregó compatibilidad para definir colores en más espacios de color, entre ellos @color.oklab[Oklab], @color.linear-rgb[RGB(A) lineal], @color.hsl[HSL] y @color.hsv[HSV]"
"- Added @color.saturate[`saturate`], @color.desaturate[`desaturate`], and @color.rotate[`rotate`] functions on colors" = "- Se agregaron las funciones @color.saturate[`saturate`], @color.desaturate[`desaturate`] y @color.rotate[`rotate`] sobre colores"
"- Added @color.map module with predefined color maps that can be used with gradients" = "- Se agregó el módulo @color.map con mapas de color predefinidos que se pueden usar con degradés"
"- Rename `kind` function on colors to @color.space[`space`]" = "- Se renombró la función `kind` de los colores a @color.space[`space`]"
"- Removed `to-rgba`, `to-cmyk`, and `to-luma` functions in favor of a new @color.components[`components`] function" = "- Se eliminaron las funciones `to-rgba`, `to-cmyk` y `to-luma` en favor de una nueva función @color.components[`components`]"
"- Improved rendering of @rect[rectangles] with corner radius and varying stroke widths" = "- Se mejoró el renderizado de @rect[rectángulos] con radio de esquina y distintos grosores de trazo"
"- Added support for properly clipping @box.clip[boxes] and @block.clip[blocks] with a border radius" = "- Se agregó compatibilidad para recortar correctamente @box.clip[cajas] y @block.clip[bloques] con radio de borde"
"- Added `background` parameter to @overline, @underline, and @strike functions" = "- Se agregó el parámetro `background` a las funciones @overline, @underline y @strike"
"- Fixed inaccurate color embedding in PDFs" = "- Se corrigió la incrustación imprecisa de colores en PDF"
"- Fixed ICC profile handling for images embedded in PDFs" = "- Se corrigió el manejo de perfiles ICC de imágenes incrustadas en PDF"
"= Text and Layout <text-and-layout>" = "= Texto y diseño <text-and-layout>"
"- Added support for automatically adding proper @text.cjk-latin-spacing[spacing] between CJK and Latin text (enabled by default)" = "- Se agregó compatibilidad para agregar automáticamente el @text.cjk-latin-spacing[espaciado] adecuado entre texto CJK y latín (habilitado por defecto)"
"- Added support for automatic adjustment of more CJK punctuation" = "- Se agregó compatibilidad con el ajuste automático de más signos de puntuación CJK"
"- Added @quote element for inserting inline and block quotes with optional attributions" = "- Se agregó el elemento @quote para insertar citas en línea y en bloque con atribuciones opcionales"
"- Added @raw.line element for customizing the display of individual lines of raw text, e.g. to add line numbers while keeping proper syntax highlighting" = "- Se agregó el elemento @raw.line para personalizar cómo se muestra cada línea de texto raw, p. ej., para agregar números de línea manteniendo el resaltado de sintaxis correcto"
"- Added support for per-side @table.inset[inset] customization to table function" = "- Se agregó compatibilidad para personalizar el @table.inset[margen interno] por lado en la función table"
"- Added Hungarian and Romanian translations" = "- Se agregaron traducciones al húngaro y al rumano"
"- Added support for Czech hyphenation" = "- Se agregó compatibilidad con la separación silábica del checo"
"- Added support for setting custom @smartquote[smart quotes]" = "- Se agregó compatibilidad para establecer @smartquote[comillas tipográficas] personalizadas"
"- The default @figure.caption.separator[figure separator] now reacts to the currently set language and region" = "- El @figure.caption.separator[separador de figura] predeterminado ahora reacciona al idioma y la región establecidos"
"- Improved line breaking of links / URLs (especially helpful for bibliographies with many URLs)" = "- Se mejoró el salto de línea de enlaces / URL (especialmente útil para bibliografías con muchas URL)"
"- Improved handling of consecutive hyphens in justification algorithm" = "- Se mejoró el manejo de guiones consecutivos en el algoritmo de justificación"
"- Fixed interaction of justification and hanging indent" = "- Se corrigió la interacción entre la justificación y la sangría francesa"
"- Fixed a bug with line breaking of short lines without spaces when justification is enabled" = "- Se corrigió un error con el salto de línea de líneas cortas sin espacios cuando la justificación está habilitada"
"- Fixed font fallback for hyphen generated by hyphenation" = "- Se corrigió la fuente de reserva para el guion que genera la separación silábica"
"- Fixed handling of word joiner and other no-break characters during hyphenation" = "- Se corrigió el manejo del word joiner y otros caracteres de no separación durante la separación silábica"
"- Fixed crash when hyphenating after an empty line" = "- Se corrigió un fallo al separar en sílabas después de una línea vacía"
"- Fixed line breaking of composite emoji like 🏳️‍🌈" = "- Se corrigió el salto de línea de emojis compuestos como 🏳️‍🌈"
"- Fixed missing text in some SVGs" = "- Se corrigió texto faltante en algunos SVG"
"- Fixed font fallback in SVGs" = "- Se corrigió la fuente de reserva en SVG"
"- Fixed behavior of @pagebreak.to[`to`] argument on `pagebreak` function" = "- Se corrigió el comportamiento del argumento @pagebreak.to[`to`] de la función `pagebreak`"
"- Fixed `{set align(..)}` for equations" = "- Se corrigió `{set align(..)}` para ecuaciones"
"- Fixed spacing around @place[placed] elements" = "- Se corrigió el espaciado alrededor de elementos @place[ubicados]"
"- Fixed coalescing of @block.above[`above`] and @block.below[`below`] spacing if given in em units and the font sizes differ" = "- Se corrigió la unificación de los espaciados @block.above[`above`] y @block.below[`below`] cuando se dan en unidades em y los tamaños de fuente difieren"
"- Fixed handling of `extent` parameter of @underline, @overline, and @strike functions" = "- Se corrigió el manejo del parámetro `extent` de las funciones @underline, @overline y @strike"
"- Fixed crash for @place.float[floating placed elements] with no specified vertical alignment" = "- Se corrigió un fallo con @place.float[elementos ubicados de forma flotante] sin alineación vertical especificada"
"- Partially fixed a bug with citations in footnotes" = "- Se corrigió parcialmente un error con citas en notas al pie"
"= Math <math>" = "= Matemática <math>"
"- Added `gap` argument for @math.vec.gap[`vec`], @math.mat.gap[`mat`], and @math.cases.gap[`cases`] function" = "- Se agregó el argumento `gap` a las funciones @math.vec.gap[`vec`], @math.mat.gap[`mat`] y @math.cases.gap[`cases`]"
"- Added `size` argument for @math.abs[`abs`], @math.norm[`norm`], @math.floor[`floor`], @math.ceil[`ceil`], and @math.round[`round`] functions" = "- Se agregó el argumento `size` a las funciones @math.abs[`abs`], @math.norm[`norm`], @math.floor[`floor`], @math.ceil[`ceil`] y @math.round[`round`]"
"- Added @math.cases.reverse[`reverse`] parameter to cases function" = "- Se agregó el parámetro @math.cases.reverse[`reverse`] a la función cases"
"- Added support for multinomial coefficients to @math.binom[`binom`] function" = "- Se agregó compatibilidad con coeficientes multinomiales en la función @math.binom[`binom`]"
"- Removed `rotation` argument on @math.cancel[`cancel`] function in favor of a new and more flexible `angle` argument *(Breaking change)*" = "- Se eliminó el argumento `rotation` de la función @math.cancel[`cancel`] en favor de un nuevo argumento `angle`, más flexible *(Cambio incompatible)*"
"- Added `wide` constant, which inserts twice the spacing of `quad`" = "- Se agregó la constante `wide`, que inserta el doble del espaciado de `quad`"
"- Added `csch` and `sech` @math.op[operators]" = "- Se agregaron los @math.op[operadores] `csch` y `sech`"
"- `↼`, `⇀`, `↔`, and `⟷` can now be used as @math.accent[accents]" = "- `↼`, `⇀`, `↔` y `⟷` ahora se pueden usar como @math.accent[acentos]"
"- Added `integral.dash`, `integral.dash.double`, and `integral.slash` @sym[symbols]" = "- Se agregaron los @sym[símbolos] `integral.dash`, `integral.dash.double` e `integral.slash`"
"- Added support for specifying negative indices for @math.mat.augment[augmentation] lines to position the line from the back" = "- Se agregó compatibilidad para especificar índices negativos en las líneas de @math.mat.augment[aumento] y posicionarlas desde atrás"
"- Fixed default color of matrix @math.mat.augment[augmentation] lines" = "- Se corrigió el color predeterminado de las líneas de @math.mat.augment[aumento] de las matrices"
"- Fixed attachment of primes to inline expressions" = "- Se corrigió la adjunción de primas a expresiones en línea"
"- Math content now respects the text @text.baseline[baseline] setting" = "- El contenido matemático ahora respeta la configuración de @text.baseline[línea base] del texto"
"= Performance <performance>" = "= Rendimiento <performance>"
"- Fixed a bug related to show rules in templates which would effectively disable incremental compilation in affected documents" = "- Se corrigió un error relacionado con las reglas show en plantillas que deshabilitaba efectivamente la compilación incremental en los documentos afectados"
"- Micro-optimized code in several hot paths, which brings substantial performance gains, in particular in incremental compilations" = "- Se microoptimizó código en varias rutas críticas, lo que trae mejoras sustanciales de rendimiento, en particular en las compilaciones incrementales"
"- Improved incremental parsing, which affects the whole incremental compilation pipeline" = "- Se mejoró el análisis sintáctico incremental, que afecta a todo el flujo de compilación incremental"
"- Added support for incremental parsing in the CLI" = "- Se agregó compatibilidad con el análisis sintáctico incremental en la CLI"
"- Added support for incremental SVG encoding during PDF export, which greatly improves export performance for documents with many SVG" = "- Se agregó compatibilidad con la codificación incremental de SVG durante la exportación a PDF, lo que mejora mucho el rendimiento de exportación de documentos con muchos SVG"
"= Tooling and Diagnostics <tooling-and-diagnostics>" = "= Herramientas y diagnósticos <tooling-and-diagnostics>"
"- Improved autocompletion for variables that are in-scope" = "- Se mejoró el autocompletado de variables que están en alcance"
"- Added autocompletion for package imports" = "- Se agregó el autocompletado de importaciones de paquetes"
"- Added autocompletion for @label[labels]" = "- Se agregó el autocompletado de @label[etiquetas]"
"- Added tooltip that shows which variables a function captures (when hovering over the equals sign or arrow of the function)" = "- Se agregó un tooltip que muestra qué variables captura una función (al pasar el mouse sobre el signo igual o la flecha de la función)"
"- Diagnostics are now deduplicated" = "- Los diagnósticos ahora se deduplican"
"- Improved diagnostics when trying to apply unary `+` or `-` to types that only support binary `+` and `-`" = "- Se mejoraron los diagnósticos al intentar aplicar `+` o `-` unarios a tipos que solo admiten `+` y `-` binarios"
"- Error messages now state which label or citation key isn't present in the document or its bibliography" = "- Los mensajes de error ahora indican qué etiqueta o clave de cita no está presente en el documento o en su bibliografía"
"- Fixed a bug where function argument parsing errors were shadowed by function execution errors (e.g. when trying to call @array.sorted and passing the key function as a positional argument instead of a named one)." = "- Se corrigió un error por el cual los errores de análisis de argumentos de funciones quedaban tapados por errores de ejecución de la función (p. ej., al intentar llamar a @array.sorted y pasar la función de clave como argumento posicional en lugar de con nombre)."
"= Export <export>" = "= Exportación <export>"
"- Added support for configuring the document's creation @document.date[`date`]. If the `date` is set to `{auto}` (the default), the PDF's creation date will be set to the current date and time." = "- Se agregó compatibilidad para configurar la @document.date[`date`] de creación del documento. Si `date` se establece en `{auto}` (el valor predeterminado), la fecha de creación del PDF será la fecha y hora actuales."
"- Added support for configuring document @document.keywords[`keywords`]" = "- Se agregó compatibilidad para configurar las @document.keywords[`keywords`] (palabras clave) del documento"
"- Generated PDFs now contain PDF document IDs" = "- Los PDF generados ahora contienen ID de documento PDF"
"- The PDF creator tool metadata now includes the Typst version" = "- Los metadatos de la herramienta creadora del PDF ahora incluyen la versión de Typst"
"= Web app <web-app>" = "= App web <web-app>"
"- Added version picker to pin a project to an older compiler version (with support for Typst 0.6.0+)" = "- Se agregó un selector de versión para fijar un proyecto a una versión anterior del compilador (con compatibilidad con Typst 0.6.0 o posterior)"
"- Fixed desyncs between editor and compiler and improved overall stability" = "- Se corrigieron desincronizaciones entre el editor y el compilador y se mejoró la estabilidad general"
"- The app now continues to highlight the document when typing while the document is being compiled" = "- Ahora la app sigue resaltando el documento mientras se escribe durante la compilación"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added support for discovering fonts through fontconfig" = "- Se agregó compatibilidad para descubrir fuentes mediante fontconfig"
"- Now clears the screen instead of resetting the terminal" = "- Ahora limpia la pantalla en lugar de reiniciar la terminal"
"- Now automatically picks correct file extension for selected output format" = "- Ahora elige automáticamente la extensión de archivo correcta para el formato de salida seleccionado"
"- Now only regenerates images for changed pages when using `typst watch` with PNG or SVG export" = "- Ahora solo regenera las imágenes de las páginas modificadas al usar `typst watch` con exportación a PNG o SVG"
"= Miscellaneous Improvements <miscellaneous-improvements>" = "= Mejoras varias <miscellaneous-improvements>"
"- Added @version type and @sys.version constant specifying the current compiler version. Can be used to gracefully support multiple versions." = "- Se agregaron el tipo @version y la constante @sys.version, que indican la versión actual del compilador. Se pueden usar para admitir varias versiones de forma elegante."
"- The U+2212 MINUS SIGN is now used when displaying a numeric value, in the @repr of any numeric value and to replace a normal hyphen in text mode when before a digit. This improves, in particular, how negative integer values are displayed in math mode." = "- Ahora se usa el SIGNO MENOS U+2212 al mostrar un valor numérico, en el @repr de cualquier valor numérico y para reemplazar un guion normal en modo texto cuando va antes de un dígito. Esto mejora, en particular, cómo se muestran los enteros negativos en modo matemático."
"- Added support for specifying a default value instead of failing for `remove` function in @array.remove[array] and @dictionary.remove[dictionary]" = "- Se agregó compatibilidad para especificar un valor predeterminado en lugar de fallar en la función `remove` de @array.remove[array] y @dictionary.remove[diccionario]"
"- Simplified Page Setup Guide examples" = "- Se simplificaron los ejemplos de la Guía de configuración de página"
"- Switched the documentation from using the word \"hashtag\" to the word \"hash\" where appropriate" = "- Se cambió en la documentación la palabra \"hashtag\" por \"hash\" donde corresponde"
"- Added support for @array.zip without any further arguments" = "- Se agregó compatibilidad con @array.zip sin más argumentos"
"- Fixed crash when a plugin tried to read out of bounds memory" = "- Se corrigió un fallo cuando un plugin intentaba leer memoria fuera de rango"
"- Fixed crashes when handling infinite @length[lengths]" = "- Se corrigieron fallos al manejar @length[longitudes] infinitas"
"- Fixed introspection (mostly bibliography) bugs due to weak page break close to the end of the document" = "- Se corrigieron errores de introspección (sobre todo de bibliografía) por un salto de página débil cerca del final del documento"
"= Development <development>" = "= Desarrollo <development>"
"- Extracted `typst::ide` into separate `typst_ide` crate" = "- Se extrajo `typst::ide` a un crate separado, `typst_ide`"
"- Removed a few remaining `'static` bounds on `&dyn World`" = "- Se quitaron algunas restricciones `'static` restantes sobre `&dyn World`"
"- Removed unnecessary dependency, which reduces the binary size" = "- Se quitó una dependencia innecesaria, lo que reduce el tamaño del binario"
"- Fixed compilation of `typst` by itself (without `typst-library`)" = "- Se corrigió la compilación de `typst` por sí solo (sin `typst-library`)"
"- Fixed warnings with Nix flake when using `lib.getExe`" = "- Se corrigieron advertencias con el flake de Nix al usar `lib.getExe`"

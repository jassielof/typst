# Line patches for docs/content/changelog/0.15.1.typ (see docs/src/i18n.rs).
"= Library <library>" = "= Biblioteca <library>"
"== Text <text>" = "== Texto <text>"
"- Updated New Computer Modern fonts to version 8.1.1, fixing a bug where the regular weight of the math font was still using the old @math.cal[calligraphic letterforms] that were supposed to live in @text.stylistic-set[stylistic set] 6 #pr(8552)" = "- Se actualizaron las fuentes New Computer Modern a la versión 8.1.1, lo que corrige un error por el cual el peso regular de la fuente matemática todavía usaba las antiguas @math.cal[formas caligráficas] que debían estar en el @text.stylistic-set[conjunto estilístico] 6 #pr(8552)"
"== Math <math>" = "== Matemática <math>"
"- Fixed a regression where alignment points did not work correctly when placed within @math.lr[`lr`] / matched delimiters #pr(8566)" = "- Se corrigió una regresión por la cual los puntos de alineación no funcionaban bien dentro de @math.lr[`lr`] / delimitadores emparejados #pr(8566)"
"- Fixed a regression where @math.op[`op`] elements could be vertically misaligned #pr(8546)" = "- Se corrigió una regresión por la cual los elementos @math.op[`op`] podían quedar desalineados verticalmente #pr(8546)"
"== Layout <layout>" = "== Diseño <layout>"
"- Fixed a bug where gaps could appear in multi-page lists with @enum.number-align[`number-align`] / @list.marker-align[`marker-align`] set to an alignment with a vertical component #pr(8649)" = "- Se corrigió un error por el cual podían aparecer huecos en las listas de varias páginas con @enum.number-align[`number-align`] / @list.marker-align[`marker-align`] establecido en una alineación con componente vertical #pr(8649)"
"= Export <export>" = "= Exportación <export>"
"== SVG <svg>" = "== SVG <svg>"
"- Fixed that inline SVGs resulting from @html.frame elements did not respect pretty printing #pr(8535)" = "- Se corrigió que los SVG en línea resultantes de elementos @html.frame no respetaran el formato legible (pretty printing) #pr(8535)"
"== Bundle <bundle>" = "== Bundle <bundle>"
"- In the watch server, the automatic selection of appropriate `Content-Type` headers based on file extensions was expanded to include more commonly used file types (e.g. `json` files) #pr(8650)" = "- En el servidor de watch, se amplió la selección automática de los encabezados `Content-Type` adecuados según la extensión del archivo para incluir más tipos de archivo de uso común (p. ej., archivos `json`) #pr(8650)"
"- The error for PNG/SVG documents with multiple pages is now only raised if it persists until the final document iteration #pr(8618)" = "- El error para documentos PNG/SVG con varias páginas ahora solo se produce si persiste hasta la última iteración del documento #pr(8618)"
"= Command Line Interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- The `typst eval` subcommand will now exit with code 1 when the provided expression fails to evaluate #pr(8623)" = "- El subcomando `typst eval` ahora termina con el código 1 cuando la expresión provista no se puede evaluar #pr(8623)"

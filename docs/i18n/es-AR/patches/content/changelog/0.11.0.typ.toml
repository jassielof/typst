# Line patches for docs/content/changelog/0.11.0.typ (see docs/src/i18n.rs).
"= Tables <tables>" = "= Tablas <tables>"
"- Tables are now _much_ more flexible, read the new @guides:tables[Table Guide] to get started" = "- Las tablas ahora son _mucho_ más flexibles; leé la nueva @guides:tables[Guía de tablas] para empezar"
"- Added @table.cell element for per-cell configuration" = "- Se agregó el elemento @table.cell para configurar celda por celda"
"- Cells can now span multiple @table.cell.colspan[columns] or @table.cell.rowspan[rows]" = "- Las celdas ahora pueden abarcar varias @table.cell.colspan[columnas] o @table.cell.rowspan[filas]"
"- The @table.cell.stroke[stroke] of individual cells can now be customized" = "- Ahora se puede personalizar el @table.cell.stroke[trazo] de cada celda"
"- The @table.align[`align`] and @table.inset[`inset`] arguments of the table function now also take `{(x, y) => ..}` functions" = "- Los argumentos @table.align[`align`] e @table.inset[`inset`] de la función table ahora también aceptan funciones `{(x, y) => ..}`"
"- Added @table.hline and @table.vline for convenient line customization" = "- Se agregaron @table.hline y @table.vline para personalizar líneas con comodidad"
"- Added @table.header element for table headers that repeat on every page" = "- Se agregó el elemento @table.header para encabezados de tabla que se repiten en cada página"
"- Added @table.footer element for table footers that repeat on every page" = "- Se agregó el elemento @table.footer para pies de tabla que se repiten en cada página"
"- All the new table functionality is also available for @grid[grids]" = "- Toda la nueva funcionalidad de tablas también está disponible para las @grid[grillas]"
"- Fixed gutter-related bugs" = "- Se corrigieron errores relacionados con las separaciones (gutters)"
"_Thanks to #gh(\"PgBiel\") for his work on tables!_" = "_¡Gracias a #gh(\"PgBiel\") por su trabajo en las tablas!_"
"= Templates <templates>" = "= Plantillas <templates>"
"- You can now use template packages to get started with new projects. Click _Start from template_ on the web app's dashboard and choose your preferred template or run the `typst init <template>` command in the CLI. You can #link(\"https://typst.app/universe/search/?kind=templates\")[browse the available templates here]." = "- Ahora podés usar paquetes de plantillas para empezar proyectos nuevos. Hacé clic en _Start from template_ en el panel de la app web y elegí la plantilla que prefieras, o ejecutá el comando `typst init <template>` en la CLI. Podés #link(\"https://typst.app/universe/search/?kind=templates\")[explorar acá las plantillas disponibles]."
"- Switching templates after the fact has become easier. You can just import a styling function from a different template package." = "- Cambiar de plantilla a posteriori ahora es más fácil. Alcanza con importar una función de estilos de otro paquete de plantilla."
"- Package authors can now submit their own templates to the #link(\"https://github.com/typst/packages\")[package repository]. Share a template for a paper, your institution, or an original work to help the community get a head start on their projects." = "- Los autores de paquetes ahora pueden enviar sus propias plantillas al #link(\"https://github.com/typst/packages\")[repositorio de paquetes]. Compartí una plantilla para un paper, para tu institución o para una obra original y ayudá a la comunidad a arrancar con ventaja sus proyectos."
"- Templates and packages are now organized by category and discipline. Filter packages by either taxonomy in the _Start from template_ wizard. If you are a package author, take a look at the new documentation for #link(\"https://github.com/typst/packages/blob/main/docs/CATEGORIES.md\")[categories] and #link(\"https://github.com/typst/packages/blob/main/docs/DISCIPLINES.md\")[disciplines]." = "- Las plantillas y los paquetes ahora están organizados por categoría y disciplina. Filtrá los paquetes por cualquiera de las dos taxonomías en el asistente _Start from template_. Si sos autor de paquetes, mirá la nueva documentación de #link(\"https://github.com/typst/packages/blob/main/docs/CATEGORIES.md\")[categorías] y #link(\"https://github.com/typst/packages/blob/main/docs/DISCIPLINES.md\")[disciplinas]."
"= Context <context>" = "= Contexto <context>"
"- Added _context expressions:_ Read the chapter on @reference:context[context] to get started" = "- Se agregaron las _expresiones de contexto:_ leé el capítulo sobre @reference:context[contexto] para empezar"
"- With context, you can access settable properties, e.g. `{context text.lang}` to access the language set via `{set text(lang: \"..\")}`" = "- Con el contexto, podés acceder a propiedades configurables con set, p. ej., `{context text.lang}` para acceder al idioma establecido con `{set text(lang: \"..\")}`"
"- The following existing functions have been made contextual: @query, @locate, @measure, @counter.display, @counter.at, @counter.final, @state.at, and @state.final" = "- Las siguientes funciones existentes pasaron a ser contextuales: @query, @locate, @measure, @counter.display, @counter.at, @counter.final, @state.at y @state.final"
"- Added contextual methods @counter.get and @state.get to retrieve the value of a counter or state in the current context" = "- Se agregaron los métodos contextuales @counter.get y @state.get para obtener el valor de un contador o estado en el contexto actual"
"- Added contextual function @here to retrieve the @location[location] of the current context" = "- Se agregó la función contextual @here para obtener la @location[ubicación] del contexto actual"
"- The @locate function now returns the location of a selector's unique match. Its old behavior has been replaced by context expressions and only remains temporarily available for compatibility." = "- La función @locate ahora devuelve la ubicación de la única coincidencia de un selector. Su comportamiento anterior fue reemplazado por las expresiones de contexto y solo sigue disponible de forma temporal por compatibilidad."
"- The @counter.at and @state.at methods are now more flexible: They directly accept any kind of @location:locatable[locatable] selector with a unique match (e.g. a label) instead of just locations" = "- Los métodos @counter.at y @state.at ahora son más flexibles: aceptan directamente cualquier tipo de selector @location:locatable[localizable] con una única coincidencia (p. ej., una etiqueta) y no solo ubicaciones"
"- When context is available, @counter.display now directly returns the result of applying the numbering instead of yielding opaque content. It should not be used anymore without context. (Deprecation planned)" = "- Cuando hay contexto disponible, @counter.display ahora devuelve directamente el resultado de aplicar la numeración en lugar de producir contenido opaco. Ya no debería usarse sin contexto. (Se planea declararlo obsoleto)"
"- The `state.display` function should not be used anymore, use @state.get instead (Deprecation planned)" = "- La función `state.display` ya no debería usarse; usá @state.get en su lugar (Se planea declararlo obsoleto)"
"- The `location` argument of @query, @counter.final, and @state.final should not be used anymore (Deprecation planned)" = "- El argumento `location` de @query, @counter.final y @state.final ya no debería usarse (Se planea declararlo obsoleto)"
"- The `styles` argument of the `measure` function should not be used anymore (Deprecation planned)" = "- El argumento `styles` de la función `measure` ya no debería usarse (Se planea declararlo obsoleto)"
"- The `style` function should not be used anymore, use context instead (Deprecation planned)" = "- La función `style` ya no debería usarse; usá contexto en su lugar (Se planea declararlo obsoleto)"
"- The correct context is now also provided in various other places where it is available, e.g. in show rules, layout callbacks, and numbering functions in the outline" = "- Ahora también se proporciona el contexto correcto en varios otros lugares donde está disponible, p. ej., en reglas show, funciones de retorno de llamada de diseño y funciones de numeración del índice"
"= Styling <styling>" = "= Estilos <styling>"
"- Fixed priority of multiple @reference:styling:show-rules[show-set rules]: They now apply in the same order as normal set rules would" = "- Se corrigió la prioridad de varias @reference:styling:show-rules[reglas show-set]: ahora se aplican en el mismo orden que las reglas set normales"
"- Show-set rules on the same element (e.g. `{show heading.where(level: 1): set heading(numbering: \"1.\")}`) now work properly" = "- Las reglas show-set sobre el mismo elemento (p. ej., `{show heading.where(level: 1): set heading(numbering: \"1.\")}`) ahora funcionan correctamente"
"- Setting properties on an element within a transformational show rule (e.g. `{show heading: it => { set heading(..); it }}`) is *not* supported anymore (previously it also only worked sometimes); use show-set rules instead *(Breaking change)*" = "- Establecer propiedades de un elemento dentro de una regla show de transformación (p. ej., `{show heading: it => { set heading(..); it }}`) ya *no* se admite (antes tampoco funcionaba siempre); usá reglas show-set en su lugar *(Cambio incompatible)*"
"- Text show rules that match their own output now work properly (e.g. ``` {show \"cmd\": `cmd`}```)" = "- Las reglas show de texto que coinciden con su propia salida ahora funcionan correctamente (p. ej., ``` {show \"cmd\": `cmd`}```)"
"- The elements passed to show rules and returned by queries now contain all fields of their respective element functions rather than just specific ones" = "- Los elementos que se pasan a las reglas show y los que devuelven las consultas ahora contienen todos los campos de sus respectivas funciones de elemento y no solo algunos"
"- All settable properties can now be used in @function.where[where] selectors" = "- Todas las propiedades configurables con set ahora se pueden usar en selectores @function.where[where]"
"- @selector.and[And] and @selector.or[or] selectors can now be used with show rules" = "- Los selectores @selector.and[and] y @selector.or[or] ahora se pueden usar con reglas show"
"- Errors within show rules and context expressions are now ignored in all but the last introspection iteration, in line with the behavior of the old @locate" = "- Los errores dentro de reglas show y expresiones de contexto ahora se ignoran en todas las iteraciones de introspección salvo la última, en línea con el comportamiento del antiguo @locate"
"- Fixed a bug where document set rules were allowed after content" = "- Se corrigió un error por el cual se permitían reglas set de documento después de contenido"
"= Layout <layout>" = "= Diseño <layout>"
"- Added `reflow` argument to @rotate and @scale which lets them affect the layout" = "- Se agregó el argumento `reflow` a @rotate y @scale, que les permite afectar el diseño"
"- Fixed a bug where @place.float[floating placement] or @figure.placement[floating figures] could end up out of order" = "- Se corrigió un error por el cual la @place.float[ubicación flotante] o las @figure.placement[figuras flotantes] podían quedar fuera de orden"
"- Fixed overlap of text and figure for full-page floating figures" = "- Se corrigió la superposición de texto y figura en figuras flotantes de página completa"
"- Fixed various cases where the @hide function didn't hide its contents properly" = "- Se corrigieron varios casos en que la función @hide no ocultaba bien su contenido"
"- Fixed usage of @h and @v in @stack[stacks]" = "- Se corrigió el uso de @h y @v en @stack[pilas]"
"- Invisible content like a counter update will no longer force a visible block for just itself" = "- El contenido invisible, como una actualización de contador, ya no fuerza un bloque visible solo para él"
"- Fixed a bug with horizontal spacing followed by invisible content (like a counter update) directly at the start of a paragraph" = "- Se corrigió un error con un espaciado horizontal seguido de contenido invisible (como una actualización de contador) directamente al comienzo de un párrafo"
"= Text <text>" = "= Texto <text>"
"- Added @text.stroke[`stroke`] property for text" = "- Se agregó la propiedad @text.stroke[`stroke`] para el texto"
"- Added basic i18n for Serbian and Catalan" = "- Se agregó internacionalización básica para serbio y catalán"
"- Added support for contemporary Japanese @numbering[numbering] method" = "- Se agregó compatibilidad con el método de @numbering[numeración] japonesa contemporánea"
"- Added patches for various wrong metadata in specific fonts" = "- Se agregaron parches para varios metadatos erróneos en fuentes específicas"
"- The @text.dir[text direction] can now be overridden within a paragraph" = "- La @text.dir[dirección del texto] ahora se puede reemplazar dentro de un párrafo"
"- Fixed Danish @smartquote[smart quotes]" = "- Se corrigieron las @smartquote[comillas tipográficas] del danés"
"- Fixed font fallback next to a line break" = "- Se corrigió la fuente de reserva junto a un salto de línea"
"- Fixed width adjustment of JIS-style Japanese punctuation" = "- Se corrigió el ajuste de ancho de la puntuación japonesa de estilo JIS"
"- Fixed Finnish translation of \"Listing\"" = "- Se corrigió la traducción al finés de \"Listing\""
"- Fixed Z-ordering of multiple text decorations (underlines, etc.)" = "- Se corrigió el orden en Z de varias decoraciones de texto (subrayados, etc.)"
"- Fixed a bug due to which text @text.features[features] could not be overridden in consecutive set rules" = "- Se corrigió un error por el cual las @text.features[características] de texto no se podían reemplazar en reglas set consecutivas"
"= Model <model>" = "= Modelo <model>"
"- Added @heading.depth[`depth`] and @heading.offset[`offset`] arguments to heading to increase or decrease the heading level for a bunch of content; the heading syntax now sets `depth` rather than `level` *(Breaking change)*" = "- Se agregaron los argumentos @heading.depth[`depth`] y @heading.offset[`offset`] a heading para aumentar o disminuir el nivel de título de un conjunto de contenido; la sintaxis de títulos ahora establece `depth` en lugar de `level` *(Cambio incompatible)*"
"- List @list.marker[markers] now cycle by default" = "- Los @list.marker[marcadores] de lista ahora ciclan por defecto"
"- The @quote function now more robustly selects the correct quotes based on language and nesting" = "- La función @quote ahora selecciona con más robustez las comillas correctas según el idioma y el anidamiento"
"- Fixed indent bugs related to the default show rule of @terms[terms]" = "- Se corrigieron errores de sangría relacionados con la regla show predeterminada de @terms[términos]"
"= Math <math>" = "= Matemática <math>"
"- Inline equations now automatically linebreak at appropriate places" = "- Las ecuaciones en línea ahora saltan de línea automáticamente en los lugares adecuados"
"- Added @math.equation.number-align[`number-align`] argument to equations" = "- Se agregó el argumento @math.equation.number-align[`number-align`] a las ecuaciones"
"- Added support for adjusting the @math.accent.size[`size`] of accents relative to their base" = "- Se agregó compatibilidad para ajustar el @math.accent.size[`size`] de los acentos en relación con su base"
"- Improved positioning of accents" = "- Se mejoró el posicionamiento de los acentos"
"- @math.primes[Primes] are now always attached as @math.scripts[scripts] by default" = "- Las @math.primes[primas] ahora siempre se adjuntan como @math.scripts[scripts] por defecto"
"- Exposed @math.primes element which backs the `[$f'$]` syntax in math" = "- Se expuso el elemento @math.primes que respalda la sintaxis `[$f'$]` en matemática"
"- Math mode is not affected by @strong and @emph anymore" = "- El modo matemático ya no se ve afectado por @strong ni @emph"
"- Fixed @math.attach[`attach`] under @math.frac[fractions]" = "- Se corrigió @math.attach[`attach`] dentro de @math.frac[fracciones]"
"- Fixed that @math.class did not affect smart limit placement" = "- Se corrigió que @math.class no afectara la ubicación inteligente de límites"
"- Fixed weak spacing in @math.lr[`lr`] groups" = "- Se corrigió el espaciado débil en los grupos @math.lr[`lr`]"
"- Fixed layout of large operators for Cambria Math font" = "- Se corrigió el diseño de los operadores grandes para la fuente Cambria Math"
"- Fixed math styling of Hebrew symbol codepoints" = "- Se corrigió el estilo matemático de los puntos de código de símbolos hebreos"
"= Symbols <symbols>" = "= Símbolos <symbols>"
"- Added `gradient` as an alias for `nabla`" = "- Se agregó `gradient` como alias de `nabla`"
"- Added `partial` as an alias for `diff`, `diff` will be deprecated in the future" = "- Se agregó `partial` como alias de `diff`; `diff` quedará obsoleto en el futuro"
"- Added `colon.double`, `gt.approx`, `gt.napprox`, `lt.approx`, and `lt.napprox`" = "- Se agregaron `colon.double`, `gt.approx`, `gt.napprox`, `lt.approx` y `lt.napprox`"
"- Added `arrow.r.tilde` and `arrow.l.tilde`" = "- Se agregaron `arrow.r.tilde` y `arrow.l.tilde`"
"- Added `tilde.dot`" = "- Se agregó `tilde.dot`"
"- Added `forces` and `forces.not`" = "- Se agregaron `forces` y `forces.not`"
"- Added `space.nobreak.narrow`" = "- Se agregó `space.nobreak.narrow`"
"- Added `lrm` (Left-to-Right Mark) and `rlm` (Right-to-Left Mark)" = "- Se agregaron `lrm` (marca de izquierda a derecha) y `rlm` (marca de derecha a izquierda)"
"- Fixed `star.stroked` symbol (which previously had the wrong codepoint)" = "- Se corrigió el símbolo `star.stroked` (que antes tenía el punto de código equivocado)"
"= Scripting <scripting>" = "= Scripting <scripting>"
"- Arrays can now be compared lexicographically" = "- Ahora se pueden comparar arrays lexicográficamente"
"- Added contextual method @length.to-absolute[`to-absolute`] to lengths" = "- Se agregó el método contextual @length.to-absolute[`to-absolute`] a las longitudes"
"- Added @calc.root" = "- Se agregó @calc.root"
"- Added @int.signum and @float.signum methods" = "- Se agregaron los métodos @int.signum y @float.signum"
"- Added @float.is-nan and @float.is-infinite methods" = "- Se agregaron los métodos @float.is-nan y @float.is-infinite"
"- Added @int.bit-not, @int.bit-and, @int.bit-or, @int.bit-xor, @int.bit-lshift, and @int.bit-rshift methods" = "- Se agregaron los métodos @int.bit-not, @int.bit-and, @int.bit-or, @int.bit-xor, @int.bit-lshift y @int.bit-rshift"
"- Added @array.chunks method" = "- Se agregó el método @array.chunks"
"- A module can now be converted to a dictionary with the @dictionary.constructor[dictionary constructor] to access its contents dynamically" = "- Ahora se puede convertir un módulo en diccionario con el @dictionary.constructor[constructor de diccionarios] para acceder a su contenido de forma dinámica"
"- Added @csv.row-type[`row-type`] argument to `csv` function to configure how rows will be represented" = "- Se agregó el argumento @csv.row-type[`row-type`] a la función `csv` para configurar cómo se representan las filas"
"- @xml[XML parsing] now allows DTDs (document type definitions)" = "- El @xml[análisis de XML] ahora permite DTD (definiciones de tipo de documento)"
"- Improved formatting of negative numbers with @str and @repr" = "- Se mejoró el formato de los números negativos con @str y @repr"
"- For loops can now iterate over @bytes[bytes]" = "- Los bucles for ahora pueden iterar sobre @bytes[bytes]"
"- Fixed a bug with pattern matching in for loops" = "- Se corrigió un error con la coincidencia de patrones en bucles for"
"- Fixed a bug with labels not being part of @content.fields[`{.fields()}`] dictionaries" = "- Se corrigió un error por el cual las etiquetas no formaban parte de los diccionarios de @content.fields[`{.fields()}`]"
"- Fixed a bug where unnamed argument sinks wouldn't capture excess arguments" = "- Se corrigió un error por el cual los sumideros de argumentos sin nombre no capturaban los argumentos sobrantes"
"- Fixed typo in `repr` output of strokes" = "- Se corrigió un error tipográfico en la salida de `repr` de los trazos"
"= Syntax <syntax>" = "= Sintaxis <syntax>"
"- Added support for nested @reference:scripting:bindings[destructuring patterns]" = "- Se agregó compatibilidad con @reference:scripting:bindings[patrones de desestructuración] anidados"
"- Special spaces (like thin or non-breaking spaces) are now parsed literally instead of being collapsed into normal spaces *(Breaking change)*" = "- Los espacios especiales (como los espacios finos o los de no separación) ahora se analizan de forma literal en lugar de colapsarse en espacios normales *(Cambio incompatible)*"
"- Korean text can now use emphasis syntax without adding spaces *(Breaking change)*" = "- El texto coreano ahora puede usar la sintaxis de énfasis sin agregar espacios *(Cambio incompatible)*"
"- The token @reference:context[`context`] is now a keyword and cannot be used as an identifier anymore *(Breaking change)*" = "- El token @reference:context[`context`] ahora es una palabra clave y ya no se puede usar como identificador *(Cambio incompatible)*"
"- Nested line comments aren't allowed anymore in block comments *(Breaking change)*" = "- Ya no se permiten comentarios de línea anidados dentro de comentarios de bloque *(Cambio incompatible)*"
"- Fixed a bug where `x.)` would be treated as a field access" = "- Se corrigió un error por el cual `x.)` se trataba como un acceso a campo"
"- Text elements can now span across curly braces in markup" = "- Los elementos de texto ahora pueden abarcar llaves en el marcado"
"- Fixed silently wrong parsing when function name is parenthesized" = "- Se corrigió un análisis silenciosamente incorrecto cuando el nombre de la función está entre paréntesis"
"- Fixed various bugs with parsing of destructuring patterns, arrays, and dictionaries" = "- Se corrigieron varios errores en el análisis de patrones de desestructuración, arrays y diccionarios"
"= Tooling & Diagnostics <tooling-diagnostics>" = "= Herramientas y diagnósticos <tooling-diagnostics>"
"- Click-to-jump now works properly within @raw text" = "- El clic para saltar ahora funciona bien dentro de texto @raw"
"- Added suggestion for accessing a field if a method doesn't exist" = "- Se agregó una sugerencia para acceder a un campo si no existe un método"
"- Improved hint for calling a function stored in a dictionary" = "- Se mejoró la sugerencia para llamar a una función guardada en un diccionario"
"- Improved errors for mutable accessor functions on arrays and dictionaries" = "- Se mejoraron los errores de las funciones de acceso mutables en arrays y diccionarios"
"- Fixed error message when calling constructor of type that doesn't have one" = "- Se corrigió el mensaje de error al llamar al constructor de un tipo que no tiene uno"
"- Fixed confusing error message with nested dictionaries for strokes on different sides" = "- Se corrigió un mensaje de error confuso con diccionarios anidados para trazos en distintos lados"
"- Fixed autocompletion for multiple packages with the same name from different namespaces" = "- Se corrigió el autocompletado para varios paquetes con el mismo nombre de distintos espacios de nombres"
"= Visualization <visualization>" = "= Visualización <visualization>"
"- The @image function doesn't upscale images beyond their natural size anymore" = "- La función @image ya no amplía las imágenes más allá de su tamaño natural"
"- The @image function now respects rotation stored in EXIF metadata" = "- La función @image ahora respeta la rotación guardada en los metadatos EXIF"
"- Added support for SVG filters" = "- Se agregó compatibilidad con filtros SVG"
"- Added alpha component to @color.luma[`luma`] colors" = "- Se agregó el componente alfa a los colores @color.luma[`luma`]"
"- Added @color.transparentize and @color.opacify methods" = "- Se agregaron los métodos @color.transparentize y @color.opacify"
"- Improved @color.negate function" = "- Se mejoró la función @color.negate"
"- Added @highlight.stroke[`stroke`] and @highlight.radius[`radius`] arguments to `highlight` function" = "- Se agregaron los argumentos @highlight.stroke[`stroke`] y @highlight.radius[`radius`] a la función `highlight`"
"- Changed default @highlight color to be transparent" = "- Se cambió el color predeterminado de @highlight para que sea transparente"
"- CMYK to RGB conversion is now color-managed" = "- La conversión de CMYK a RGB ahora tiene gestión de color"
"- Fixed crash with gradients in Oklch color space" = "- Se corrigió un fallo con degradés en el espacio de color Oklch"
"- Fixed color-mixing for hue-based spaces" = "- Se corrigió la mezcla de colores en los espacios basados en matiz"
"- Fixed bugs with color conversion" = "- Se corrigieron errores en la conversión de colores"
"- SVG sizes are not rounded anymore, preventing slightly wrong aspect ratios" = "- Los tamaños de SVG ya no se redondean, lo que evita relaciones de aspecto ligeramente erróneas"
"- Fixed a few other SVG-related bugs" = "- Se corrigieron otros errores relacionados con SVG"
"- @color.components doesn't round anything anymore" = "- @color.components ya no redondea nada"
"= Export <export>" = "= Exportación <export>"
"- PDFs now contain named destinations for headings derived from their labels" = "- Los PDF ahora contienen destinos con nombre para los títulos, derivados de sus etiquetas"
"- The internal PDF structure was changed to make it easier for external tools to extract or modify individual pages, avoiding a bug with Typst PDFs in Apple Preview" = "- Se cambió la estructura interna del PDF para que sea más fácil que herramientas externas extraigan o modifiquen páginas individuales, lo que evita un error de los PDF de Typst en Vista Previa de Apple"
"- PDFs produced by Typst should now be byte-by-byte reproducible when `{set document(date: none)}` is set" = "- Los PDF producidos por Typst ahora deberían ser reproducibles byte a byte cuando se establece `{set document(date: none)}`"
"- Added missing flag to PDF annotation" = "- Se agregó un indicador faltante a las anotaciones de PDF"
"- Fixed multiple bugs with gradients in PDF export" = "- Se corrigieron varios errores con degradés en la exportación a PDF"
"- Fixed a bug with patterns in PDF export" = "- Se corrigió un error con patrones en la exportación a PDF"
"- Fixed a bug with embedding of grayscale images in PDF export" = "- Se corrigió un error con la incrustación de imágenes en escala de grises en la exportación a PDF"
"- Fixed a bug with To-Unicode mapping of CFF fonts in PDF export" = "- Se corrigió un error con la asignación To-Unicode de las fuentes CFF en la exportación a PDF"
"- Fixed a bug with the generation of the PDF outline" = "- Se corrigió un error en la generación del índice (outline) del PDF"
"- Fixed a sorting bug in PDF export leading to non-reproducible output" = "- Se corrigió un error de ordenamiento en la exportación a PDF que producía una salida no reproducible"
"- Fixed a bug with transparent text in PNG export" = "- Se corrigió un error con texto transparente en la exportación a PNG"
"- Exported SVG files now include units in their top-level `width` and `height`" = "- Los archivos SVG exportados ahora incluyen unidades en sus `width` y `height` de nivel superior"
"= Command line interface <command-line-interface>" = "= Interfaz de línea de comandos <command-line-interface>"
"- Added support for passing @sys[inputs] via a CLI flag" = "- Se agregó compatibilidad para pasar @sys[entradas] mediante un indicador de la CLI"
"- When passing the filename `-`, Typst will now read input from stdin" = "- Al pasar el nombre de archivo `-`, Typst ahora lee la entrada desde stdin"
"- Now uses the system-native TLS implementation for network fetching which should be generally more robust" = "- Ahora usa la implementación de TLS nativa del sistema para las descargas de red, que en general debería ser más robusta"
"- Watch mode will now properly detect when a previously missing file is created" = "- El modo watch ahora detecta correctamente cuando se crea un archivo que antes faltaba"
"- Added `--color` flag to configure whether to print colored output" = "- Se agregó el indicador `--color` para configurar si se imprime salida con colores"
"- Fixed user agent with which packages are downloaded" = "- Se corrigió el user agent con el que se descargan los paquetes"
"- Updated bundled fonts to the newest versions" = "- Se actualizaron las fuentes incluidas a las versiones más nuevas"
"= Development <development>" = "= Desarrollo <development>"
"- Added `--vendor-openssl` to CLI to configure whether to link OpenSSL statically instead of dynamically (not applicable to Windows and Apple platforms)" = "- Se agregó `--vendor-openssl` a la CLI para configurar si se enlaza OpenSSL de forma estática en lugar de dinámica (no se aplica a Windows ni a las plataformas de Apple)"
"- Removed old tracing (and its verbosity) flag from the CLI" = "- Se eliminó de la CLI el antiguo indicador de trazado (y de verbosidad)"
"- Added new `--timings` flag which supersedes the old flamegraph profiling in the CLI" = "- Se agregó el nuevo indicador `--timings`, que reemplaza al antiguo perfilado con flamegraph en la CLI"
"- Added minimal CLI to `typst-docs` crate for extracting the language and standard library documentation as JSON" = "- Se agregó una CLI mínima al crate `typst-docs` para extraer la documentación del lenguaje y de la biblioteca estándar como JSON"
"- The `typst_pdf::export` function's `ident` argument switched from `Option` to `Smart`. It should only be set to `Smart::Custom` if you can provide a stable identifier (like the web app can). The CLI sets `Smart::Auto`." = "- El argumento `ident` de la función `typst_pdf::export` pasó de `Option` a `Smart`. Solo debería establecerse en `Smart::Custom` si podés proporcionar un identificador estable (como puede hacerlo la app web). La CLI usa `Smart::Auto`."

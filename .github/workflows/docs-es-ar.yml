# Fork-only workflow: builds the Spanish (es-AR) documentation PDF and stores it
# as a build artifact and publishes it on GitHub Pages. It is a separate file so upstream merges never conflict
# with it; upstream's own workflows are left untouched.
name: Docs es-AR (PDF + Pages)
on:
  workflow_dispatch:
  push:
    branches: [docs-translation]

permissions:
  contents: read

jobs:
  pdf:
    name: Build es-AR PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Compile documentation
        run: cargo docit compile --format pdf --lang es-AR --release

      # Structure/glossary warnings only; never fails the build.
      - name: Check translations
        run: python3 tools/i18n check
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: typst-docs-es-AR
          path: docs/dist/docs-es-AR.pdf
          if-no-files-found: error
          retention-days: 30

      # Static page for GitHub Pages: the PDF plus a minimal landing page.
      - name: Prepare Pages site
        run: |
          mkdir _site
          cp docs/dist/docs-es-AR.pdf _site/docs-es-AR.pdf
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es-AR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Documentación de Typst (es-AR, no oficial)</title>
          </head>
          <body>
            <h1>Documentación de Typst en español rioplatense</h1>
            <p><strong>Traducción no oficial</strong>, generada con IA. Ante cualquier duda,
            prevalece la <a href="https://typst.app/docs">documentación oficial en inglés</a>.</p>
            <p><a href="docs-es-AR.pdf">Abrir el PDF</a></p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: pdf
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

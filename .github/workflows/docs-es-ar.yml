# Fork-only workflow: builds the Spanish (es-AR) documentation PDF and stores it
# as a build artifact and publishes it on GitHub Pages. It is a separate file so upstream
# merges never conflict with it; upstream's own workflows are left untouched.
name: Docs es-AR (PDF + website)
on:
  workflow_dispatch:
  push:
    branches: [docs-translation]

permissions:
  contents: read

jobs:
  pdf:
    name: Build es-AR PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Full history and tags: the docs show the commit, its date and the latest tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Compile documentation
        run: cargo docit compile --format pdf --lang es-AR --release

      # Structure/glossary warnings only; never fails the build.
      - name: Check translations
        run: python3 tools/i18n check
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: typst-docs-es-AR
          path: docs/dist/docs-es-AR.pdf
          if-no-files-found: error
          retention-days: 30


      # The website is served from `/<repo>/` on a project site. Set the repository
      # variables DOCS_BASE (e.g. `/`) and DOCS_ORIGIN (e.g. `https://docs.example.org`)
      # when using a custom domain. The origin feeds canonical URLs and the sitemap.
      - name: Compile website
        env:
          BASE: ${{ vars.DOCS_BASE || format('/{0}/', github.event.repository.name) }}
          ORIGIN: ${{ vars.DOCS_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
        run: |
          cargo docit compile --format website --lang es-AR --release \
            --input "base=$BASE" --input "origin=$ORIGIN" docs/i18n/es-AR/web.typ docs/dist/site-es-AR
          mkdir _site
          cp -r "docs/dist/site-es-AR${BASE}." _site/
          cp docs/dist/docs-es-AR.pdf "_site/Documentación de Typst.pdf"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: pdf
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
